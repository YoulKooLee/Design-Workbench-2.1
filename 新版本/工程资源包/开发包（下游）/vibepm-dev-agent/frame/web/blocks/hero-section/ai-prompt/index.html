<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>全高 AI 提示 · hero-ai-prompt</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="./block.css" />
  <style>
    body { background: #ffffff; }
    html[data-theme='dark'] body { background: var(--wa-color-bg, #0d0d0d); }
    html.wa-block-embed { height: 100%; }
    body.wa-block-embed { margin: 0; min-height: 0 !important; height: auto; background: transparent; }
    html[data-theme='dark'] body.wa-block-embed { background: transparent; }
    body.wa-block-embed #app { min-height: 0; }
  </style>
</head>
<body>
  <script>
    try {
      if (new URLSearchParams(location.search).get('embed') === '1') {
        document.documentElement.classList.add('wa-block-embed')
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('wa-block-embed')
        })
      }
    } catch (e) { /* ignore */ }
  </script>
  <div id="app" v-cloak>
    <section class="wa-section wa-fade-in" data-slug="hero-ai-prompt" id="hero">
      <!-- 演示用简化顶栏，非库存导航壳；交付骨架见 prompt §7 -->
      <header class="hero-ai-prompt__nav" aria-label="演示顶栏">
        <a class="hero-ai-prompt__brand" href="javascript:void(0)" @click.prevent="onCta('品牌')" aria-label="品牌">
          <span class="hero-ai-prompt__logo" aria-hidden="true"><i class="fa-solid fa-sparkles"></i></span>
        </a>
        <nav class="hero-ai-prompt__links" aria-label="主导航">
          <a href="javascript:void(0)" @click.prevent="onCta('产品')">产品</a>
          <a href="javascript:void(0)" @click.prevent="onCta('场景')">场景</a>
          <a href="javascript:void(0)" @click.prevent="onCta('定价')">定价</a>
          <a href="javascript:void(0)" @click.prevent="onCta('模板')">模板</a>
        </nav>
        <div class="hero-ai-prompt__nav-actions">
          <a-button type="primary" size="small" class="hero-ai-prompt__nav-cta" @click="onCta('开始使用')">开始使用</a-button>
          <button type="button" class="hero-ai-prompt__menu" aria-label="打开菜单" @click="menuOpen = true">
            <i class="fa-light fa-bars" aria-hidden="true"></i>
          </button>
        </div>
      </header>

      <div class="wa-section__inner hero-ai-prompt">
        <h1 class="wa-title">用 AI 设计界面。</h1>
        <p class="wa-lead">把一段短提示变成精致、可投产的布局，只需几秒。</p>

        <div class="hero-ai-prompt__box">
          <a-textarea
            v-model="prompt"
            :auto-size="{ minRows: 3, maxRows: 6 }"
            placeholder="描述你想设计的界面"
            class="hero-ai-prompt__input"
          ></a-textarea>
          <div class="hero-ai-prompt__box-bar">
            <a-button type="outline" shape="circle" aria-label="添加" @click="onCta('添加')">
              <i class="fa-light fa-plus" aria-hidden="true"></i>
            </a-button>
            <a-button type="primary" shape="circle" aria-label="发送" @click="onSend">
              <i class="fa-light fa-paper-plane" aria-hidden="true"></i>
            </a-button>
          </div>
        </div>

        <div class="hero-ai-prompt__suggestions" aria-label="示例提示">
          <a
            v-for="item in suggestions"
            :key="item"
            class="hero-ai-prompt__chip"
            href="javascript:void(0)"
            @click.prevent="useSuggestion(item)"
          >{{ item }}</a>
        </div>

        <p class="hero-ai-prompt__terms">
          向我们发送消息即表示你同意我们的使用条款，并确认已阅读隐私政策。
        </p>
      </div>
    </section>

    <a-drawer
      v-model:visible="menuOpen"
      title="菜单"
      :width="280"
      unmount-on-close
      @cancel="menuOpen = false"
    >
      <div class="hero-ai-prompt__drawer">
        <a href="javascript:void(0)" @click.prevent="onDrawer('产品')">产品</a>
        <a href="javascript:void(0)" @click.prevent="onDrawer('场景')">场景</a>
        <a href="javascript:void(0)" @click.prevent="onDrawer('定价')">定价</a>
        <a href="javascript:void(0)" @click.prevent="onDrawer('模板')">模板</a>
        <a-button type="primary" long @click="onDrawer('开始使用')">开始使用</a-button>
      </div>
    </a-drawer>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="./block.js"></script>
  <script src="../../embed-fit.js"></script>
</body>
</html>
