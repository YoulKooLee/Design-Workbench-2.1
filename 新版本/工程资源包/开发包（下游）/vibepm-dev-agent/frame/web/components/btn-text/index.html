<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文字按钮 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="btn-text">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">btn-text</p>
          <h1 class="wa-fam-title">文字按钮</h1>
          <p class="wa-fam-lead">无边框文字操作，用于行内链接式次要动作与表格操作列。</p>
          <p class="wa-fam-lead">组件类型：default / disabled</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="btn-text-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">文字按钮</span><span class="wa-comp-meta__slug">btn-text-default</span></div>
              <a-tooltip :content="famCopyTip('btn-text-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('btn-text-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('btn-text-default')"
                :aria-label="famCopyTip('btn-text-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('btn-text-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="text">文字按钮</a-button>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="btn-text-disabled">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">禁用文字按钮</span><span class="wa-comp-meta__slug">btn-text-disabled</span></div>
              <a-tooltip :content="famCopyTip('btn-text-disabled')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('btn-text-disabled') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('btn-text-disabled')"
                :aria-label="famCopyTip('btn-text-disabled')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('btn-text-disabled')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="text" disabled>禁用</a-button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'btn-text',
      members: ['btn-text-default', 'btn-text-disabled'],

    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
