<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>栅格 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />

</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="grid">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">grid</p>
          <h1 class="wa-fam-title">栅格</h1>
          <p class="wa-fam-lead">响应式多列分栏，用于内容区卡片与信息排布。</p>
          <p class="wa-fam-lead">组件类型：two-col / three-col / four-col</p>
        </header>
        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="grid-two-col">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">两列栅格</span><span class="wa-comp-meta__slug">grid-two-col</span></div>
              <a-tooltip :content="famCopyTip('grid-two-col')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('grid-two-col') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('grid-two-col')"
                :aria-label="famCopyTip('grid-two-col')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('grid-two-col')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-layout-demo">
              <a-row :gutter="[16, 16]">
                  <a-col :xs="24" :md="12">
                    <a-card class="wa-acard" title="左栏"><p class="wa-acard-desc">主内容或图文说明</p></a-card>
                  </a-col>
                  <a-col :xs="24" :md="12">
                    <a-card class="wa-acard" title="右栏"><p class="wa-acard-desc">侧栏信息或对照内容</p></a-card>
                  </a-col>
                </a-row>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="grid-three-col">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">三列栅格</span><span class="wa-comp-meta__slug">grid-three-col</span></div>
              <a-tooltip :content="famCopyTip('grid-three-col')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('grid-three-col') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('grid-three-col')"
                :aria-label="famCopyTip('grid-three-col')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('grid-three-col')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-layout-demo">
              <a-row :gutter="[16, 16]">
                  <a-col :xs="24" :sm="12" :md="8">
                    <a-card class="wa-acard" title="栏目一"><p class="wa-acard-desc">栅格列内容 A</p></a-card>
                  </a-col>
                  <a-col :xs="24" :sm="12" :md="8">
                    <a-card class="wa-acard" title="栏目二"><p class="wa-acard-desc">栅格列内容 B</p></a-card>
                  </a-col>
                  <a-col :xs="24" :sm="12" :md="8">
                    <a-card class="wa-acard" title="栏目三"><p class="wa-acard-desc">栅格列内容 C</p></a-card>
                  </a-col>
                </a-row>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="grid-four-col">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">四列栅格</span><span class="wa-comp-meta__slug">grid-four-col</span></div>
              <a-tooltip :content="famCopyTip('grid-four-col')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('grid-four-col') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('grid-four-col')"
                :aria-label="famCopyTip('grid-four-col')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('grid-four-col')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-layout-demo">
              <a-row :gutter="[16, 16]">
                  <a-col :xs="24" :sm="12" :md="6">
                    <a-card class="wa-acard" title="栏目一"><p class="wa-acard-desc">栅格列内容 A</p></a-card>
                  </a-col>
                  <a-col :xs="24" :sm="12" :md="6">
                    <a-card class="wa-acard" title="栏目二"><p class="wa-acard-desc">栅格列内容 B</p></a-card>
                  </a-col>
                  <a-col :xs="24" :sm="12" :md="6">
                    <a-card class="wa-acard" title="栏目三"><p class="wa-acard-desc">栅格列内容 C</p></a-card>
                  </a-col>
                  <a-col :xs="24" :sm="12" :md="6">
                    <a-card class="wa-acard" title="栏目四"><p class="wa-acard-desc">栅格列内容 D</p></a-card>
                  </a-col>
                </a-row>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>

    window.WA_FAMILY = {
      id: 'grid',

  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
