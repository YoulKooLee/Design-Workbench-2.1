<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>穿梭框 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="transfer">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">transfer</p>
          <h1 class="wa-fam-title">穿梭框</h1>
          <p class="wa-fam-lead">左右栏批量挑选，用于权限分配、字段配置与名单迁移。</p>
          <p class="wa-fam-lead">组件类型：default / search / simple / oneway</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="transfer-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">穿梭框</span><span class="wa-comp-meta__slug">transfer-default</span></div>
              <a-tooltip :content="famCopyTip('transfer-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('transfer-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('transfer-default')"
                :aria-label="famCopyTip('transfer-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('transfer-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-transfer
                :data="defaultData"
                v-model="defaultValue"
                :title="transferTitles"
              >
                <template #to-target-icon><icon-right :size=10 /></template>
                <template #to-source-icon><icon-left :size=10 /></template>
              </a-transfer>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="transfer-search">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">可搜索穿梭</span><span class="wa-comp-meta__slug">transfer-search</span></div>
              <a-tooltip :content="famCopyTip('transfer-search')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('transfer-search') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('transfer-search')"
                :aria-label="famCopyTip('transfer-search')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('transfer-search')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-transfer
                :data="searchData"
                v-model="searchValue"
                :title="transferTitles"
                show-search
                :source-input-search-props="{ placeholder: '搜索待选' }"
                :target-input-search-props="{ placeholder: '搜索已选' }"
              >
                <template #to-target-icon><icon-right :size=10 /></template>
                <template #to-source-icon><icon-left :size=10 /></template>
              </a-transfer>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="transfer-simple">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">简易穿梭</span><span class="wa-comp-meta__slug">transfer-simple</span></div>
              <a-tooltip :content="famCopyTip('transfer-simple')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('transfer-simple') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('transfer-simple')"
                :aria-label="famCopyTip('transfer-simple')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('transfer-simple')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-transfer
                :data="simpleData"
                v-model="simpleValue"
                :title="transferTitles"
                simple
              >
                <template #to-target-icon><icon-right :size=10 /></template>
                <template #to-source-icon><icon-left :size=10 /></template>
              </a-transfer>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="transfer-oneway">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">单向穿梭</span><span class="wa-comp-meta__slug">transfer-oneway</span></div>
              <a-tooltip :content="famCopyTip('transfer-oneway')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('transfer-oneway') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('transfer-oneway')"
                :aria-label="famCopyTip('transfer-oneway')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('transfer-oneway')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-transfer
                :data="onewayData"
                v-model="onewayValue"
                :title="transferTitles"
                one-way
              >
                <template #to-target-icon><icon-right :size=10 /></template>
                <template #to-source-icon><icon-left :size=10 /></template>
              </a-transfer>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'transfer',
      members: ['transfer-default', 'transfer-search', 'transfer-simple', 'transfer-oneway'],
      setup: function (api) {
        var baseData = [
          { key: '1', value: '1', label: '选项一' },
          { key: '2', value: '2', label: '选项二' },
          { key: '3', value: '3', label: '选项三' },
          { key: '4', value: '4', label: '选项四' },
          { key: '5', value: '5', label: '选项五' },
          { key: '6', value: '6', label: '选项六' },
        ]
        return {
          transferTitles: ['待选', '已选'],
          defaultData: baseData,
          defaultValue: api.ref(['2', '4']),
          searchData: [
            { key: '1', value: '1', label: '权限管理' },
            { key: '2', value: '2', label: '内容审核' },
            { key: '3', value: '3', label: '数据分析' },
            { key: '4', value: '4', label: '运营投放' },
            { key: '5', value: '5', label: '客户成功' },
            { key: '6', value: '6', label: '财务结算' },
            { key: '7', value: '7', label: '研发协作' },
            { key: '8', value: '8', label: '设计资源' },
          ],
          searchValue: api.ref(['2', '4']),
          simpleData: baseData,
          simpleValue: api.ref(['2', '4']),
          onewayData: baseData,
          onewayValue: api.ref(['2', '4']),
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
