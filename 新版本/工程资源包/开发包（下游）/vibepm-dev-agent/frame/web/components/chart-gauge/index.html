<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>仪表盘 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="../../assets/common/charts/shadcn-chart.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="chart-gauge">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">chart-gauge</p>
          <h1 class="wa-fam-title">仪表盘</h1>
          <p class="wa-fam-lead">进度弧或指针强调目标完成度与评分结果。</p>
          <p class="wa-fam-lead">组件类型：default / semi / score / needle</p>
        </header>
        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="chart-gauge-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">基础仪表盘</span><span class="wa-comp-meta__slug">chart-gauge-default</span></div>
              <a-tooltip :content="famCopyTip('chart-gauge-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-gauge-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-gauge-default')"
                :aria-label="famCopyTip('chart-gauge-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-gauge-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-chart-gauge-block">
                <div id="host-chart-gauge-default" class="shadcn-chart-host shadcn-chart-host--gauge shadcn-radial-host"></div>
              </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-gauge-semi">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">半环仪表盘</span><span class="wa-comp-meta__slug">chart-gauge-semi</span></div>
              <a-tooltip :content="famCopyTip('chart-gauge-semi')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-gauge-semi') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-gauge-semi')"
                :aria-label="famCopyTip('chart-gauge-semi')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-gauge-semi')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-chart-gauge-block">
                <div id="host-chart-gauge-semi" class="shadcn-chart-host shadcn-chart-host--gauge shadcn-radial-host"></div>
              </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-gauge-score">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">评分仪表盘</span><span class="wa-comp-meta__slug">chart-gauge-score</span></div>
              <a-tooltip :content="famCopyTip('chart-gauge-score')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-gauge-score') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-gauge-score')"
                :aria-label="famCopyTip('chart-gauge-score')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-gauge-score')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-chart-gauge-block">
                <div id="host-chart-gauge-score" class="shadcn-chart-host shadcn-chart-host--gauge shadcn-radial-host"></div>
                <div class="wa-chart-gauge-footer" data-gauge-footer="chart-gauge-score"></div>
              </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-gauge-needle">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">指针仪表盘</span><span class="wa-comp-meta__slug">chart-gauge-needle</span></div>
              <a-tooltip :content="famCopyTip('chart-gauge-needle')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-gauge-needle') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-gauge-needle')"
                :aria-label="famCopyTip('chart-gauge-needle')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-gauge-needle')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-chart-gauge-block">
                <div id="host-chart-gauge-needle" class="shadcn-chart-host shadcn-chart-host--gauge shadcn-radial-host"></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../vendor/unovis/unovis.min.js"></script>
  <script src="../../assets/common/charts/chart-palette.js"></script>
  <script src="../../assets/common/charts/shadcn-charts.js"></script>
  <script src="../../assets/common/charts/wa-chart-demos.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
  window.WA_FAMILY = {
    id: 'chart-gauge',
    members: ['chart-gauge-default', 'chart-gauge-semi', 'chart-gauge-score', 'chart-gauge-needle'],
    setup: function () {
      var charts = []
      Vue.onMounted(function () {
        Vue.nextTick(function () {
          if (!window.WaChartDemos) return
          charts = WaChartDemos.mountFamily('chart-gauge') || []
        })
      })
      Vue.onBeforeUnmount(function () {
        if (window.ProShadcnCharts) charts.forEach(function (c) { ProShadcnCharts.destroy(c) })
      })
      return {}
    }
  }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
