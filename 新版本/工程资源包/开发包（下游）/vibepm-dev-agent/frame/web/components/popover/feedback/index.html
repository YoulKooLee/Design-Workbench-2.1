<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>反馈气泡 · popover-feedback</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="popover-feedback">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">反馈气泡</span>
        <span class="wa-comp-meta__slug">popover-feedback</span>
      </div>
      <div class="wa-embed__stage">
        <a-popover title="反馈" trigger="click" content-class="wa-popover-panel wa-popover-panel--lg" :popup-visible="feedbackOpen" @popup-visible-change="onFeedbackVisible">
          <a-button type="secondary">反馈</a-button>
          <template #content>
            <div class="wa-popover-feedback">
              <a-textarea
                v-model="feedbackText"
                placeholder="告诉我们哪里可以改进…"
                :auto-size="{ minRows: 3, maxRows: 5 }"
              ></a-textarea>
              <div class="wa-popover-feedback__actions">
                <a-button type="primary" size="small" :disabled="!feedbackText.trim()" @click="sendFeedback">发送反馈</a-button>
              </div>
            </div>
          </template>
        </a-popover>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
