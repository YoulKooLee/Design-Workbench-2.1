<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="tree-checkable">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">复选树形控件</span>
        <span class="wa-comp-meta__slug">tree-checkable</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-tree-panel">
          <div class="wa-tree-panel__head">
            <span class="wa-tree-panel__title">选择部门</span>
            <span class="wa-tree-panel__count">{{ checkedKeys.length }} / {{ treeNodeCount }}</span>
          </div>
          <div class="wa-tree-panel__body">
            <a-tree
              class="wa-tree"
              block-node
              checkable
              :data="treeData"
              v-model:checked-keys="checkedKeys"
              v-model:expanded-keys="checkExpandedKeys"
            ></a-tree>
          </div>
        </div>
      </div>
    </article>
