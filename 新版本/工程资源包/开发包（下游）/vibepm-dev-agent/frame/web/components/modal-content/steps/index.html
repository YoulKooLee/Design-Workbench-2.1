<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>步骤内容对话框 · modal-content-steps</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="modal-content-steps">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">步骤内容对话框</span>
        <span class="wa-comp-meta__slug">modal-content-steps</span>
      </div>
      <div class="wa-embed__stage">
<a-button type="secondary" @click="visible = true">打开示例</a-button>
<a-modal
  v-model:visible="visible"
  title="导入向导"
  title-align="start"
  :width="640"
  unmount-on-close
  modal-class="pro-content-modal"
  @cancel="onCancel"
>
  <div class="mc-body">
    <a-steps :current="current">
      <a-step title="选择文件" description="上传表格"></a-step>
      <a-step title="核对字段" description="映射列名"></a-step>
      <a-step title="完成导入" description="查看结果"></a-step>
    </a-steps>
    <div class="mc-panel mc-step-panel" v-if="current === 1">
      <div class="mc-panel__title">第一步</div>
      <p class="mc-lead">请准备好待导入的 Excel / CSV 文件。</p>
    </div>
    <div class="mc-panel mc-step-panel" v-else-if="current === 2">
      <div class="mc-panel__title">第二步</div>
      <p class="mc-lead">确认字段映射是否与目标表结构一致。</p>
    </div>
    <div class="mc-panel mc-step-panel" v-else>
      <div class="mc-panel__title">第三步</div>
      <p class="mc-lead">导入完成，可在列表中查看最新数据。</p>
    </div>
  </div>
  <template #footer>
    <a-button type="secondary" shape="round" v-if="current > 1" @click="prev">上一步</a-button>
    <a-button shape="round" v-if="current < 3" type="primary" @click="next">下一步</a-button>
    <a-button shape="round" v-else type="primary" @click="finish">完成</a-button>
  </template>
</a-modal>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
