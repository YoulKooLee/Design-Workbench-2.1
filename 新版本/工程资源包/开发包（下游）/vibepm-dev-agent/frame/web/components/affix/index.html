<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>固钉 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="affix">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">affix</p>
          <h1 class="wa-fam-title">固钉</h1>
          <p class="wa-fam-lead">滚动时固定操作条或导航，保证关键控件始终可见。</p>
          <p class="wa-fam-lead">组件类型：default / bottom</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="affix-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">固钉</span><span class="wa-comp-meta__slug">affix-default</span></div>
              <a-tooltip :content="famCopyTip('affix-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('affix-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('affix-default')"
                :aria-label="famCopyTip('affix-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('affix-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-affix-demo">
                <div id="wa-affix-box" class="wa-affix-demo__scroll">
                  <a-affix :offset-top="0" target="#wa-affix-box">
                    <div class="wa-affix-demo__bar">
                      <a-button type="primary" size="small">固定操作</a-button>
                    </div>
                  </a-affix>
                  <div class="wa-affix-demo__body">
                    <p v-for="n in 16" :key="n">滚动内容 {{ n }}</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="affix-bottom">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">底部固钉</span><span class="wa-comp-meta__slug">affix-bottom</span></div>
              <a-tooltip :content="famCopyTip('affix-bottom')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('affix-bottom') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('affix-bottom')"
                :aria-label="famCopyTip('affix-bottom')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('affix-bottom')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-affix-demo">
                <div id="wa-affix-bottom-box" class="wa-affix-demo__scroll">
                  <div class="wa-affix-demo__body">
                    <p v-for="n in 16" :key="n">表单内容 {{ n }}</p>
                  </div>
                  <a-affix :offset-bottom="0" target="#wa-affix-bottom-box">
                    <div class="wa-affix-demo__bar wa-affix-demo__bar--bottom">
                      <a-button type="primary" size="small">提交</a-button>
                    </div>
                  </a-affix>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'affix',
      members: ['affix-default', 'affix-bottom'],
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
