<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>单选 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./border/component.css" />
  <link rel="stylesheet" href="./pill/component.css" />
  <link rel="stylesheet" href="./segment/component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="radio">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">radio</p>
          <h1 class="wa-fam-title">单选</h1>
          <p class="wa-fam-lead">表单互斥单选，含圆点、按钮组、描边、胶囊与分段，用于优先级或状态。</p>
          <p class="wa-fam-lead">组件类型：default / button / border / pill / disabled / segment</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="radio-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">单选</span><span class="wa-comp-meta__slug">radio-default</span></div>
              <a-tooltip :content="famCopyTip('radio-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('radio-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('radio-default')"
                :aria-label="famCopyTip('radio-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('radio-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-radio-group v-model="radioDefault" :options="radioOptions" />
            </div>
          </div>

          <div class="wa-fam-card" data-slug="radio-button">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">按钮单选</span><span class="wa-comp-meta__slug">radio-button</span></div>
              <a-tooltip :content="famCopyTip('radio-button')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('radio-button') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('radio-button')"
                :aria-label="famCopyTip('radio-button')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('radio-button')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-radio-group v-model="radioButton" type="button" :options="buttonRadioOptions" />
            </div>
          </div>

          <div class="wa-fam-card" data-slug="radio-border">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">边框单选</span><span class="wa-comp-meta__slug">radio-border</span></div>
              <a-tooltip :content="famCopyTip('radio-border')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('radio-border') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('radio-border')"
                :aria-label="famCopyTip('radio-border')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('radio-border')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-radio-group class="wa-bordered" v-model="borderRadio" :options="borderRadioOptions" />
            </div>
          </div>

          <div class="wa-fam-card" data-slug="radio-pill">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">胶囊单选</span><span class="wa-comp-meta__slug">radio-pill</span></div>
              <a-tooltip :content="famCopyTip('radio-pill')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('radio-pill') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('radio-pill')"
                :aria-label="famCopyTip('radio-pill')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('radio-pill')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-pills">
                  <button
                    v-for="opt in pillRadioOptions"
                    :key="'pr-' + opt.value"
                    type="button"
                    class="wa-pill"
                    :class="{ 'is-active': pillRadio === opt.value }"
                    @click="pillRadio = opt.value"
                  >{{ opt.label }}</button>
                </div>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="radio-disabled">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">禁用单选</span><span class="wa-comp-meta__slug">radio-disabled</span></div>
              <a-tooltip :content="famCopyTip('radio-disabled')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('radio-disabled') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('radio-disabled')"
                :aria-label="famCopyTip('radio-disabled')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('radio-disabled')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-radio-group v-model="disabledRadio" :options="disabledRadioOptions" disabled />
            </div>
          </div>
          <div class="wa-fam-card" data-slug="radio-segment">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">分段选择</span><span class="wa-comp-meta__slug">radio-segment</span></div>
              <a-tooltip :content="famCopyTip('radio-segment')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('radio-segment') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('radio-segment')"
                :aria-label="famCopyTip('radio-segment')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('radio-segment')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-segment">
                  <button
                    v-for="opt in segmentOptions"
                    :key="'sg-' + opt.value"
                    type="button"
                    class="wa-segment-item"
                    :class="{ 'is-active': segment === opt.value }"
                    @click="segment = opt.value"
                  >{{ opt.label }}</button>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'radio',
      members: [
        'radio-default',
        'radio-button',
        'radio-border',
        'radio-pill',
        'radio-disabled',
        'radio-segment',
      ],
      setup: function (api) {
        return {
          radioDefault: api.ref('normal'),
          radioButton: api.ref('schedule'),
          borderRadio: api.ref('week'),
          pillRadio: api.ref('a'),
          disabledRadio: api.ref('high'),
          radioOptions: [
            { label: '紧急项', value: 'urgent' },
            { label: '常规项', value: 'normal' },
            { label: '延后项', value: 'defer' },
          ],
          buttonRadioOptions: [
            { label: '立即处理', value: 'now' },
            { label: '排期执行', value: 'schedule' },
            { label: '暂不处理', value: 'hold' },
          ],
          borderRadioOptions: [
            { label: '按日汇总', value: 'day' },
            { label: '按周汇总', value: 'week' },
            { label: '按月汇总', value: 'month' },
          ],
          pillRadioOptions: [
            { label: '方案甲版', value: 'a' },
            { label: '方案乙版', value: 'b' },
            { label: '方案丙版', value: 'c' },
            { label: '方案丁版', value: 'd' },
          ],
          disabledRadioOptions: [
            { label: '高优先级', value: 'high' },
            { label: '中优先级', value: 'medium' },
            { label: '低优先级', value: 'low' },
          ],
          segment: api.ref('1'),
          segmentOptions: [
            { label: '选项一', value: '1' },
            { label: '选项二', value: '2' },
            { label: '选项三', value: '3' },
            { label: '选项四', value: '4' },
          ],
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
