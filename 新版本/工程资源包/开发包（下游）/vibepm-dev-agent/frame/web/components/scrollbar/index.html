<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>滚动容器 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="scrollbar">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">scrollbar</p>
          <h1 class="wa-fam-title">滚动容器</h1>
          <p class="wa-fam-lead">定高区域内嵌滚动，用于侧栏列表、画廊横滑与长内容嵌套。</p>
          <p class="wa-fam-lead">组件类型：vertical / horizontal</p>
        </header>
        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="scrollbar-vertical">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">纵向滚动</span><span class="wa-comp-meta__slug">scrollbar-vertical</span></div>
              <a-tooltip :content="famCopyTip('scrollbar-vertical')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('scrollbar-vertical') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('scrollbar-vertical')"
                :aria-label="famCopyTip('scrollbar-vertical')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('scrollbar-vertical')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-layout-demo">
              <a-scrollbar
                  type="embed"
                  outer-class="wa-sb-v"
                  :outer-style="{ width: '100%', maxWidth: '100%', height: '280px' }"
                  style="height:100%;width:100%;overflow:auto"
                >
                  <div class="wa-sb-grid">
                    <a-card
                      v-for="n in 12"
                      :key="n"
                      class="wa-sb-card wa-acard"
                      :title="'卡片标题 ' + n"
                    >
                      <p class="wa-acard-desc">这里是卡片主体内容说明。</p>
                    </a-card>
                  </div>
                </a-scrollbar>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="scrollbar-horizontal">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">横向滚动</span><span class="wa-comp-meta__slug">scrollbar-horizontal</span></div>
              <a-tooltip :content="famCopyTip('scrollbar-horizontal')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('scrollbar-horizontal') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('scrollbar-horizontal')"
                :aria-label="famCopyTip('scrollbar-horizontal')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('scrollbar-horizontal')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-layout-demo">
              <div class="wa-sb-clip">
                <a-scrollbar
                  type="embed"
                  :disable-vertical="true"
                  outer-class="wa-sb-h"
                  :outer-style="{ width: '100%', maxWidth: '100%', height: '150px' }"
                  style="height:100%;width:100%;overflow:auto"
                >
                  <div class="wa-sb-track">
                    <a-card
                      v-for="n in 10"
                      :key="n"
                      class="wa-sb-card wa-acard"
                      :title="'卡片标题 ' + n"
                    >
                      <p class="wa-acard-desc">这里是卡片主体内容说明。</p>
                    </a-card>
                  </div>
                </a-scrollbar>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'scrollbar',
      members: ['scrollbar-vertical', 'scrollbar-horizontal'],
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
