<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="form-vertical">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">垂直表单</span>
        <span class="wa-comp-meta__slug">form-vertical</span>
      </div>
      <div class="wa-embed__stage">
        <a-form class="wa-form" :model="form" layout="vertical">
  <a-form-item label="计划名称" field="name">
    <a-input v-model="form.name" placeholder="请输入计划名称" allow-clear />
  </a-form-item>
  <a-form-item label="投放渠道" field="channel">
    <a-select v-model="form.channel" :options="channelOptions" placeholder="请选择" allow-clear />
  </a-form-item>
  <a-form-item label="备注" field="remark">
    <a-textarea v-model="form.remark" placeholder="请输入备注" :auto-size="{ minRows: 2, maxRows: 4 }" />
  </a-form-item>
</a-form>
      </div>
    </article>
  </div>
