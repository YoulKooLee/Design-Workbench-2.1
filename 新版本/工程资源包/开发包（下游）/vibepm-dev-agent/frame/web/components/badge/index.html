<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>徽标 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="badge">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">badge</p>
          <h1 class="wa-fam-title">徽标</h1>
          <p class="wa-fam-lead">数字角标与状态点，用于消息未读、处理中与图标提醒。</p>
          <p class="wa-fam-lead">组件类型：status / count / max / dot</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="badge">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">状态徽标</span><span class="wa-comp-meta__slug">badge</span></div>
              <a-tooltip :content="famCopyTip('badge')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('badge') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('badge')"
                :aria-label="famCopyTip('badge')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('badge')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-badge-row">
                  <a-badge status="processing" text="处理中"></a-badge>
                  <a-badge status="danger" text="已拒绝"></a-badge>
                  <a-badge status="success" text="已通过"></a-badge>
                  <a-badge status="normal" text="已取消"></a-badge>
                  <a-badge status="warning" text="待审核"></a-badge>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="badge-count">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">数字徽标</span><span class="wa-comp-meta__slug">badge-count</span></div>
              <a-tooltip :content="famCopyTip('badge-count')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('badge-count') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('badge-count')"
                :aria-label="famCopyTip('badge-count')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('badge-count')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-badge :count="8">
                  <a-button type="secondary"><template #icon><icon-notification /></template></a-button>
                </a-badge>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="badge-max">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">封顶徽标</span><span class="wa-comp-meta__slug">badge-max</span></div>
              <a-tooltip :content="famCopyTip('badge-max')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('badge-max') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('badge-max')"
                :aria-label="famCopyTip('badge-max')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('badge-max')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-badge :count="1000" :max-count="999">
                  <a-button type="secondary"><template #icon><icon-message /></template></a-button>
                </a-badge>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="badge-dot">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">圆点徽标</span><span class="wa-comp-meta__slug">badge-dot</span></div>
              <a-tooltip :content="famCopyTip('badge-dot')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('badge-dot') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('badge-dot')"
                :aria-label="famCopyTip('badge-dot')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('badge-dot')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-badge dot :count="1">
                  <a-button type="secondary"><template #icon><icon-message /></template></a-button>
                </a-badge>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'badge',
      members: ['badge', 'badge-count', 'badge-max', 'badge-dot'],

    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
