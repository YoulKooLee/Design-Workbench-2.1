<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>箭头圆点画廊 · gallery-arrows-dots</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="gallery-arrows-dots">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">箭头圆点画廊</span>
        <span class="wa-comp-meta__slug">gallery-arrows-dots</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-gallery-wrap wa-gallery-wrap--arrows-dots">
          <div class="wa-gallery-arrows-dots__row">
            <a-button type="secondary" shape="circle" size="small" aria-label="上一张" :disabled="dotsCurrent <= 1" @click="dotsPrev">
              <icon-left></icon-left>
            </a-button>
            <a-carousel class="wa-gallery" v-model:current="dotsCurrent" show-arrow="never" indicator-type="never">
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_01.jpg" alt="产品图一" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_02.jpg" alt="产品图二" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_03.jpg" alt="产品图三" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_04.jpg" alt="产品图四" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_05.jpg" alt="产品图五" />
              </div>
            </a-carousel-item>
            </a-carousel>
            <a-button type="secondary" shape="circle" size="small" aria-label="下一张" :disabled="dotsCurrent >= galleryCount" @click="dotsNext">
              <icon-right></icon-right>
            </a-button>
          </div>
          <div class="wa-gallery-pills" role="tablist" aria-label="分页">
            <button
              type="button"
              class="wa-gallery-pill"
              :class="{ 'is-active': dotsCurrent === 1 }"
              :aria-label="'第1张'"
              @click="dotsCurrent = 1"
            ></button>
            <button
              type="button"
              class="wa-gallery-pill"
              :class="{ 'is-active': dotsCurrent === 2 }"
              :aria-label="'第2张'"
              @click="dotsCurrent = 2"
            ></button>
            <button
              type="button"
              class="wa-gallery-pill"
              :class="{ 'is-active': dotsCurrent === 3 }"
              :aria-label="'第3张'"
              @click="dotsCurrent = 3"
            ></button>
            <button
              type="button"
              class="wa-gallery-pill"
              :class="{ 'is-active': dotsCurrent === 4 }"
              :aria-label="'第4张'"
              @click="dotsCurrent = 4"
            ></button>
            <button
              type="button"
              class="wa-gallery-pill"
              :class="{ 'is-active': dotsCurrent === 5 }"
              :aria-label="'第5张'"
              @click="dotsCurrent = 5"
            ></button>
          </div>
        </div>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
