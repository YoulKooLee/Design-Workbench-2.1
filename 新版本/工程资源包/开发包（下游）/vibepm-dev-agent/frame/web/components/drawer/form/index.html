<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>表单抽屉 · drawer-form</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css?v=20261015demo3" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="drawer-form">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">表单抽屉</span>
        <span class="wa-comp-meta__slug">drawer-form</span>
      </div>
      <div class="wa-embed__stage">
        <a-button type="secondary" @click="visible = true">编辑资料</a-button>
        <a-drawer
          v-model:visible="visible"
          title="编辑资料"
          :width="400"
          body-class="wa-drawer-profile"
          unmount-on-close
          @cancel="visible = false"
        >
          <div class="wa-drawer-profile__avatar">
            <a-avatar :size="56">JD</a-avatar>
            <a-button type="text" class="wa-drawer-profile__change">更换头像</a-button>
          </div>
          <a-form class="wa-drawer-float-form" :model="form" layout="vertical">
            <a-form-item label="姓名">
              <a-input v-model="form.name" placeholder="请输入姓名" allow-clear></a-input>
            </a-form-item>
            <a-form-item label="邮箱">
              <a-input v-model="form.email" placeholder="请输入邮箱" allow-clear></a-input>
            </a-form-item>
            <a-form-item label="手机号">
              <a-input v-model="form.phone" placeholder="请输入手机号" allow-clear></a-input>
            </a-form-item>
            <a-form-item label="密码">
              <a-input-password v-model="form.password" placeholder="请输入密码" allow-clear></a-input-password>
            </a-form-item>
            <a-form-item label="确认密码">
              <a-input-password v-model="form.password2" placeholder="请再次输入密码" allow-clear></a-input-password>
            </a-form-item>
          </a-form>
          <template #footer>
            <a-button type="primary" shape="round" @click="visible = false">保存</a-button>
          </template>
        </a-drawer>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
