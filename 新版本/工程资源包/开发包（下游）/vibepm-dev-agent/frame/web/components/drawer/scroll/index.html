<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>可滚动抽屉 · drawer-scroll</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css?v=20261015demo3" />
  <link rel="stylesheet" href="../../item/component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="drawer-scroll">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">可滚动抽屉</span>
        <span class="wa-comp-meta__slug">drawer-scroll</span>
      </div>
      <div class="wa-embed__stage">
        <a-button type="secondary" @click="visible = true">查看动态</a-button>
        <a-drawer
          v-model:visible="visible"
          title="最近动态"
          :width="400"
          unmount-on-close
          @cancel="visible = false"
        >
          <div class="wa-item-stack">
            <div class="wa-item wa-item--outline" v-for="row in activities" :key="row.title">
              <div class="wa-item__media wa-item__media--primary">
                <component :is="row.icon" :size="15"></component>
              </div>
              <div class="wa-item__body">
                <div class="wa-item__title">{{ row.title }}</div>
                <div class="wa-item__desc">{{ row.desc }}</div>
              </div>
            </div>
          </div>
          <template #footer>
            <a-button type="secondary" shape="round" @click="visible = false">取消</a-button>
            <a-button type="primary" shape="round" @click="visible = false">确定</a-button>
          </template>
        </a-drawer>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
