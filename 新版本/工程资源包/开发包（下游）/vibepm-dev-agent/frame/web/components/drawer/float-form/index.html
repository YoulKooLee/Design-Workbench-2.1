<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>悬浮任务抽屉 · drawer-float-form</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css?v=20261015demo3" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="drawer-float-form">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">悬浮任务抽屉</span>
        <span class="wa-comp-meta__slug">drawer-float-form</span>
      </div>
      <div class="wa-embed__stage">
        <a-button type="secondary" @click="visible = true">添加任务</a-button>
        <a-drawer
          v-model:visible="visible"
          placement="right"
          :width="380"
          :closable="false"
          body-class="wa-drawer-float wa-drawer-float--right"
          unmount-on-close
          @cancel="visible = false"
        >
          <template #title>
            <div>
              <p class="wa-drawer-float__title">添加任务</p>
              <p class="wa-drawer-float__desc">新任务将加入默认分类。</p>
            </div>
          </template>
          <a-form class="wa-drawer-float-form" :model="form" layout="vertical">
            <a-form-item label="任务名称">
              <a-input v-model="form.name" placeholder="请输入任务名称" allow-clear></a-input>
            </a-form-item>
            <a-form-item label="负责人">
              <a-select v-model="form.assignee" placeholder="请选择负责人" allow-clear>
                <a-option value="ada">Ada</a-option>
                <a-option value="ben">Ben</a-option>
                <a-option value="cara">Cara</a-option>
              </a-select>
            </a-form-item>
            <a-form-item label="截止日期">
              <a-date-picker v-model="form.due" placeholder="选择日期" style="width: 100%"></a-date-picker>
            </a-form-item>
          </a-form>
          <template #footer>
            <a-button type="primary" shape="round" @click="visible = false">添加</a-button>
            <a-button type="secondary" shape="round" @click="visible = false">取消</a-button>
          </template>
        </a-drawer>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
