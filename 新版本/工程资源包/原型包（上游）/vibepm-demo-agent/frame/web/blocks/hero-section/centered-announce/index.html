<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>居中公告条 · hero-centered-announce</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="./block.css" />
  <style>
    body { background: #ffffff; }
    html[data-theme='dark'] body { background: var(--wa-color-bg, #0d0d0d); }
    /* embed：取消 base body{min-height:100vh}，否则 iframe 内按浏览器视口撑高 */
    html.wa-block-embed { height: 100%; }
    body.wa-block-embed { margin: 0; min-height: 0 !important; height: auto; background: #ffffff; }
    html[data-theme='dark'] body.wa-block-embed { background: var(--wa-color-bg, #0d0d0d); }
    body.wa-block-embed #app { min-height: 0; }
  </style>
</head>
<body>
  <script>
    try {
      if (new URLSearchParams(location.search).get('embed') === '1') {
        document.documentElement.classList.add('wa-block-embed')
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('wa-block-embed')
        })
      }
    } catch (e) { /* ignore */ }
  </script>
  <div id="app" v-cloak>
    <section class="wa-section wa-fade-in" data-slug="hero-centered-announce" id="hero">
      <div class="wa-section__inner hero-centered-announce">
        <div class="hero-centered-announce__pill">
          <span>宣布我们的新一轮融资。</span>
          <a class="hero-centered-announce__pill-link" href="javascript:void(0)" @click.prevent="onCta('了解更多')">了解更多</a>
        </div>
        <h1 class="wa-title">用创新工具释放你的创造力</h1>
        <p class="wa-lead">用一套工具释放你的潜力，把想法变成现实。轻松创造、构建与启发，并取得真正出色的成果。</p>
        <div class="wa-btn-row hero-centered-announce__actions">
          <a-button size="large" type="primary" @click="onCta('立即开始')">立即开始</a-button>
          <a-button size="large" type="text" class="hero-centered-announce__ghost" @click="onCta('了解更多')">
            了解更多 <i class="fa-light fa-arrow-right" aria-hidden="true"></i>
          </a-button>
        </div>
      </div>
    </section>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="./block.js"></script>
  <script src="../../embed-fit.js"></script>
</body>
</html>
