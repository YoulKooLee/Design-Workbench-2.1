<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>评分 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./text/component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="rate">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">rate</p>
          <h1 class="wa-fam-title">评分</h1>
          <p class="wa-fam-lead">表单星级评分，可半星、清除、只读，并在旁侧显示等级文字。</p>
          <p class="wa-fam-lead">组件类型：default / text / readonly / disabled</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="rate-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">评分</span><span class="wa-comp-meta__slug">rate-default</span></div>
              <a-tooltip :content="famCopyTip('rate-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('rate-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('rate-default')"
                :aria-label="famCopyTip('rate-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('rate-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-rate class="wa-rate" v-model="rateDefault" allow-half allow-clear />
            </div>
          </div>
          <div class="wa-fam-card" data-slug="rate-text">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">带文字评分</span><span class="wa-comp-meta__slug">rate-text</span></div>
              <a-tooltip :content="famCopyTip('rate-text')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('rate-text') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('rate-text')"
                :aria-label="famCopyTip('rate-text')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('rate-text')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-rate-with-text">
                  <a-rate class="wa-rate" v-model="rateText" allow-half allow-clear></a-rate>
                  <span class="wa-rate-label">{{ rateTextLabel }}</span>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="rate-readonly">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">只读评分</span><span class="wa-comp-meta__slug">rate-readonly</span></div>
              <a-tooltip :content="famCopyTip('rate-readonly')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('rate-readonly') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('rate-readonly')"
                :aria-label="famCopyTip('rate-readonly')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('rate-readonly')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-rate class="wa-rate" v-model="rateReadonly" allow-half readonly />
            </div>
          </div>
          <div class="wa-fam-card" data-slug="rate-disabled">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">禁用评分</span><span class="wa-comp-meta__slug">rate-disabled</span></div>
              <a-tooltip :content="famCopyTip('rate-disabled')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('rate-disabled') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('rate-disabled')"
                :aria-label="famCopyTip('rate-disabled')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('rate-disabled')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-rate class="wa-rate" v-model="rateDisabled" allow-half disabled />
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'rate',
      members: ['rate-default', 'rate-text', 'rate-readonly', 'rate-disabled'],
      setup: function (api) {
        var rateText = api.ref(4)
        return {
          rateDefault: api.ref(4),
          rateText: rateText,
          rateReadonly: api.ref(4),
          rateDisabled: api.ref(3),
          rateTextLabel: api.computed(function () {
            var n = Number(rateText.value) || 0
            if (n <= 0) return '未评分'
            if (n <= 1) return '极差'
            if (n <= 2) return '失望'
            if (n <= 3) return '一般'
            if (n <= 4) return '满意'
            return '惊喜'
          }),
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
