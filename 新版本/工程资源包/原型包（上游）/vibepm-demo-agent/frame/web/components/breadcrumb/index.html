<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>面包屑 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="breadcrumb">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">breadcrumb</p>
          <h1 class="wa-fam-title">面包屑</h1>
          <p class="wa-fam-lead">层级路径导航，帮助用户定位当前页并快速回到上级。</p>
          <p class="wa-fam-lead">组件类型：default / icon / separator / max-count</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="breadcrumb-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">面包屑</span><span class="wa-comp-meta__slug">breadcrumb-default</span></div>
              <a-tooltip :content="famCopyTip('breadcrumb-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('breadcrumb-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('breadcrumb-default')"
                :aria-label="famCopyTip('breadcrumb-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('breadcrumb-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-breadcrumb>
                <a-breadcrumb-item><a href="javascript:;"><icon-home></icon-home>首页</a></a-breadcrumb-item>
                <a-breadcrumb-item><a href="javascript:;">常用组件</a></a-breadcrumb-item>
                <a-breadcrumb-item>基础组件</a-breadcrumb-item>
              </a-breadcrumb>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="breadcrumb-icon">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">图标首页</span><span class="wa-comp-meta__slug">breadcrumb-icon</span></div>
              <a-tooltip :content="famCopyTip('breadcrumb-icon')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('breadcrumb-icon') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('breadcrumb-icon')"
                :aria-label="famCopyTip('breadcrumb-icon')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('breadcrumb-icon')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-breadcrumb>
                <a-breadcrumb-item>
                  <a class="wa-breadcrumb-home-icon" href="javascript:;" aria-label="首页"><icon-home></icon-home></a>
                </a-breadcrumb-item>
                <a-breadcrumb-item><a href="javascript:;">常用组件</a></a-breadcrumb-item>
                <a-breadcrumb-item>基础组件</a-breadcrumb-item>
              </a-breadcrumb>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="breadcrumb-separator">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">自定义分隔符</span><span class="wa-comp-meta__slug">breadcrumb-separator</span></div>
              <a-tooltip :content="famCopyTip('breadcrumb-separator')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('breadcrumb-separator') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('breadcrumb-separator')"
                :aria-label="famCopyTip('breadcrumb-separator')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('breadcrumb-separator')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-breadcrumb separator="/">
                <a-breadcrumb-item><a href="javascript:;">首页</a></a-breadcrumb-item>
                <a-breadcrumb-item><a href="javascript:;">文档中心</a></a-breadcrumb-item>
                <a-breadcrumb-item>快速开始</a-breadcrumb-item>
              </a-breadcrumb>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="breadcrumb-max-count">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">折叠面包屑</span><span class="wa-comp-meta__slug">breadcrumb-max-count</span></div>
              <a-tooltip :content="famCopyTip('breadcrumb-max-count')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('breadcrumb-max-count') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('breadcrumb-max-count')"
                :aria-label="famCopyTip('breadcrumb-max-count')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('breadcrumb-max-count')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-breadcrumb :max-count="3">
                <a-breadcrumb-item><a href="javascript:;">首页</a></a-breadcrumb-item>
                <a-breadcrumb-item><a href="javascript:;">产品</a></a-breadcrumb-item>
                <a-breadcrumb-item><a href="javascript:;">解决方案</a></a-breadcrumb-item>
                <a-breadcrumb-item><a href="javascript:;">行业方案</a></a-breadcrumb-item>
                <a-breadcrumb-item>详情</a-breadcrumb-item>
              </a-breadcrumb>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'breadcrumb',
      members: ['breadcrumb-default', 'breadcrumb-icon', 'breadcrumb-separator', 'breadcrumb-max-count'],
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
