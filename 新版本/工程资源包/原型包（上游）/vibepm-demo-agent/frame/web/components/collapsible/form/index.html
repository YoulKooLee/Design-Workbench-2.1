<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>回复表单 · collapsible-form</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="collapsible-form">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">回复表单</span>
        <span class="wa-comp-meta__slug">collapsible-form</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-collapsible-form">
          <div class="wa-collapsible-form__main">
            <a-avatar :size="36"><icon-user :size="14"></icon-user></a-avatar>
            <div class="wa-collapsible-form__body">
              <div class="wa-collapsible-form__meta">
                <strong>陈晓</strong>
                <span>2 小时前</span>
              </div>
              <p>刚做完一个很棒的新功能！你觉得怎么样？</p>
              <a-button
                type="secondary"
                size="mini"
                class="wa-collapsible-form__reply"
                :aria-expanded="isOpen ? 'true' : 'false'"
                @click="toggle"
              >
                回复
                <span class="wa-collapsible-chevron wa-collapsible-chevron--sm" :class="{ 'is-open': isOpen }"><icon-down :size="10"></icon-down></span>
              </a-button>
              <a-collapse v-model:active-key="activeKey" :bordered="false" :show-expand-icon="false" class="wa-collapsible wa-collapsible--bare">
                <a-collapse-item key="1" :show-expand-icon="false">
                  <div class="wa-collapsible-form__composer">
                    <a-input v-model="draft" placeholder="写下你的评论…" allow-clear></a-input>
                    <a-button type="primary" size="small" shape="round">发送</a-button>
                  </div>
                </a-collapse-item>
              </a-collapse>
            </div>
          </div>
        </div>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
