<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="overflow-list-overflow-slot">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">自定义折叠项</span>
        <span class="wa-comp-meta__slug">overflow-list-overflow-slot</span>
      </div>
      <div class="wa-embed__stage">
        <a-overflow-list style="width:240px">
          <a-tag v-for="t in tags" :key="t">{{ t }}</a-tag>
          <template #overflow="{ number }">
            <a-popover position="top">
              <a-tag>+{{ number }}</a-tag>
              <template #content>
                <div style="display:flex;flex-wrap:wrap;gap:8px;max-width:220px">
                  <a-tag v-for="t in overflowEnd(number)" :key="t">{{ t }}</a-tag>
                </div>
              </template>
            </a-popover>
          </template>
        </a-overflow-list>
      </div>
    </article>
  </div>
