<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>圆环图 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="../../assets/common/charts/shadcn-chart.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="chart-donut">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">chart-donut</p>
          <h1 class="wa-fam-title">圆环图</h1>
          <p class="wa-fam-lead">环形展示分类占比，适合渠道结构与份额扫读。</p>
          <p class="wa-fam-lead">组件类型：basic / compact</p>
        </header>
        <div class="wa-fam-grid">
          <div class="wa-fam-card shadcn-donut-card" data-slug="chart-donut-basic">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">基础圆环图</span><span class="wa-comp-meta__slug">chart-donut-basic</span></div>
              <a-tooltip :content="famCopyTip('chart-donut-basic')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-donut-basic') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-donut-basic')"
                :aria-label="famCopyTip('chart-donut-basic')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-donut-basic')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="shadcn-donut-layout">
                <div class="shadcn-donut-chart">
                  <div id="host-chart-donut-basic" class="shadcn-chart-host shadcn-donut-host" style="min-height:220px"></div>
                </div>
                <div class="shadcn-donut-legend-wrap">
                  <ul class="shadcn-donut-legend shadcn-donut-legend--inline" data-legend-for="chart-donut-basic"></ul>
                </div>
              </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-donut-compact">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">精简圆环图</span><span class="wa-comp-meta__slug">chart-donut-compact</span></div>
              <a-tooltip :content="famCopyTip('chart-donut-compact')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-donut-compact') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-donut-compact')"
                :aria-label="famCopyTip('chart-donut-compact')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-donut-compact')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-chart-donut-slot">
                <div id="host-chart-donut-compact" class="shadcn-chart-host shadcn-chart-host--donut"></div>
              </div>
              <div class="shadcn-chart-legend" data-legend-for="chart-donut-compact"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../vendor/unovis/unovis.min.js"></script>
  <script src="../../assets/common/charts/chart-palette.js"></script>
  <script src="../../assets/common/charts/shadcn-charts.js"></script>
  <script src="../../assets/common/charts/wa-chart-demos.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
  window.WA_FAMILY = {
    id: 'chart-donut',
    members: ['chart-donut-basic', 'chart-donut-compact'],
    setup: function () {
      var charts = []
      Vue.onMounted(function () {
        Vue.nextTick(function () {
          if (!window.WaChartDemos) return
          charts = WaChartDemos.mountFamily('chart-donut') || []
        })
      })
      Vue.onBeforeUnmount(function () {
        if (window.ProShadcnCharts) charts.forEach(function (c) { ProShadcnCharts.destroy(c) })
      })
      return {}
    }
  }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
