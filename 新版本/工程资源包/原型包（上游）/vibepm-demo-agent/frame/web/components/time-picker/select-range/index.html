  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="time-picker-select-range">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">固定时间点范围</span>
        <span class="wa-comp-meta__slug">time-picker-select-range</span>
      </div>
      <div class="wa-embed__stage">
        <div class="tp-select-range">
          <a-select
            v-model="start"
            :options="startOptions"
            placeholder="开始时间"
            allow-clear
            @change="onStartChange"
          >
            <template #arrow-icon><span></span></template>
          </a-select>
          <span class="tp-select-range__sep">-</span>
          <a-select
            v-model="end"
            :options="endOptions"
            placeholder="结束时间"
            allow-clear
          >
            <template #arrow-icon>
              <icon-clock-circle />
            </template>
          </a-select>
        </div>
      </div>
