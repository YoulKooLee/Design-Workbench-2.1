<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>面积图 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="../../assets/common/charts/shadcn-chart.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="chart-area">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">chart-area</p>
          <h1 class="wa-fam-title">面积图</h1>
          <p class="wa-fam-lead">用面积强调累计与趋势起伏，适合流量与内容量走势。</p>
          <p class="wa-fam-lead">组件类型：sharp / sharp-compare / smooth / smooth-compare</p>
        </header>
        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="chart-area-sharp">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">锋利面积图</span><span class="wa-comp-meta__slug">chart-area-sharp</span></div>
              <a-tooltip :content="famCopyTip('chart-area-sharp')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-area-sharp') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-area-sharp')"
                :aria-label="famCopyTip('chart-area-sharp')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-area-sharp')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-area-sharp" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-area-sharp"></div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-area-sharp-compare">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">锋利对比面积图</span><span class="wa-comp-meta__slug">chart-area-sharp-compare</span></div>
              <a-tooltip :content="famCopyTip('chart-area-sharp-compare')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-area-sharp-compare') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-area-sharp-compare')"
                :aria-label="famCopyTip('chart-area-sharp-compare')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-area-sharp-compare')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-area-sharp-compare" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-area-sharp-compare"></div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-area-smooth">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">圆滑面积图</span><span class="wa-comp-meta__slug">chart-area-smooth</span></div>
              <a-tooltip :content="famCopyTip('chart-area-smooth')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-area-smooth') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-area-smooth')"
                :aria-label="famCopyTip('chart-area-smooth')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-area-smooth')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-area-smooth" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-area-smooth"></div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-area-smooth-compare">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">圆滑对比面积图</span><span class="wa-comp-meta__slug">chart-area-smooth-compare</span></div>
              <a-tooltip :content="famCopyTip('chart-area-smooth-compare')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-area-smooth-compare') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-area-smooth-compare')"
                :aria-label="famCopyTip('chart-area-smooth-compare')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-area-smooth-compare')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-area-smooth-compare" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-area-smooth-compare"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../vendor/unovis/unovis.min.js"></script>
  <script src="../../assets/common/charts/chart-palette.js"></script>
  <script src="../../assets/common/charts/shadcn-charts.js"></script>
  <script src="../../assets/common/charts/wa-chart-demos.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
  window.WA_FAMILY = {
    id: 'chart-area',
    members: ['chart-area-sharp', 'chart-area-sharp-compare', 'chart-area-smooth', 'chart-area-smooth-compare'],
    setup: function () {
      var charts = []
      Vue.onMounted(function () {
        Vue.nextTick(function () {
          if (!window.WaChartDemos) return
          charts = WaChartDemos.mountFamily('chart-area') || []
        })
      })
      Vue.onBeforeUnmount(function () {
        if (window.ProShadcnCharts) charts.forEach(function (c) { ProShadcnCharts.destroy(c) })
      })
      return {}
    }
  }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
