<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="modal">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">modal</p>
          <h1 class="wa-fam-title">对话框</h1>
          <p class="wa-fam-lead">操作确认与结果弹窗，覆盖信息成功警告错误与删除确认。</p>
          <p class="wa-fam-lead">组件类型：info / success / warning / error / confirm</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="modal-info">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">信息对话框</span><span class="wa-comp-meta__slug">modal-info</span></div>
              <a-tooltip :content="famCopyTip('modal-info')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('modal-info') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('modal-info')"
                :aria-label="famCopyTip('modal-info')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('modal-info')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="secondary" @click="showModal('info')">信息弹窗</a-button>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="modal-success">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">成功对话框</span><span class="wa-comp-meta__slug">modal-success</span></div>
              <a-tooltip :content="famCopyTip('modal-success')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('modal-success') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('modal-success')"
                :aria-label="famCopyTip('modal-success')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('modal-success')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="secondary" status="success" @click="showModal('success')">成功弹窗</a-button>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="modal-warning">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">警告对话框</span><span class="wa-comp-meta__slug">modal-warning</span></div>
              <a-tooltip :content="famCopyTip('modal-warning')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('modal-warning') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('modal-warning')"
                :aria-label="famCopyTip('modal-warning')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('modal-warning')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="secondary" status="warning" @click="showModal('warning')">警告弹窗</a-button>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="modal-error">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">错误对话框</span><span class="wa-comp-meta__slug">modal-error</span></div>
              <a-tooltip :content="famCopyTip('modal-error')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('modal-error') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('modal-error')"
                :aria-label="famCopyTip('modal-error')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('modal-error')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="secondary" status="danger" @click="showModal('error')">错误弹窗</a-button>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="modal-confirm">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">确认对话框</span><span class="wa-comp-meta__slug">modal-confirm</span></div>
              <a-tooltip :content="famCopyTip('modal-confirm')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('modal-confirm') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('modal-confirm')"
                :aria-label="famCopyTip('modal-confirm')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('modal-confirm')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-button type="secondary" status="danger" @click="showModal('confirm')">确认弹窗</a-button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'modal',
      members: ['modal-info', 'modal-success', 'modal-warning', 'modal-error', 'modal-confirm'],
      setup: function (api) {
        return {
          showModal(type) {
            const dirs = {
              info: 'info',
              success: 'success',
              warning: 'warning',
              error: 'error',
              confirm: 'confirm',
            }
            const labels = {
              info: '信息对话框',
              success: '成功对话框',
              warning: '警告对话框',
              error: '错误对话框',
              confirm: '确认对话框',
            }
            if (
              window.WA_DR_HOST &&
              typeof window.WA_DR_HOST.openMemberDemo === 'function' &&
              window.WA_DR_HOST.openMemberDemo({
                slug: 'modal-' + type,
                dir: dirs[type] || type,
                label: labels[type] || type,
              })
            ) {
              return
            }
            const Modal = window.ArcoVue && ArcoVue.Modal
            if (!Modal) return
            const base = {
              simple: true,
              titleAlign: 'start',
              modalClass: 'pro-confirm-modal',
              width: 360,
              okButtonProps: { type: 'primary', shape: 'round' },
            }
            const map = {
              info: { title: '信息提示', content: '该操作将同步最新配置，请确认后继续。' },
              success: { title: '操作成功', content: '数据已保存，可在列表中查看最新结果。' },
              warning: { title: '风险提示', content: '当前环境为演示数据，部分操作不会真正生效。' },
              error: { title: '操作失败', content: '提交失败，请检查网络或稍后重试。' },
            }
            if (type === 'confirm') {
              Modal.confirm({
                ...base,
                title: '确定吗？',
                content: '确定要删除该账户吗？删除后所有数据将无法恢复。',
                okText: '确认',
                cancelText: '取消',
                cancelButtonProps: { type: 'secondary', shape: 'round' },
                onOk: () => {
                  const Msg = window.ArcoVue && ArcoVue.Message
                  if (Msg) Msg.success('已确认')
                },
              })
              return
            }
            const fn = Modal[type]
            if (fn) fn({ ...base, ...map[type] })
          },
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
