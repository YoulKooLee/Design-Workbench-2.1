<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>水印 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="watermark">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">watermark</p>
          <h1 class="wa-fam-title">水印</h1>
          <p class="wa-fam-lead">内容区加水印，用于演示脱敏、版权提示与防截图标识。</p>
          <p class="wa-fam-lead">组件类型：default / image-default</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="watermark-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">水印</span><span class="wa-comp-meta__slug">watermark-default</span></div>
              <a-tooltip :content="famCopyTip('watermark-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('watermark-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('watermark-default')"
                :aria-label="famCopyTip('watermark-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('watermark-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-watermark content="VibePM 演示" :font="{ color: 'rgba(0,0,0,0.12)' }">
                  <div style="width:100%;height:200px;padding:16px;box-sizing:border-box;border:1px solid var(--color-border-2);border-radius:4px">
                    <p style="margin:0;color:var(--color-text-2)">受保护的内容区域，滚动或截图仍可见水印。</p>
                  </div>
                </a-watermark>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="watermark-multi">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">多行水印</span><span class="wa-comp-meta__slug">watermark-multi</span></div>
              <a-tooltip :content="famCopyTip('watermark-multi')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('watermark-multi') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('watermark-multi')"
                :aria-label="famCopyTip('watermark-multi')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('watermark-multi')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-watermark :content="['VibePM', '仅供演示']" :gap="[80, 80]">
                  <div style="width:100%;height:200px;padding:16px;box-sizing:border-box;border:1px solid var(--color-border-2);border-radius:4px">
                    <p style="margin:0;color:var(--color-text-2)">多行水印示例内容。</p>
                  </div>
                </a-watermark>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'watermark',
      members: ['watermark-default', 'watermark-multi'],

    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
