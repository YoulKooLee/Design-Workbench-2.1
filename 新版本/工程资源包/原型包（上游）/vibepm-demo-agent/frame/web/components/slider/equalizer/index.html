<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="slider-equalizer">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">均衡器滑块</span>
        <span class="wa-comp-meta__slug">slider-equalizer</span>
      </div>

        <div class="wa-slider-eq">
          <div class="wa-slider-eq__band" v-for="(band, i) in bands" :key="band.label">
            <a-slider
              class="wa-slider wa-slider--vertical"
              v-model="bands[i].value"
              direction="vertical"
              :min="-5"
              :max="5"
              :step="1"
              :show-tooltip="false"
            ></a-slider>
            <span class="wa-slider-eq__label">{{ band.label }}</span>
          </div>
        </div>
      </div>
