<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导出内容对话框 · modal-content-export</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="modal-content-export">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">导出内容对话框</span>
        <span class="wa-comp-meta__slug">modal-content-export</span>
      </div>
      <div class="wa-embed__stage">
        <a-button type="secondary" @click="open">打开示例</a-button>
        <a-modal
          v-model:visible="visible"
          title="导出数据"
          title-align="start"
          :width="560"
          unmount-on-close
          modal-class="pro-content-modal"
          :footer="exportStatus === 'success' ? false : true"
          @cancel="close"
        >
          <div class="mc-body">
            <a-result
              v-if="exportStatus === 'success'"
              class="mc-result"
              status="success"
              title="导出任务已创建"
              subtitle="文件准备完成后可在下载中心查看，可关闭此窗口继续操作。"
            ></a-result>
            <a-form v-else :model="form" layout="vertical" class="mc-form mc-export-form">
              <a-form-item label="导出范围">
                <a-radio-group v-model="form.scope" direction="vertical">
                  <a-radio value="selected">仅勾选数据</a-radio>
                  <a-radio value="page">当前页</a-radio>
                  <a-radio value="all">全部筛选结果</a-radio>
                </a-radio-group>
              </a-form-item>
              <a-form-item label="导出格式">
                <a-radio-group v-model="form.format" direction="vertical">
                  <a-radio value="xlsx">Excel（.xlsx）</a-radio>
                  <a-radio value="csv">CSV（.csv）</a-radio>
                </a-radio-group>
              </a-form-item>
              <p class="mc-export-hint">预计导出 {{ exportCount }} 条</p>
            </a-form>
          </div>
          <template #footer>
            <template v-if="exportStatus !== 'success'">
              <a-button type="secondary" shape="round" @click="close">取消</a-button>
              <a-button shape="round" type="primary" @click="submit">开始导出</a-button>
            </template>
          </template>
        </a-modal>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
