<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>导入内容对话框 · modal-content-import</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../../upload/drag/component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="modal-content-import">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">导入内容对话框</span>
        <span class="wa-comp-meta__slug">modal-content-import</span>
      </div>
      <div class="wa-embed__stage">
<a-button type="secondary" @click="open">打开示例</a-button>
<a-modal
  v-model:visible="visible"
  title="导入数据"
  title-align="start"
  :width="560"
  unmount-on-close
  modal-class="pro-content-modal"
  :footer="importStatus === 'success' ? false : true"
  @cancel="close"
>
  <div class="mc-body">
    <a-result
      v-if="importStatus === 'success'"
      class="mc-result"
      status="success"
      title="导入成功"
      subtitle="数据已写入列表，可关闭此窗口继续操作。"
    ></a-result>
    <template v-else>
      <a-alert v-if="importStatus === 'warn'" class="mc-alert" type="warning" show-icon>
        请先选择要导入的文件。
      </a-alert>
      <div v-else class="mc-tip">
        <icon-info-circle class="mc-tip-icon"></icon-info-circle>
        <span class="mc-tip-text">支持 .xlsx / .xls / .csv，单文件不超过 10MB。</span>
      </div>
      <a-upload
        class="wa-upload-io"
        data-wa-upload="modal-import"
        draggable
        accept=".xlsx,.xls,.csv"
        :auto-upload="false"
        :limit="1"
        :show-upload-button="{ showOnExceedLimit: true }"
        :file-list="fileList"
        @change="onChange"
      >
        <template #cancel-icon>
          <i class="pro-fa-icon fa-solid fa-pause" aria-hidden="true"></i>
        </template>
        <template #start-icon>
          <i class="pro-fa-icon fa-solid fa-play" aria-hidden="true"></i>
        </template>
        <template #retry-icon>
          <a-tooltip content="重新上传">
            <i class="pro-fa-icon fa-light fa-arrows-rotate" aria-hidden="true"></i>
          </a-tooltip>
        </template>
        <template #error-icon>
          <i class="pro-fa-icon fa-solid fa-circle-exclamation" aria-hidden="true"></i>
        </template>
        <template #remove-icon>
          <a-tooltip content="删除">
            <i class="pro-fa-icon fa-light fa-trash" aria-hidden="true"></i>
          </a-tooltip>
        </template>
        <template #upload-button>
          <div class="wa-upload-drag">
            <div class="wa-upload-drag-icon"><icon-upload></icon-upload></div>
            <div class="wa-upload-drag-text">点击或拖拽文件到此处</div>
            <div class="wa-upload-drag-hint">仅支持 Excel / CSV</div>
          </div>
        </template>
      </a-upload>
    </template>
  </div>
  <template #footer>
    <template v-if="importStatus !== 'success'">
      <a-button type="secondary" shape="round" @click="close">取消</a-button>
      <a-button shape="round" type="primary" @click="submit">开始导入</a-button>
    </template>
  </template>
</a-modal>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../upload/upload-demo.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
