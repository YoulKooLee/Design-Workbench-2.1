<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>分割线 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="divider">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">divider</p>
          <h1 class="wa-fam-title">分割线</h1>
          <p class="wa-fam-lead">内容区块分隔，可嵌文字或虚线，宽度跟随所在容器。</p>
          <p class="wa-fam-lead">组件类型：default / dashed / with-text / with-text-dashed</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="divider-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">分割线</span><span class="wa-comp-meta__slug">divider-default</span></div>
              <a-tooltip :content="famCopyTip('divider-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('divider-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('divider-default')"
                :aria-label="famCopyTip('divider-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('divider-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-divider-demo">
                  <p class="wa-divider-demo__hint">上方内容</p>
                  <a-divider></a-divider>
                  <p class="wa-divider-demo__hint">下方内容</p>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="divider-dashed">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">虚线分割线</span><span class="wa-comp-meta__slug">divider-dashed</span></div>
              <a-tooltip :content="famCopyTip('divider-dashed')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('divider-dashed') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('divider-dashed')"
                :aria-label="famCopyTip('divider-dashed')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('divider-dashed')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-divider-demo">
                  <p class="wa-divider-demo__hint">上方内容</p>
                  <a-divider type="dashed"></a-divider>
                  <p class="wa-divider-demo__hint">下方内容</p>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="divider-with-text">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">文字分割线</span><span class="wa-comp-meta__slug">divider-with-text</span></div>
              <a-tooltip :content="famCopyTip('divider-with-text')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('divider-with-text') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('divider-with-text')"
                :aria-label="famCopyTip('divider-with-text')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('divider-with-text')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-divider-demo">
                  <p class="wa-divider-demo__hint">上方内容</p>
                  <a-divider orientation="center">分割线</a-divider>
                  <p class="wa-divider-demo__hint">下方内容</p>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="divider-with-text-dashed">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">虚线文字分割线</span><span class="wa-comp-meta__slug">divider-with-text-dashed</span></div>
              <a-tooltip :content="famCopyTip('divider-with-text-dashed')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('divider-with-text-dashed') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('divider-with-text-dashed')"
                :aria-label="famCopyTip('divider-with-text-dashed')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('divider-with-text-dashed')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-divider-demo">
                  <p class="wa-divider-demo__hint">上方内容</p>
                  <a-divider type="dashed" orientation="center">分割线</a-divider>
                  <p class="wa-divider-demo__hint">下方内容</p>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'divider',
      members: ['divider-default', 'divider-dashed', 'divider-with-text', 'divider-with-text-dashed'],

    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
