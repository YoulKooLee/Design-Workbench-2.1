<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片上传 · upload</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="upload">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">图片上传</span>
        <span class="wa-comp-meta__slug">upload</span>
      </div>
      <div class="wa-embed__stage">
        <a-upload
          data-wa-upload="picture"
          list-type="picture-card"
          accept="image/*"
          :limit="4"
          :auto-upload="false"
          :file-list="fileList"
          @change="onChange"
        >
          <template #upload-item="{ fileItem }">
            <div class="wa-upload-pic-item" :class="'is-' + fileItem.status">
              <img v-if="fileItem.url" :src="fileItem.url" :alt="fileItem.name" />
              <div v-if="fileItem.status === 'uploading'" class="wa-upload-pic-item__progress">
                <a-progress
                  type="circle"
                  size="mini"
                  :width="18"
                  :percent="fileItem.percent || 0"
                  :show-text="false"
                />
              </div>
              <div v-else-if="fileItem.status === 'error'" class="wa-upload-pic-item__error">
                <span class="wa-upload-pic-item__action" title="重新上传" @click.stop="retryFile(fileItem)"
                  ><icon-refresh
                /></span>
                <span class="wa-upload-pic-item__action" title="删除" @click.stop="removeFile(fileItem)"
                  ><icon-delete
                /></span>
              </div>
              <div
                v-else-if="fileItem.status === 'done' || fileItem.status === 'init'"
                class="wa-upload-pic-item__mask"
              >
                <span class="wa-upload-pic-item__action" title="查看" @click.stop="previewFile(fileItem)"
                  ><icon-eye
                /></span>
                <span class="wa-upload-pic-item__action" title="删除" @click.stop="removeFile(fileItem)"
                  ><icon-delete
                /></span>
              </div>
            </div>
          </template>
        </a-upload>
        <a-image-preview v-model:visible="previewVisible" :src="previewSrc" />
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../upload-demo.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
