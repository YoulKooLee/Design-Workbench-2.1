<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>按钮上传 · upload-button</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="upload-button">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">按钮上传</span>
        <span class="wa-comp-meta__slug">upload-button</span>
      </div>
      <div class="wa-embed__stage">
        <a-upload
  class="wa-upload-btn"
  data-wa-upload="button"
  list-type="text"
  accept=".jpg,.jpeg,.png,.pdf,.xlsx,.docx"
  :auto-upload="false"
  :limit="5"
  :file-list="fileList"
  @change="onChange"
>
  <template #cancel-icon>
    <i class="pro-fa-icon fa-solid fa-pause" aria-hidden="true"></i>
  </template>
  <template #start-icon>
    <i class="pro-fa-icon fa-solid fa-play" aria-hidden="true"></i>
  </template>
  <template #retry-icon>
    <a-tooltip content="重新上传">
      <i class="pro-fa-icon fa-light fa-arrows-rotate" aria-hidden="true"></i>
    </a-tooltip>
  </template>
  <template #error-icon>
    <i class="pro-fa-icon fa-solid fa-circle-exclamation" aria-hidden="true"></i>
  </template>
  <template #remove-icon>
    <a-tooltip content="删除">
      <i class="pro-fa-icon fa-light fa-trash" aria-hidden="true"></i>
    </a-tooltip>
  </template>
  <template #upload-button>
    <div class="wa-upload-btn-trigger">
      <a-button type="secondary">上传文件</a-button>
      <div class="wa-upload-tip" @click.stop.prevent>
        <icon-info-circle :size="14"></icon-info-circle>
        <span>支持 jpg、png、pdf、xlsx、docx，单文件不超过 10MB</span>
      </div>
    </div>
  </template>
</a-upload>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../upload-demo.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
