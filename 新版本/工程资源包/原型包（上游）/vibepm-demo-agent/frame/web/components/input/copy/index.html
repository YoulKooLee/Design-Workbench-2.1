<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="input-copy">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">一键复制</span>
        <span class="wa-comp-meta__slug">input-copy</span>
      </div>
      <div class="wa-embed__stage">
        <a-input
          class="wa-input-copy"
          v-model="value"
          readonly
        >
          <template #suffix>
            <a-tooltip :content="copied ? '已复制' : '复制'">
              <span
                class="wa-input-copy__btn"
                :class="{ 'is-copied': copied }"
                role="button"
                tabindex="0"
                :aria-label="copied ? '已复制' : '复制'"
                @click="copyValue"
                @keydown.enter.prevent="copyValue"
              >
                <icon-check v-if="copied"></icon-check>
                <icon-copy v-else></icon-copy>
              </span>
            </a-tooltip>
          </template>
        </a-input>
      </div>
    </article>
  </div>
