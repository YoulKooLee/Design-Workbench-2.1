<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>工具栏表格 · table-toolbar</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="table-toolbar">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">工具栏表格</span>
        <span class="wa-comp-meta__slug">table-toolbar</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-atable-shell">
          <div class="wa-atable-toolbar">
            <a-input-search
              v-model="keyword"
              allow-clear
              placeholder="搜索名称 / 城市 / 负责人"
            ></a-input-search>
            <a-space :size="8">
              <a-button v-if="selectedKeys.length" type="secondary" status="danger" size="small">
                批量删除（{{ selectedKeys.length }}）
              </a-button>
              <a-dropdown :hide-on-select="false" position="br">
                <a-button type="secondary">
                  <template #icon><icon-list></icon-list></template>
                  列设置
                </a-button>
                <template #content>
                  <a-doption
                    v-for="col in columnOptions"
                    :key="col.key"
                    class="wa-dropdown-check-option"
                  >
                    <a-checkbox
                      :model-value="visibleKeys.includes(col.key)"
                      @change="toggleColumn(col.key)"
                      @click.stop
                    >{{ col.label }}</a-checkbox>
                  </a-doption>
                </template>
              </a-dropdown>
            </a-space>
          </div>
          <a-table class="wa-atable"
            :columns="visibleColumns"
            :data="filteredData"
            row-key="key"
            :pagination="false"
            :bordered="false"
            :row-selection="{ type: 'checkbox', showCheckedAll: true }"
            :selected-keys="selectedKeys"
            @selection-change="onSelectionChange"
          >
            <template #status="{ record }">
              <a-tag size="small" bordered :color="statusColor(record.status)">{{ record.status }}</a-tag>
            </template>
          </a-table>
        </div>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
