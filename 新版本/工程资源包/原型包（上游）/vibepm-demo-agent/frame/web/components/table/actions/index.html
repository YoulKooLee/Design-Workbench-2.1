<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>行操作表格 · table-actions</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="table-actions">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">行操作表格</span>
        <span class="wa-comp-meta__slug">table-actions</span>
      </div>
      <div class="wa-embed__stage">
        <a-table class="wa-atable"
          :columns="columns"
          :data="data"
          row-key="key"
          :pagination="false"
          :bordered="false"
          :row-class="rowClass"
        >
          <template #drag="{ record }">
            <div
              class="wa-table-drag-cell"
              @dragover.prevent="onDragOver(record, $event)"
              @dragleave="onDragLeave(record)"
              @drop.prevent="onDrop(record, $event)"
            >
              <button
                type="button"
                class="wa-table-drag-handle"
                draggable="true"
                aria-label="拖动排序"
                @dragstart="onDragStart(record, $event)"
                @dragend="onDragEnd"
              >
                <icon-drag-dot-vertical></icon-drag-dot-vertical>
              </button>
            </div>
          </template>
          <template #status="{ record }">
            <a-tag size="small" bordered :color="statusColor(record.status)">{{ record.status }}</a-tag>
          </template>
          <template #operations>
            <a-space class="wa-table-ops" :size="0">
              <a-button type="text" size="small" aria-label="编辑">
                <template #icon><icon-edit></icon-edit></template>
              </a-button>
              <a-button type="text" size="small" status="danger" aria-label="删除">
                <template #icon><icon-delete></icon-delete></template>
              </a-button>
              <a-dropdown position="br">
                <a-button type="text" size="small" aria-label="更多操作">
                  <template #icon><icon-ellipsis></icon-ellipsis></template>
                </a-button>
                <template #content>
                  <a-doption>
                    <template #icon><icon-eye></icon-eye></template>
                    查看
                  </a-doption>
                  <a-doption>
                    <template #icon><icon-copy></icon-copy></template>
                    复制
                  </a-doption>
                  <div class="wa-dropdown-sep" role="separator"></div>
                  <a-doption class="wa-dropdown-danger">
                    <template #icon><icon-delete></icon-delete></template>
                    删除
                  </a-doption>
                </template>
              </a-dropdown>
            </a-space>
          </template>
        </a-table>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
