<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>下拉选择 · calendar-select</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../header/component.css" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="calendar-select">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">下拉选择</span>
        <span class="wa-comp-meta__slug">calendar-select</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-cal-wrap">
          <div class="wa-cal-toolbar">
            <span class="wa-cal-toolbar__title">{{ selectLabel }}</span>
            <div class="wa-cal-toolbar__actions">
              <div class="wa-cal-selects">
                <a-select
                  class="wa-cal-selects__year"
                  v-model="selectYear"
                  :options="yearOptions"
                  size="small"
                  :allow-search="false"
                  style="width:100px"
                ></a-select>
                <a-select
                  class="wa-cal-selects__month"
                  v-model="selectMonth"
                  :options="monthOptions"
                  size="small"
                  :allow-search="false"
                  style="width:80px"
                ></a-select>
              </div>
              <a-button type="secondary" class="wa-cal-today" @click="goToday">今天</a-button>
            </div>
          </div>
          <a-calendar :key="panelKey" v-model="value" :modes="['month']" />
        </div>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
