<html lang="zh-CN">
<head>

<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>头像 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />

  <link rel="stylesheet" href="./text/component.css" />
  <link rel="stylesheet" href="./trigger/component.css" />

<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="avatar">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">avatar</p>
          <h1 class="wa-fam-title">头像</h1>
          <p class="wa-fam-lead">用户头像展示与更换入口，支持圆形方形、文字、照片组与可编辑入口。</p>
          <p class="wa-fam-lead">组件类型：default / square / text / trigger / group-text / group-photo</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="avatar-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">头像</span><span class="wa-comp-meta__slug">avatar-default</span></div>
              <a-tooltip :content="famCopyTip('avatar-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('avatar-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('avatar-default')"
                :aria-label="famCopyTip('avatar-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('avatar-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-avatar :size="40"><icon-avatar /></a-avatar>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="avatar-square">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">方形头像</span><span class="wa-comp-meta__slug">avatar-square</span></div>
              <a-tooltip :content="famCopyTip('avatar-square')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('avatar-square') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('avatar-square')"
                :aria-label="famCopyTip('avatar-square')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('avatar-square')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-avatar :size="40" shape="square"><icon-avatar /></a-avatar>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="avatar-text">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">文字头像</span><span class="wa-comp-meta__slug">avatar-text</span></div>
              <a-tooltip :content="famCopyTip('avatar-text')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('avatar-text') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('avatar-text')"
                :aria-label="famCopyTip('avatar-text')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('avatar-text')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-avatar
                  :size="40"
                  :auto-fix-font-size="false"
                  :style="{ backgroundColor: 'rgb(var(--primary-6))' }"
                >李</a-avatar>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="avatar-trigger">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">可编辑头像</span><span class="wa-comp-meta__slug">avatar-trigger</span></div>
              <a-tooltip :content="famCopyTip('avatar-trigger')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('avatar-trigger') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('avatar-trigger')"
                :aria-label="famCopyTip('avatar-trigger')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('avatar-trigger')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div
                  class="wa-avatar-trigger"
                  title="更换头像"
                  role="button"
                  tabindex="0"
                  @click="onAvatarClick"
                  @keydown.enter.prevent="onAvatarClick"
                >
                  <input
                    ref="avatarInput"
                    class="wa-avatar-trigger__input"
                    type="file"
                    accept="image/png,image/jpeg,image/webp,image/gif"
                    @change="onAvatarChange"
                    @click.stop
                  />
                  <div class="wa-avatar-trigger__shell" :class="{ 'has-image': !!avatarUrl }">
                    <img v-if="avatarUrl" class="wa-avatar-trigger__img" :src="avatarUrl" alt="avatar" />
                    <span v-else class="wa-avatar-trigger__placeholder" aria-hidden="true"><icon-avatar /></span>
                  </div>
                  <span class="wa-avatar-trigger__camera" aria-hidden="true"><icon-camera /></span>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="avatar-group-text">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">文字头像组</span><span class="wa-comp-meta__slug">avatar-group-text</span></div>
              <a-tooltip :content="famCopyTip('avatar-group-text')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('avatar-group-text') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('avatar-group-text')"
                :aria-label="famCopyTip('avatar-group-text')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('avatar-group-text')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-avatar-group
                  :size="36"
                  :max-count="3"
                  :max-popover-trigger-props="{ contentClass: 'wa-avatar-group-popover' }"
                >
                  <a-avatar
                    :auto-fix-font-size="false"
                    :style="{ backgroundColor: 'rgb(var(--primary-6))' }"
                  >张</a-avatar>
                  <a-avatar
                    :auto-fix-font-size="false"
                    :style="{ backgroundColor: 'rgb(var(--cyan-6))' }"
                  >李</a-avatar>
                  <a-avatar
                    :auto-fix-font-size="false"
                    :style="{ backgroundColor: 'rgb(var(--warning-6))' }"
                  >王</a-avatar>
                  <a-avatar
                    :auto-fix-font-size="false"
                    :style="{ backgroundColor: 'rgb(var(--danger-6))' }"
                  >赵</a-avatar>
                </a-avatar-group>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="avatar-group-photo">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">照片头像组</span><span class="wa-comp-meta__slug">avatar-group-photo</span></div>
              <a-tooltip :content="famCopyTip('avatar-group-photo')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('avatar-group-photo') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('avatar-group-photo')"
                :aria-label="famCopyTip('avatar-group-photo')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('avatar-group-photo')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-avatar-group
                  :size="36"
                  :max-count="5"
                  :max-popover-trigger-props="{ contentClass: 'wa-avatar-group-popover' }"
                >
                  <a-avatar :size="36"><img alt="" src="../../assets/images/avatar_01.jpg" /></a-avatar>
                  <a-avatar :size="36"><img alt="" src="../../assets/images/avatar_02.jpg" /></a-avatar>
                  <a-avatar :size="36"><img alt="" src="../../assets/images/avatar_03.jpg" /></a-avatar>
                  <a-avatar :size="36"><img alt="" src="../../assets/images/avatar_04.jpg" /></a-avatar>
                  <a-avatar :size="36"><img alt="" src="../../assets/images/avatar_05.jpg" /></a-avatar>
                </a-avatar-group>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'avatar',
      members: ['avatar-default', 'avatar-square', 'avatar-text', 'avatar-trigger', 'avatar-group-text', 'avatar-group-photo'],
      setup: function (api) {
        var avatarUrl = api.ref('')
        var avatarInput = api.ref(null)
        var objectUrl = ''
        function revoke() {
          if (objectUrl) {
            URL.revokeObjectURL(objectUrl)
            objectUrl = ''
          }
        }
        function onAvatarClick() {
          var el = avatarInput.value
          if (el) el.click()
        }
        function onAvatarChange(e) {
          var file = e.target && e.target.files && e.target.files[0]
          if (!file) return
          if (!/^image\//.test(file.type)) {
            if (window.ArcoVue && ArcoVue.Message) ArcoVue.Message.warning('请选择图片文件')
            e.target.value = ''
            return
          }
          if (file.size > 2 * 1024 * 1024) {
            if (window.ArcoVue && ArcoVue.Message) ArcoVue.Message.warning('图片大小不能超过 2MB')
            e.target.value = ''
            return
          }
          revoke()
          objectUrl = URL.createObjectURL(file)
          avatarUrl.value = objectUrl
          e.target.value = ''
        }
        return {
          avatarUrl: avatarUrl,
          avatarInput: avatarInput,
          onAvatarClick: onAvatarClick,
          onAvatarChange: onAvatarChange,
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
