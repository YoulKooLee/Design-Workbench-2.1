<!doctype html>
<html lang="zh-CN" data-theme="axhub">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>复选框 · daisyUI</title>
<link rel="stylesheet" href="../../_kit/theme.css">
<style>
  body{margin:0;padding:24px 28px;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--color-base-100);color:var(--color-base-content)}
  a.back{font-size:12px;opacity:.65;text-decoration:none;display:inline-block;margin-bottom:10px}
  h1{font-size:16px;margin:0 0 4px;font-weight:600}
  .meta{font-size:12px;opacity:.65;margin-bottom:6px;line-height:1.9}
  .meta code{background:var(--color-base-200);padding:1px 5px;border-radius:4px;font-size:11px}
  .demo{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px;border:1px solid var(--color-base-300);border-radius:10px;margin-bottom:14px;min-width:min-content}
  .usage{background:var(--color-base-200);border-radius:8px;padding:10px 14px;font-size:11px;opacity:.8;margin-top:4px;white-space:pre-wrap;font-family:ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回 daisyUI 目录</a>
<h1>checkbox · 复选框</h1>
<div class="meta">主类 <code>checkbox</code>　修饰 <code>checkbox-primary</code> <code>checkbox-xs~xl</code><br>场景：多选、权限勾选、行选择</div>
<div class="demo"><label class="label cursor-pointer gap-2 w-fit"><input type="checkbox" class="checkbox checkbox-primary" checked=""/><span class="label-text text-xs">空调</span></label><label class="label cursor-pointer gap-2 w-fit"><input type="checkbox" class="checkbox checkbox-success" checked=""/><span class="label-text text-xs">新风</span></label><label class="label cursor-pointer gap-2 w-fit"><input type="checkbox" class="checkbox"/><span class="label-text text-xs">照明</span></label><label class="label cursor-pointer gap-2 w-fit"><input type="checkbox" class="checkbox" disabled/><span class="label-text text-xs opacity-50">禁用</span></label></div>
<div class="usage">写类名即用，不 import：&lt;div class="checkbox …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：表单/Choice</div>
</body>
</html>
