<h1>timeline · 时间轴</h1>
<div class="meta">主类 <code>timeline</code>　修饰 <code>timeline-vertical</code> <code>timeline-compact</code> <code>timeline-box</code><br>场景：审批流、告警处置、操作日志</div>
<div class="demo"><ul class="timeline timeline-vertical timeline-compact"><li><div class="timeline-middle"><span class="status status-success"></span></div><div class="timeline-start text-xs opacity-60">09:00</div><div class="timeline-end timeline-box text-xs">开始巡检（A 栋 3F）</div><hr class="bg-primary"/></li><li><hr class="bg-primary"/><div class="timeline-middle"><span class="status status-warning"></span></div><div class="timeline-start text-xs opacity-60">09:24</div><div class="timeline-end timeline-box text-xs">发现空调外机 E4</div><hr/></li><li><hr/><div class="timeline-middle"><span class="status status-error"></span></div><div class="timeline-start text-xs opacity-60">09:31</div><div class="timeline-end timeline-box text-xs">创建检修工单</div></li></ul></div>
<div class="usage">写类名即用，不 import：&lt;div class="timeline …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：数据展示/Timeline</div>
