<h1>collapse · 折叠面板</h1>
<div class="meta">主类 <code>collapse</code>　修饰 <code>collapse-arrow</code> <code>collapse-plus</code> <code>collapse-open</code><br>场景：参数详情、FAQ；radio 版可做手风琴</div>
<div class="demo"><div class="collapse collapse-arrow bg-base-200 rounded-box mb-2"><input type="checkbox" checked=""/><div class="collapse-title text-sm">A 栋空调机组（点击展开/收起）</div><div class="collapse-content text-xs"><p>3 台外机，1 台报 E4，检修工单已派发。</p></div></div><div class="collapse collapse-arrow bg-base-200 rounded-box"><input type="checkbox"/><div class="collapse-title text-sm">B 栋新风系统</div><div class="collapse-content text-xs"><p>滤网更换周期剩余 12 天。</p></div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="collapse …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：数据展示/Collapse</div>
</body>
