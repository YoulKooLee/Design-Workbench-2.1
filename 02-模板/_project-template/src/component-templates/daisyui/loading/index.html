<h1>loading · 加载指示</h1>
<div class="meta">主类 <code>loading</code>　修饰 <code>loading-spinner</code> <code>loading-dots</code> <code>loading-bars</code> <code>loading-xs~xl</code><br>场景：按钮内、区块加载</div>
<div class="demo"><span class="loading loading-spinner text-primary"></span><span class="loading loading-spinner text-primary loading-md"></span><span class="loading loading-dots text-secondary"></span><span class="loading loading-ring text-accent"></span><span class="loading loading-bars text-neutral"></span></div>
<div class="usage">写类名即用，不 import：&lt;div class="loading …"&gt;…&lt;/div&gt;
