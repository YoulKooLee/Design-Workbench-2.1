<h1>card · 卡片</h1>
<div class="meta">主类 <code>card</code>　修饰 <code>card-border</code> <code>card-dash</code> <code>card-side</code> <code>image-full</code> <code>card-xs~xl</code><br>场景：内容分组：KPI、设备卡、图文块；image-full 可做图底文覆盖</div>
<div class="demo"><div class="card bg-base-200 w-64"><div class="card-body"><h3 class="card-title text-sm">A 栋机房</h3><p class="text-xs opacity-70">温度 23.6℃ · 湿度 41% · 空调 3 台运行</p><div class="card-actions justify-end"><button class="btn btn-primary btn-xs">查看详情</button></div></div></div><div class="card card-border border-primary bg-base-100 w-64"><div class="card-body"><h3 class="card-title text-sm">B 栋配电室</h3><p class="text-xs opacity-70">负载 78% · 阈值 85%</p><div class="card-actions justify-end"><button class="btn btn-error btn-xs">告警</button></div></div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="card …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：基础/Card</div>
</body>
