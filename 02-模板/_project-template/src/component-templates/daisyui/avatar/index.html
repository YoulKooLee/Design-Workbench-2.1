<h1>avatar · 头像</h1>
<div class="meta">主类 <code>avatar</code> <code>avatar-group</code>　修饰 <code>avatar-online</code> <code>avatar-placeholder</code><br>场景：人员头像、在线态、头像组</div>
<div class="demo"><div class="avatar avatar-placeholder"><div class="bg-primary text-primary-content w-10 rounded-full"><span>游</span></div></div><div class="avatar avatar-placeholder"><div class="bg-secondary text-secondary-content w-10 rounded-full"><span>王</span></div></div><div class="avatar online avatar-placeholder"><div class="bg-neutral text-neutral-content w-10 rounded-full"><span>在</span></div></div><div class="avatar offline avatar-placeholder"><div class="bg-base-300 text-base-content w-10 rounded-full"><span>离</span></div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="avatar avatar-group …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：基础/Avatar</div>
