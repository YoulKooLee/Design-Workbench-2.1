<h1>countdown · 倒计时</h1>
<div class="meta">主类 <code>countdown</code>　修饰 —<br>场景：支付倒计时、活动截止（--value 驱动）</div>
<div class="demo"><div class="countdown font-mono text-lg"><span style="--value:12">12</span>:<span style="--value:48">48</span>:<span style="--value:5">05</span></div><div class="text-xs opacity-60">用 --value 驱动，每格一个 span</div></div>
<div class="usage">写类名即用，不 import：&lt;div class="countdown …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：付款/PaymentCountdown</div>
