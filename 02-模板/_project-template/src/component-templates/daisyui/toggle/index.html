<h1>toggle · 开关</h1>
<div class="meta">主类 <code>toggle</code>　修饰 <code>toggle-primary</code> <code>toggle-xs~xl</code><br>场景：设置项即时生效，如自动派单</div>
<div class="demo"><input type="checkbox" class="toggle toggle-primary" checked=""/><input type="checkbox" class="toggle toggle-success"/><input type="checkbox" class="toggle toggle-error" checked=""/><input type="checkbox" class="toggle toggle-sm"/><input type="checkbox" class="toggle" disabled/></div>
<div class="usage">写类名即用，不 import：&lt;div class="toggle …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：表单/Choice(switch)</div>
