<h1>toast · 轻提示容器</h1>
<div class="meta">主类 <code>toast</code>　修饰 <code>toast-end</code> <code>toast-top</code> <code>toast-bottom</code><br>场景：右下角消息堆叠，内部放 alert</div>
<div class="demo"><div class="toast toast-center toast-bottom"><div class="alert alert-success"><span>工单已派发</span></div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="toast …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：反馈/Message</div>
