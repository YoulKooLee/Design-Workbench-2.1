  body{margin:0;padding:24px 28px;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--color-base-100);color:var(--color-base-content)}
  a.back{font-size:12px;opacity:.65;text-decoration:none;display:inline-block;margin-bottom:10px}
  h1{font-size:16px;margin:0 0 4px;font-weight:600}

<a class="back" href="../index.html">← 返回 daisyUI 目录</a>
<h1>tooltip · 文字提示</h1>
<div class="meta">主类 <code>tooltip</code>　修饰 <code>tooltip-top</code> <code>tooltip-primary</code> <code>tooltip-open</code><br>场景：图标按钮解释、指标口径说明</div>
<div class="demo"><div class="tooltip tooltip-open tooltip-primary" data-tip="负载 78% · 阈值 85%"><button class="btn btn-sm">空调外机 01</button></div><div class="tooltip tooltip-open tooltip-error" data-tip="E4 故障"><button class="btn btn-sm btn-error btn-outline">空调外机 02</button></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="tooltip …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：基础/Overlay(Tooltip)</div>
</body>
