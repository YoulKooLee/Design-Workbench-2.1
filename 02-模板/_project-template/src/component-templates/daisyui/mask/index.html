<h1>mask · 形状裁剪</h1>
<div class="meta">主类 <code>mask</code>　修饰 <code>mask-circle</code> <code>mask-squircle</code> <code>mask-hexagon</code> <code>mask-star</code> <code>mask-triangle</code><br>场景：异形头像、装饰图形</div>
<div class="demo"><div class="mask mask-squircle bg-primary w-14 h-14"></div><div class="mask mask-circle bg-success w-14 h-14"></div><div class="mask mask-star bg-warning w-14 h-14"></div><div class="mask mask-hexagon bg-secondary w-14 h-14"></div><div class="mask mask-heart bg-error w-14 h-14"></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="mask …"&gt;…&lt;/div&gt;
