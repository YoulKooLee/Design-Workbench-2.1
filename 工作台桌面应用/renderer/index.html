<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>产品设计工作台</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 自定义标题栏（无边框窗口拖拽区） -->
<header class="titlebar">
  <div class="tb-left">
    <img class="app-icon" src="app-logo.png" alt="产品设计工作台" draggable="false">
    <span class="app-name">产品设计工作台</span>
    <span class="version-badge">v4.2.0</span>
  </div>
  <div class="tb-right">
    <button class="update-btn" id="updateBtn" title="从 GitHub 检查工作台更新">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      <span>检查更新</span>
      <span class="update-badge" id="updateBadge" hidden></span>
    </button>
    <div class="win-controls">
      <button class="wc-btn" id="winMin" title="最小化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14"/></svg></button>
      <button class="wc-btn" id="winMax" title="最大化"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button>
      <button class="wc-btn wc-close" id="winClose" title="关闭"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
</header>

<div class="layout">
  <!-- 左侧导航 -->
  <nav class="sidebar">
    <div class="nav-list">
      <div class="nav-item active" data-view="projects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg>
        <span>项目管理</span>
      </div>
      <div class="nav-item" data-view="skills">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 2L4.5 13.5h5L9 22l8.5-11.5h-5L13 2z"/></svg>
        <span>Skill 库</span>
      </div>
      <div class="nav-item" data-view="knowledge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span>知识库</span>
      </div>
      <div class="nav-item" data-view="rules">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 13h6M9 17h6"/></svg>
        <span>工作规则</span>
      </div>
      <div class="nav-item" data-view="components">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 2l9 5-9 5-9-5 9-5z"/><path d="M3 12l9 5 9-5"/><path d="M3 17l9 5 9-5"/></svg>
        <span>组件库</span>
      </div>
      <div class="nav-item" data-view="collab">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span>通信看板</span>
      </div>
    </div>
    <div class="nav-foot">
      <div class="nav-item" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>设置</span>
      </div>
      <div class="nav-item nav-exit" id="exitBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        <span>退出工作台</span>
      </div>
    </div>
  </nav>

  <!-- 主内容区 -->
  <main class="main" id="main"></main>
</div>

<!-- 底部状态栏 -->
<footer class="statusbar">
  <div class="sb-left">
    <span class="health-dot" id="healthDot"></span>
    <span id="healthText">服务健康检查中…</span>
    <span class="sb-sep"></span>
    <span class="ports" id="portsText">面板 :7788 · Make :53817 · 预览 :8899</span>
  </div>
  <div class="sb-right">
    <span class="mode-badge"><span class="mode-dot"></span>桌面应用模式 · Electron</span>
  </div>
</footer>

<!-- 通用弹窗 -->
<div class="modal-mask" id="modalMask">
  <div class="modal" id="modalBox"></div>
</div>

<script src="app.js"></script>
</body>
</html>
