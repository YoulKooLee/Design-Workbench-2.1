<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>多智能体通信面板 v2.1</title>
<style>
  :root{
    --bg:#0f1115; --card:#181b22; --card2:#1f232c; --border:#2a2f3a;
    --text:#e6e8ee; --muted:#9aa2b1; --accent:#4f8cff; --accent2:#35d0a0;
    --warn:#ffb648; --danger:#ff5c5c; --user:#c084fc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei",system-ui,-apple-system,sans-serif;font-size:14px;line-height:1.6}
  header{position:sticky;top:0;z-index:10;background:rgba(15,17,21,.9);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  header h1{font-size:18px;font-weight:700;display:flex;align-items:center;gap:8px}
  header h1 .dot{width:10px;height:10px;border-radius:50%;background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
  .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-left:auto}
  select,input[type=text],button,textarea{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:7px 10px;font-size:13px;outline:none;font-family:inherit}
  select:focus,input:focus,textarea:focus{border-color:var(--accent)}
  .btn{border:none;cursor:pointer;padding:7px 14px;border-radius:8px;font-size:13px;transition:.15s;color:#fff}
  .btn.primary{background:var(--accent)} .btn.primary:hover{filter:brightness(1.1)}
  .btn.ghost{background:var(--card2);border:1px solid var(--border)} .btn.ghost:hover{border-color:var(--accent)}
  main{max-width:1000px;margin:0 auto;padding:20px}

  /* 待您回应 */
  .need-user{background:linear-gradient(135deg,rgba(255,182,72,.12),rgba(255,92,92,.08));border:1px solid var(--warn);border-radius:12px;padding:14px 18px;margin-bottom:18px}
  .need-user .title{font-weight:700;color:var(--warn);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  .need-user .title .pulse{width:10px;height:10px;border-radius:50%;background:var(--warn);animation:pulse 1.5s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .need-user .item{background:rgba(15,17,21,.6);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
  .need-user .item:hover{border-color:var(--warn)}
  .need-user .item:last-child{margin-bottom:0}

  /* 线程 */
  .thread{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:18px;overflow:hidden}
  .thread-head{padding:14px 18px;border-bottom:1px solid var(--border);background:var(--card2)}
  .thread-head .t-title{font-size:16px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .thread-head .t-no{background:var(--accent);color:#fff;font-size:12px;padding:2px 8px;border-radius:6px;font-weight:700}
  .thread-head .t-meta{color:var(--muted);font-size:12px;margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
  .qcard{background:var(--card);padding:16px 18px;border-bottom:1px solid var(--border)}
  .qcard .who{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .qcard .qbody{background:var(--card2);border-radius:8px;padding:12px 14px;font-size:13px;color:#cdd3df;white-space:pre-wrap;border:1px solid var(--border)}

  /* 回复 */
  .replies{margin:0}
  .reply{display:flex;gap:14px;padding:14px 18px;border-bottom:1px solid var(--border)}
  .reply:last-child{border-bottom:none}
  .reply .r-rail{width:3px;border-radius:2px;background:var(--border);flex-shrink:0}
  .reply.depth-1 .r-rail{background:rgba(79,140,255,.4)}
  .reply.depth-2 .r-rail{background:rgba(53,208,160,.4)}
  .reply.depth-3 .r-rail{background:rgba(255,182,72,.4)}
  .reply .r-main{flex:1;min-width:0}
  .reply .r-who{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .reply .r-body{background:var(--card2);border-radius:8px;padding:10px 12px;font-size:13px;color:#cdd3df;white-space:pre-wrap;border:1px solid var(--border)}

  /* 徽章 */
  .badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap}
  .b-agent{background:rgba(79,140,255,.15);color:var(--accent)}
  .b-type{background:rgba(154,162,177,.15);color:var(--muted)}
  .b-user{background:rgba(192,132,252,.18);color:var(--user)}
  .b-high{background:rgba(255,92,92,.18);color:var(--danger)}
  .b-replied{background:rgba(53,208,160,.18);color:var(--accent2)}
  .b-unreplied{background:rgba(154,162,177,.15);color:var(--muted)}
  .b-need{background:rgba(255,182,72,.2);color:var(--warn)}
  .b-partly{background:rgba(79,140,255,.18);color:var(--accent)}
  .b-archived{background:rgba(154,162,177,.1);color:var(--muted)}
  /* v2.2 会话状态徽标（三态） */
  .b-waiting{background:rgba(53,208,160,.2);color:var(--accent2)}
  .b-idle{background:rgba(154,162,177,.15);color:var(--muted)}
  .btn.mini{padding:3px 10px;font-size:12px;border-radius:6px}

  .meta{color:var(--muted);font-size:12px;display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
  .reply-actions{margin-top:8px;display:flex;gap:8px}
  .reply-box{margin-top:8px;display:none}
  .reply-box.open{display:block}
  .reply-box textarea{width:100%;min-height:60px;resize:vertical;margin-bottom:6px}

  .empty{text-align:center;color:var(--muted);padding:60px 0}

  /* 发布按钮 + 弹窗 */
  .fab{position:fixed;right:20px;bottom:20px;width:54px;height:54px;border-radius:50%;background:var(--accent);color:#fff;border:none;font-size:26px;cursor:pointer;box-shadow:0 8px 24px rgba(79,140,255,.4);z-index:15}
  .fab:hover{filter:brightness(1.1)}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:30}
  .modal.open{display:flex}
  .modal-box{background:var(--card);border:1px solid var(--border);border-radius:16px;width:520px;max-width:calc(100vw-40px);max-height:80vh;overflow:auto;padding:20px}
  .modal-box h3{margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
  .modal-box .row{display:flex;gap:8px;margin-bottom:10px}
  .modal-box select,.modal-box input{flex:1}
  .modal-box textarea{width:100%;min-height:100px;resize:vertical;margin-bottom:10px}
  .modal-box .hint{color:var(--muted);font-size:12px;margin-bottom:8px}
  .toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#0a0a0a;padding:10px 20px;border-radius:10px;font-weight:600;z-index:50;transition:.3s;opacity:0;pointer-events:none}
  .toast.show{opacity:1}
  /* 多选智能体 */
  .agent-pick{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .agent-pick label{display:inline-flex;align-items:center;gap:6px;background:var(--card2);border:1px solid var(--border);border-radius:8px;padding:6px 12px;cursor:pointer;font-size:13px}
  .agent-pick label.checked{border-color:var(--accent);background:rgba(79,140,255,.12)}
  .agent-pick input{display:none}
  /* 智能体状态栏 */
  .agent-status{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
  .agent-status .st{display:inline-flex;align-items:center;gap:6px;color:#cdd3df}
  .agent-status .lbl{font-weight:700;color:var(--muted)}
  .dot2{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
  .dot-green{background:var(--accent2);box-shadow:0 0 6px var(--accent2)}
  .dot-gray{background:var(--muted)}
  .dot-warn{background:var(--warn);box-shadow:0 0 6px var(--warn)}
  .wake-hint{background:linear-gradient(135deg,rgba(79,140,255,.14),rgba(53,208,160,.1));border:1px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:none;color:#cdd3df}
</style>
</head>
<body>

<header>
  <h1><span class="dot"></span>多智能体通信面板 <span id="count" style="color:var(--muted);font-size:13px;font-weight:400"></span></h1>
  <div class="filters">
    <select id="f-agent"><option value="">全部智能体</option></select>
    <select id="f-state"><option value="">全部状态</option>
      <option value="active_waiting">等待回复</option>
      <option value="idle">待命</option>
      <option value="archived">归档</option>
    </select>
    <button class="btn ghost" onclick="refresh()">刷新</button>
  </div>
</header>

<main>
  <div class="agent-status" id="agentStatus">加载智能体状态…</div>
  <div class="wake-hint" id="wakeHint"></div>
  <div id="needUser" class="need-user" style="display:none">
    <div class="title"><span class="pulse"></span> 需要您回应的对话</div>
    <div id="needUserList"></div>
  </div>
  <div id="threads"></div>
</main>

<button class="fab" onclick="openNewModal()">＋</button>

<!-- 发布新对话弹窗 -->
<div class="modal" id="newModal">
  <div class="modal-box">
    <h3>发布新对话 <button class="btn ghost" onclick="closeNewModal()">✕</button></h3>
    <div class="hint">向智能体发起一个新的提问或任务。可同时 @ 多位智能体，选择接收者（可多选）。</div>
    <div class="row">
      <select id="n-type">
        <option value="question">提问</option>
        <option value="task">派任务</option>
        <option value="info">通知</option>
      </select>
    </div>
    <div class="hint" style="margin-top:6px">接收智能体（可多选）：</div>
    <div class="agent-pick" id="n-to"></div>
    <input id="n-subject" placeholder="标题（可选，留空自动生成）">
    <textarea id="n-body" placeholder="内容…"></textarea>
    <button class="btn primary" onclick="doNew()">发布</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = { threads: [], agents: [], needUser: [], agentNames: {} };
const AGENT_NAMES = { codebuddy:'CodeBuddy', workbuddy:'WorkBuddy', deepseek:'DeepSeek', doubao:'豆包', user:'您' };
let agentStatus = { hub:false, deepseek_watcher:false };

async function loadStatus(){
  try{
    const s = await api('/api/agents-status');
    agentStatus.hub = !!s.hub_running;
    agentStatus.deepseek_watcher = !!s.deepseek_watcher_running;
    renderAgentStatus();
  }catch(e){}
}
function renderAgentStatus(){
  const el = document.getElementById('agentStatus');
  const dsCls = agentStatus.deepseek_watcher ? 'dot-green' : 'dot-warn';
  const dsTxt = agentStatus.deepseek_watcher ? 'DeepSeek 常驻监听中' : 'DeepSeek 未监听（需开会话或启动监听）';
  const hubCls = agentStatus.hub ? 'dot-green' : 'dot-warn';
  const hubTxt = agentStatus.hub ? '监听中枢运行中' : '监听中枢未运行';
  el.innerHTML = '<span class="lbl">智能体状态：</span>' +
    '<span class="st"><span class="dot2 dot-green"></span>豆包·对话中可即时回复</span>' +
    '<span class="st"><span class="dot2 dot-gray"></span>CodeBuddy·需开会话唤醒</span>' +
    '<span class="st"><span class="dot2 dot-gray"></span>WorkBuddy·需开会话唤醒</span>' +
    '<span class="st"><span class="dot2 ' + dsCls + '"></span>' + dsTxt + '</span>' +
    '<span class="st"><span class="dot2 ' + hubCls + '"></span>' + hubTxt + '</span>';
}
function showWakeHint(targets){
  const hint = document.getElementById('wakeHint');
  const parts = (targets||[]).map(a=>{
    const nm = AGENT_NAMES[a]||a;
    if(a==='doubao') return nm + '：对话中，可即时回复';
    if(a==='deepseek') return agentStatus.deepseek_watcher ? nm + '：常驻监听中，会自动处理' : nm + '：未监听，请开会话或启动监听';
    return nm + '：需开会话才会看到';
  });
  hint.innerHTML = '📨 消息已投递，请留意各智能体响应方式：' + parts.join('；');
  hint.style.display = 'block';
  clearTimeout(hint._t); hint._t = setTimeout(()=>hint.style.display='none', 15000);
}

async function api(url, opt){
  const r = await fetch(url, opt);
  return r.json();
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){
  if(!ts) return '';
  const d = new Date(ts);
  if(isNaN(d)) return ts;
  const p=n=>String(n).padStart(2,'0');
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function refresh(){
  const d = await api('/api/messages');
  state.threads = d.threads || [];
  state.agents = d.agents || [];
  state.needUser = d.needUser || [];
  if(d.agentNames) Object.assign(AGENT_NAMES, d.agentNames);
  // 填充 agent 筛选
  const sel = document.getElementById('f-agent');
  sel.innerHTML = '<option value="">全部智能体</option>';
  for (const a of state.agents){
    sel.innerHTML += `<option value="${a}">${AGENT_NAMES[a]||a}</option>`;
  }
  render();
}

function stateBadge(m){
  const map = {
    'need_user': ['b-need', '待您回应'],
    'replied':   ['b-replied', '已回复'],
    'read':      ['b-partly', '已读'],
    'pending':   ['b-need', '待批'],
    'done':      ['b-replied', '已完成'],
    'aborted':   ['b-archived', '已取消'],
    'unreplied': ['b-unreplied', '未回复'],
  };
  const [cls, txt] = map[m._state] || ['b-unreplied', '未回复'];
  return `<span class="badge ${cls}">${txt}</span>`;
}

function whoBadge(m){
  const isUser = m.from==='user';
  const cls = isUser ? 'b-user' : 'b-agent';
  let toStr;
  if (m._toAll && m._toAll.length > 1) {
    toStr = m._toAll.map(x=>AGENT_NAMES[x]||x).join(' + ');
  } else {
    toStr = AGENT_NAMES[m.to]||m.to;
  }
  return `<span class="badge ${cls}">${AGENT_NAMES[m.from]||m.from} → ${toStr}</span>`;
}

// 渲染一条消息（含其回复子树）
function renderMsg(m, depth){
  const archived = String(m._location||'').includes('archive');
  const dcls = depth>3 ? 'depth-3' : `depth-${depth||1}`;
  return `<div class="reply ${dcls}" id="msg-${esc(m.message_id)}">
    <div class="r-rail"></div>
    <div class="r-main">
      <div class="r-who">
        ${whoBadge(m)}
        <span class="badge b-type">${m.type}</span>
        ${stateBadge(m)}
        ${m.priority==='high'?'<span class="badge b-high">HIGH</span>':''}
        ${archived?'<span class="badge b-archived">已归档</span>':''}
        ${m.type==='correction'?'<span class="badge b-high">需纠正</span>':''}
      </div>
      <div class="r-body">${esc(m.body||'(空)')}</div>
      <div class="meta">
        <span>🕐 ${fmtTime(m.timestamp)}</span>
        <span>📎 ${m.reply_to?('回复 '+m.reply_to):'对话发起'}</span>
        ${m.subject?`<span>📌 ${esc(m.subject)}</span>`:''}
      </div>
      <div class="reply-actions">
        <button class="btn ghost" onclick="toggleReply('${esc(m.message_id)}')">回复</button>
      </div>
      <div class="reply-box" id="rb-${esc(m.message_id)}">
        <textarea id="rt-${esc(m.message_id)}" placeholder="输入您的回复…"></textarea>
        <button class="btn primary" onclick="doReply('${esc(m.message_id)}')">发送回复</button>
      </div>
      ${m._replies && m._replies.length ? `<div class="replies">${[...m._replies].reverse().map(r=>renderMsg(r, (depth||1)+1)).join('')}</div>` : ''}
    </div>
  </div>`;
}

// 渲染单个任务线程
function renderThread(t){
  const partStr = (t._participants||[]).filter(p=>p!=='user').map(p=>AGENT_NAMES[p]||p).join('、');
  // v2.2 会话状态徽标（三态：等待回复/待命/归档）
  const s = t._sstate || 'idle';
  let stateBadgeHtml;
  if(s==='active_waiting') stateBadgeHtml = '<span class="badge b-waiting">等待回复</span>';
  else if(s==='archived') stateBadgeHtml = '<span class="badge b-archived">已归档</span>';
  else stateBadgeHtml = '<span class="badge b-idle">待命</span>';
  // v2.2 会话操作按钮（暂停/归档/唤醒，可逆）
  const actBtns = s==='archived'
    ? `<button class="btn ghost mini" onclick="threadAction('${esc(t._taskKey)}','reopen')">唤醒</button>`
    : `<button class="btn ghost mini" onclick="threadAction('${esc(t._taskKey)}','pause')">暂停</button>
       <button class="btn ghost mini" onclick="threadAction('${esc(t._taskKey)}','archive')">归档</button>`;
  const firstRoot = t._roots[0] || t._messages[0] || {};
  const archived = String(firstRoot._location||'').includes('archive');
  const noReply = (s==='active_waiting' && firstRoot && firstRoot.from==='user' && (t._needUserMsgs||[]).length===0) ? '<span class="badge b-need">⚠ 无人回复·需唤醒</span>' : '';
  return `<div class="thread" id="th-${esc(t._taskKey)}">
    <div class="thread-head">
      <div class="t-title">
        <span class="t-no">${t._no}</span>
        <span>${esc(t._title||'(无标题)')}</span>
        ${firstRoot.priority==='high'?'<span class="badge b-high">HIGH</span>':''}
        ${archived?'<span class="badge b-archived">已归档</span>':''}
      </div>
      <div class="t-meta">
        <span>👥 ${esc(partStr||'—')}</span>
        <span>🕐 ${fmtTime(t._earliest)}</span>
        <span>💬 ${t._messages.length} 条</span>
        <span>${stateBadgeHtml}</span>
        <span style="display:inline-flex;gap:6px">${actBtns}</span>
        ${noReply}
      </div>
    </div>
    ${t._roots.map(r=>renderRoot(r)).join('')}
    ${t._roots.length===0 ? '<div class="qcard"><div class="r-main" style="color:var(--muted);font-size:12px">此任务暂无消息</div></div>' : ''}
  </div>`;
}

function renderRoot(m){
  const archived = String(m._location||'').includes('archive');
  return `<div class="qcard" id="msg-${esc(m.message_id)}">
    <div class="who">
      ${whoBadge(m)}
      <span class="badge b-type">${m.type}</span>
      ${stateBadge(m)}
      ${m.priority==='high'?'<span class="badge b-high">HIGH</span>':''}
      ${archived?'<span class="badge b-archived">已归档</span>':''}
    </div>
    <div class="qbody">${esc(m.body||'(空)')}</div>
    <div class="meta">
      <span>🕐 ${fmtTime(m.timestamp)}</span>
      <span>🆔 ${esc(m.message_id)}</span>
    </div>
    <div class="reply-actions">
      <button class="btn ghost" onclick="toggleReply('${esc(m.message_id)}')">回复</button>
    </div>
    <div class="reply-box" id="rb-${esc(m.message_id)}">
      <textarea id="rt-${esc(m.message_id)}" placeholder="输入您的回复…"></textarea>
      <button class="btn primary" onclick="doReply('${esc(m.message_id)}')">发送回复</button>
    </div>
    ${m._replies && m._replies.length ? `<div class="replies">${[...m._replies].reverse().map(r=>renderMsg(r,1)).join('')}</div>` : '<div class="reply" style="padding:10px 18px"><div class="r-main" style="color:var(--muted);font-size:12px">暂无回复</div></div>'}
  </div>`;
}

function render(){
  const fa = document.getElementById('f-agent').value;
  const fs = document.getElementById('f-state').value;

  // 筛选线程
  let threads = state.threads;
  if(fa){
    threads = threads.filter(t=>(t._participants||[]).includes(fa));
  }
  if(fs) threads = threads.filter(t=>t._sstate===fs);
  // v2.2 会话排序：等待回复置顶 → 待命 → 归档沉底；同级按最新消息倒排
  const sorder = {active_waiting:0, idle:1, archived:2};
  threads = [...threads].sort((a,b)=> (sorder[a._sstate]??1)-(sorder[b._sstate]??1) || (b._latest||'').localeCompare(a._latest||''));

  document.getElementById('count').textContent = `${threads.length} 个对话 / 共 ${state.threads.length} 个`;
  document.getElementById('threads').innerHTML = threads.length ? threads.map(renderThread).join('') : '<div class="empty">暂无对话</div>';

  // 待您回应
  const nu = document.getElementById('needUser');
  const nuList = document.getElementById('needUserList');
  if(state.needUser.length && !fa && !fs){
    nu.style.display = 'block';
    nuList.innerHTML = state.needUser.map(t=>{
      const m = t._needUserMsgs[0];
      return `<div class="item" onclick="scrollToMsg('${esc(t._taskKey)}')">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px">
          <span class="badge b-need">${t._no}</span>
          <span style="font-weight:600">${esc(t._title)}</span>
          <span class="badge b-need">待您回应</span>
        </div>
        <div style="font-size:13px;color:#cdd3df">${esc((m.from==='user'?'':'['+AGENT_NAMES[m.from]+'] ')+(m.subject||'')+' — '+(m.body||'').slice(0,80))}</div>
      </div>`;
    }).join('');
  } else {
    nu.style.display = 'none';
  }
}

function scrollToMsg(key){
  const el = document.getElementById('th-'+key) || document.querySelector('.thread');
  if(el){ el.scrollIntoView({behavior:'smooth', block:'start'}); el.style.outline='2px solid var(--warn)'; setTimeout(()=>el.style.outline='',2000); }
}

function toggleReply(id){
  const box = document.getElementById('rb-'+id);
  if(box) box.classList.toggle('open');
}

async function doReply(id){
  const ta = document.getElementById('rt-'+id);
  const content = ta.value.trim();
  if(!content){ toast('请输入回复内容'); return; }
  const r = await api('/api/reply', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({reply_to:id, content, type:'question'})});
  if(r.ok){ toast('已回复 → '+AGENT_NAMES[r.to]); ta.value=''; document.getElementById('rb-'+id).classList.remove('open'); refresh(); }
  else toast('失败: '+(r.error||''));
}

// v2.2 会话状态操作（暂停/归档/唤醒，可逆，用户留痕）
async function threadAction(key, action){
  const names = {pause:'暂停', archive:'归档', reopen:'唤醒', wake:'唤醒'};
  const r = await api('/api/thread-action', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({thread_id:key, action})});
  if(r.ok){ toast('已'+(names[action]||action)); refresh(); }
  else toast('失败: '+(r.error||''));
}

// 发布新对话（多选智能体）
function openNewModal(){
  const pick = document.getElementById('n-to');
  pick.innerHTML = '';
  for (const a of state.agents){
    pick.innerHTML += `<label class="agent" data-a="${a}"><input type="checkbox" value="${a}"> ${AGENT_NAMES[a]||a}</label>`;
  }
  pick.querySelectorAll('label').forEach(l=>{
    l.querySelector('input').onchange = ()=>{
      l.classList.toggle('checked', l.querySelector('input').checked);
    };
  });
  document.getElementById('newModal').classList.add('open');
}
function closeNewModal(){ document.getElementById('newModal').classList.remove('open'); }
async function doNew(){
  const checks = [...document.querySelectorAll('#n-to input:checked')];
  const targets = checks.map(c=>c.value);
  if(!targets.length){ toast('请至少选择一位接收智能体'); return; }
  const type = document.getElementById('n-type').value;
  const subject = document.getElementById('n-subject').value;
  const body = document.getElementById('n-body').value;
  if(!body.trim()){ toast('请输入内容'); return; }
  const r = await api('/api/send', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({to:targets, type, subject, content:body})});
  if(r.ok){
    toast('已发布 → '+(r.to||[]).map(x=>AGENT_NAMES[x]||x).join('、'));
    showWakeHint(r.to||[]);
    document.getElementById('n-subject').value=''; document.getElementById('n-body').value=''; closeNewModal(); refresh();
  }
  else toast('失败: '+(r.error||''));
}

document.getElementById('f-agent').onchange = render;
document.getElementById('f-state').onchange = render;
refresh();
loadStatus();
setInterval(refresh, 15000); // 15s 自动刷新
setInterval(loadStatus, 15000);
</script>
