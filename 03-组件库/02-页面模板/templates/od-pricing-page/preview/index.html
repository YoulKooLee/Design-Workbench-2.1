  .dn-right{width:360px;min-width:360px;background:#fff;border-left:3px solid ${T.primary};padding:16px;overflow-y:auto;max-height:100vh;position:sticky;top:0}
  .dn-rd-titlebar{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:2px solid ${T.primary};margin-bottom:12px}
  .dn-rd-badge{background:${T.primary};color:#fff;font-size:11px;font-weight:700;padding:3px 8px;letter-spacing:.05em}
  .dn-rd-title{font-size:15px;font-weight:700;color:${T.text}}
  .dn-rd-hint{font-size:11px;color:${T.text3};margin:0 0 14px;line-height:1.5}
  .dn-desc{background:#fff;border:2px solid ${T.primary};margin-bottom:12px;padding:12px;transition:background .15s,border-color .15s}
  .dn-desc-head{display:flex;align-items:center;gap:10px;margin-bottom:6px}
  .dn-desc-num{width:24px;height:24px;background:${T.primary};color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dn-desc-title{font-size:13px;font-weight:700;color:${T.text};flex:1}
  .dn-desc-actions{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .dn-desc-edit{font-size:11px;color:${T.primary};background:#eef4ff;border:1px solid ${T.primary};border-radius:4;padding:2px 8px;cursor:pointer;opacity:.85;transition:opacity .15s}
  .dn-desc-edit:hover{opacity:1}
  .dn-desc-del{font-size:11px;color:${T.text3};background:transparent;border:1px solid transparent;border-radius:4;padding:2px 6px;cursor:pointer}
  .dn-desc-del:hover{color:${T.danger};border-color:${T.danger};background:#fff}
  .dn-desc-text{font-size:12px;color:${T.text};line-height:1.6;margin:4px 0 0;white-space:pre-line}
  .dn-desc-list{list-style:none;padding:0;margin:6px 0 0}
  .dn-desc-list li{position:relative;padding:2px 0 2px 18px;font-size:12px;line-height:1.6;color:${T.text}}
  .dn-desc-list li::before{content:'';position:absolute;left:2px;top:10px;width:8px;height:8px;background:${T.primary}}
  .dn-add-module{width:100%;padding:8px;font-size:12px;color:${T.primary};background:#eef4ff;border:1px dashed ${T.primary};border-radius:6;cursor:pointer;margin-top:4px}
  .dn-add-module:hover{background:#e3edff}
  .dn-desc-link{font-size:10px;color:${T.primary};background:#eef4ff;border:1px solid ${T.primary};border-radius:4;padding:1px 6px;white-space:nowrap;flex-shrink:0;margin-left:4px}
  .dn-modal-field select{width:100%;box-sizing:border-box;font-size:13px;padding:8px 12px;border:1px solid ${T.border2};border-radius:6;background:#fff;font-family:inherit}
  .dn-modal-field select:focus{outline:none;border-color:${T.primary};box-shadow:0 0 0 3px rgba(43,108,255,.12)}
  .dn-modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(15,23,42,.5);z-index:${qf};display:flex;align-items:center;justify-content:center;padding:24px}
  .dn-modal{background:#fff;border-radius:12px;width:min(680px,92vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(15,23,42,.35);overflow:hidden}
  .dn-modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid ${T.border}}
  .dn-modal-title{font-size:15px;font-weight:700;color:${T.text}}
  .dn-modal-close{font-size:14px;color:${T.text3};background:transparent;border:none;cursor:pointer;padding:2px 6px;border-radius:4}
  .dn-modal-close:hover{background:#f1f5f9;color:${T.text}}
  .dn-modal-body{padding:20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
  .dn-modal-field{display:flex;flex-direction:column;gap:6px}
  .dn-modal-label{font-size:12px;font-weight:600;color:${T.text2}}
  .dn-modal-field input,.dn-modal-field textarea{width:100%;box-sizing:border-box;font-size:13px;padding:8px 12px;border:1px solid ${T.border2};border-radius:6;font-family:inherit;line-height:1.6;resize:vertical;background:#fff}
  .dn-modal-field input:focus,.dn-modal-field textarea:focus{outline:none;border-color:${T.primary};box-shadow:0 0 0 3px rgba(43,108,255,.12)}
  .dn-modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid ${T.border};background:#fafbfc}
  .dn-modal-btn{font-size:13px;padding:7px 18px;border-radius:6;cursor:pointer;font-weight:500}
  .dn-modal-btn.primary{background:${T.primary};color:#fff;border:1px solid ${T.primary}}
  .dn-modal-btn.primary:hover{background:${T.primaryHover}}
  .dn-modal-btn.ghost{background:#fff;color:${T.text2};border:1px solid ${T.border2}}
  .dn-modal-btn.ghost:hover{background:#f1f5f9}
  .dn-desc.active-highlight{background:${T.primary};border-color:${T.primary}}
  .dn-desc.active-highlight .dn-desc-num{background:#fff;color:${T.primary}}
  .dn-desc.active-highlight .dn-desc-title,
  .dn-desc.active-highlight .dn-desc-text,
  .dn-desc.active-highlight li{color:#fff}
  /* 左侧页面模块高亮：[data-proto-id] 由宿主打标，不依赖宿主容器类名 */
  [data-proto-id].active-highlight{box-shadow:0 0 0 3px ${T.primary};background:${T.active}}
  .dn-connections{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:${us}}
  .dn-quick-add{position:fixed;z-index:${us+1};font-size:11px;line-height:1;padding:4px 10px;color:#fff;background:${T.primary};border:none;border-radius:12;box-shadow:0 2px 8px rgba(15,23,42,.25);cursor:pointer;transform:translate(30%,-30%);pointer-events:auto;white-space:nowrap}
  .dn-quick-add:hover{background:${T.primaryHover}}
  .dn-connection{opacity:0;transition:opacity .15s ease}
  .dn-connection.active{opacity:1}
  .dn-connection-line{fill:none;stroke:${T.primary};stroke-width:2}
  .dn-connection.active .dn-connection-line{stroke-width:3}
  .dn-connection-bg{fill:${T.primary}}
