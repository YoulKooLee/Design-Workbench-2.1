<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>设计说明模块 · 单卡页签预览（原始库管理 / 专题配置）</title>
<!-- React + Babel 通过 CDN 加载；首次打开需联网。组件本体为 DesignNotesPanel 的无类型 JSX 端口，逻辑与 DesignNotesPanel.tsx 一致。 -->
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #eef1f6; color: #1f2937; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  .demo-shell { display: flex; min-height: 100vh; }
  .demo-left-menu { width: 180px; min-width: 180px; background: #0067b8; color: #fff; padding: 18px 0; }
  .demo-left-menu .logo { font-weight: 800; font-size: 14px; padding: 0 18px 16px; letter-spacing: .04em; }
  .demo-left-menu .item { padding: 10px 18px; font-size: 13px; opacity: .82; cursor: default; }
  .demo-left-menu .item.on { background: rgba(255,255,255,.16); opacity: 1; font-weight: 700; }
  .demo-content { flex: 1; min-width: 0; padding: 22px; overflow-x: hidden; }
  .demo-content h1 { font-size: 18px; margin: 0 0 4px; }
  .demo-content .sub { font-size: 12px; color: #6b7280; margin: 0 0 18px; }
  .demo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 18px; }
  .demo-card { background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 16px; }
  .demo-card .k { font-size: 12px; color: #6b7280; }
  .demo-card .v { font-size: 22px; font-weight: 800; margin-top: 6px; }
  .demo-panel { background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 16px; margin-bottom: 18px; }
  .demo-panel .ph { font-weight: 700; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
  .demo-panel .ph .dot { width: 8px; height: 8px; border-radius: 50%; background: #0067b8; }
  .demo-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .demo-table th, .demo-table td { border: 1px solid #eef1f6; padding: 8px 10px; text-align: left; }
  .demo-table th { background: #f7f9fc; }
  .demo-form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .demo-form label { font-size: 12px; color: #6b7280; display: block; margin-bottom: 4px; }
  .demo-form input { width: 100%; padding: 8px 10px; border: 1px solid #d6dde7; border-radius: 6px; font-size: 13px; }
  .demo-hint { font-size: 12px; color: #6b7280; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; padding: 10px 12px; margin-bottom: 18px; line-height: 1.6; }
  .demo-toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #16a34a; color: #fff; font-size: 13px; padding: 10px 18px; border-radius: 8px; box-shadow: 0 8px 24px rgba(15,23,42,.25); z-index: 10001; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .demo-toast.show { opacity: 1; }
  .cfg-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .cfg-head .h-title { font-size: 18px; font-weight: 800; color: #1a2333; }
  .cfg-head .h-back { font-size: 12px; color: #0067b8; margin-right: 10px; }
  .cfg-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; background: #f7f9fc; border: 1px solid #e5e9f0; border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; }
  .cfg-info .ci span { display: block; font-size: 11px; color: #8c9bb0; margin-bottom: 3px; }
  .cfg-info .ci b { font-size: 13px; color: #1a2333; }
  .mono { font-family: Consolas, monospace; }
  .cfg-mode { display: flex; flex-wrap: wrap; gap: 18px; align-items: center; background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
  .cfg-mode .mlabel { font-size: 13px; font-weight: 600; color: #333; }
  .cfg-mode label { font-size: 13px; color: #333; display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .cfg-flow { font-size: 12px; color: #6b7280; background: #f0f4fa; border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
  .cfg-sec { background: #fff; border: 1px solid #e5e9f0; border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .cfg-sec .sec-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
  .cfg-sec .sec-title .dot { width: 8px; height: 8px; border-radius: 50%; background: #0067b8; }
  .cfg-label { font-size: 12px; color: #5b6b82; margin: 12px 0 5px; font-weight: 600; }
  .cfg-label .req { color: #e5484d; }
  .cfg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 10px; }
  .cfg-select, .cfg-input { width: 100%; padding: 8px 10px; border: 1px solid #d6dde7; border-radius: 6px; font-size: 13px; background: #fff; box-sizing: border-box; }
  .cfg-hint { font-size: 12px; color: #ad6800; background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 8px 12px; margin-top: 6px; line-height: 1.6; }
  .cfg-tip { font-size: 12px; color: #333; background: #f7f9fc; border: 1px solid #e5e9f0; border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; line-height: 1.7; }
  .cfg-pre { background: #0f172a; color: #e2e8f0; border-radius: 8px; padding: 12px 14px; font-family: Consolas, monospace; font-size: 12px; line-height: 1.7; white-space: pre-wrap; overflow-x:auto; margin-top: 6px; }
  .cfg-tag { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 999px; }
  .cfg-tag.ok { background: #f0fdf4; color: #15803d; }
  .cfg-tag.warn { background: #fffbeb; color: #b45309; }
  .cfg-sub { font-size: 11px; color: #8c9bb0; margin-left: 8px; font-weight: 400; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useEffect, useRef, useState } = React;

/* ============================================================
 * 以下 DesignNotesPanel 为 DesignNotesPanel.tsx 的无类型 JSX 端口，
 * 逻辑（连线 / 高亮 / 富文本编辑 / 状态 / 收起 / 落盘 / 草稿兜底）与源文件一致。
 * 接入正式项目请使用 DesignNotesPanel.tsx（含完整类型）。
 * ============================================================ */
const C = {
  bg: '#f5f7fa', panel: '#ffffff', border: '#edebe9', border2: '#d2d0ce',
  hover: '#f3f2f1', active: '#eff6fc', text: '#242424', text2: '#424242',
  text3: '#797775', primary: '#0067b8', primaryHover: '#106ebe', danger: '#d13438',
};
const Z_MODAL = 1000, Z_CONN = 9999;
const NOTES_PANEL_WIDTH = 360;

// 状态标记字典（顺序即选择器展示顺序）
const STATUS_META = {
  designing: { label: '设计中', color: '#1d4ed8', bg: '#eff6ff', border: '#bfdbfe' },
  reviewed: { label: '已评审', color: '#6d28d9', bg: '#f5f3ff', border: '#ddd6fe' },
  todo: { label: '待开发', color: '#b45309', bg: '#fffbeb', border: '#fde68a' },
  developing: { label: '开发中', color: '#0f766e', bg: '#f0fdfa', border: '#99f6e4' },
  done: { label: '已完成', color: '#15803d', bg: '#f0fdf4', border: '#bbf7d0' },
};
const STATUS_ORDER = ['designing', 'reviewed', 'todo', 'developing', 'done'];

function deriveLabel(el, id) {
  const explicit = el.getAttribute('data-proto-label');
  if (explicit) return explicit;
  const titleEl = el.querySelector('h1,h2,h3,h4,.dn-desc-title,[class*="title"]');
  const t = titleEl?.textContent?.replace(/\s+/g, ' ').trim();
  if (t) return t.length > 30 ? t.slice(0, 30) + '…' : t;
  const txt = el.textContent?.replace(/\s+/g, ' ').trim();
  if (txt) return txt.length > 30 ? txt.slice(0, 30) + '…' : txt;
  return id;
}

/* ---------- 富文本编辑辅助 ---------- */
// 含任何格式标签 => 存 rich；只有纯文本 + 项目符号 => 还原为 text + list
const RICH_TAG_RE = /<(b|strong|i|em|u|s|font|span|ol|h[1-6])[\s>]|style=/i;

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function plainToEditorHtml(m) {
  const parts = [];
  (m.text ?? '').split('\n').forEach((line) => {
    parts.push(`<div>${escapeHtml(line) || '<br>'}</div>`);
  });
  if (m.list && m.list.length) {
    parts.push(`<ul>${m.list.map((l) => `<li>${escapeHtml(l)}</li>`).join('')}</ul>`);
  }
  return parts.join('') || '';
}
function sanitizeRichHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('script,style,iframe,object,embed,link,meta').forEach((el) => el.remove());
  div.querySelectorAll('*').forEach((el) => {
    Array.from(el.attributes).forEach((a) => {
      const n = a.name.toLowerCase();
      const v = a.value.trim().toLowerCase();
      if (n.startsWith('on') || ((n === 'href' || n === 'src') && v.startsWith('javascript:'))) {
        el.removeAttribute(a.name);
      }
    });
  });
  return div.innerHTML;
}
function nodePlainText(node) {
  if (node.nodeType === Node.TEXT_NODE) return node.textContent ?? '';
  if (node.nodeType !== Node.ELEMENT_NODE) return '';
  const el = node;
  if (el.tagName === 'BR') return '\n';
  let out = '';
  el.childNodes.forEach((ch) => { out += nodePlainText(ch); });
  if (el.tagName === 'DIV' || el.tagName === 'P') out += '\n';
  return out;
}
/* 内容签名：判断「真源是否已追平本地草稿」（避免刚删掉的卡片又从静态真源里冒回来） */
function modulesSig(arr) {
  return JSON.stringify(arr.map((m) => [m.id, m.title, m.status ?? '', m.bind ?? '', m.text ?? '', m.rich ?? '', m.apiRich ?? '', m.list ?? []]));
}
function plainTextOfHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  div.querySelectorAll('ul,ol').forEach((el) => el.remove());
  let s = '';
  div.childNodes.forEach((ch) => { s += nodePlainText(ch); });
  return s.replace(/\u00a0/g, ' ').replace(/\n{3,}/g, '\n\n').trim();
}
function listItemsOfHtml(html) {
  const div = document.createElement('div');
  div.innerHTML = html;
  const items = [];
  div.querySelectorAll('li').forEach((li) => {
    const t = (li.textContent ?? '').replace(/\u00a0/g, ' ').trim();
    if (t) items.push(t);
  });
  return items;
}

/* ---------- 单卡片（序号 + 标题 + 状态 + 内容 + 编辑；关联与删除都收进编辑弹窗） ---------- */
function DescCard({ m, index, onEdit }) {
  const target = m.bind ?? m.id;
  const st = m.status ? STATUS_META[m.status] : null;
  const hasOverview = !!(m.text && m.text.trim()) || (m.list && m.list.length > 0);
  const hasApiContent = !!(m.apiRich && m.apiRich.trim());
  // 两类说明都有才显示页签切换；只有一类时直接展示该说明，不显示页签
  const showTabs = hasOverview && hasApiContent;
  const [tab, setTab] = useState(() => (hasOverview ? 'overview' : 'api'));
  const isEmpty = !hasOverview && !hasApiContent;
  return (
    <div data-proto-id={target} className="dn-desc">
      <div className="dn-desc-head">
        <span className="dn-desc-num">{index + 1}</span>
        <span className="dn-desc-title">{m.title}</span>
        {st && (
          <span className="dn-status" style={{ color: st.color, background: st.bg, borderColor: st.border }} title={`当前状态：${st.label}`}>
            <i className="dn-status-dot" style={{ background: st.color }} />{st.label}
          </span>
        )}
      </div>
      {isEmpty && (
        <button className="dn-desc-empty" title="这张卡片先放空，点击现在补写；也可以直接在对话里让 AI 按区域补上说明"
          onClick={(e) => { e.stopPropagation(); onEdit(m, index); }}>＋ 待补充说明 — 点击编辑</button>
      )}
      {showTabs && (
        <div className="dn-tabs">
          <button className={`dn-tab ${tab === 'overview' ? 'on' : ''}`} onClick={(e) => { e.stopPropagation(); setTab('overview'); }}>页面说明</button>
          <button className={`dn-tab ${tab === 'api' ? 'on' : ''}`} onClick={(e) => { e.stopPropagation(); setTab('api'); }}>接口说明<span className="tb-badge">API</span></button>
        </div>
      )}
      {hasOverview && (!showTabs || tab === 'overview') && (
        <>
          {m.text && <div className="dn-desc-text">{m.text}</div>}
          {m.list && m.list.length > 0 && (
            <ul className="dn-desc-list">{m.list.map((it, j) => <li key={j}>{it}</li>)}</ul>
          )}
        </>
      )}
      {hasApiContent && (!showTabs || tab === 'api') && (
        <div className="dn-desc-text dn-rich" dangerouslySetInnerHTML={{ __html: m.apiRich }} />
      )}
      <div className="dn-desc-foot">
        <button className="dn-desc-edit" title="编辑本模块说明（标题 / 状态 / 关联页面模块 / 页面说明 / 接口说明 / 删除）"
          onClick={(e) => { e.stopPropagation(); onEdit(m, index); }}>✎ 编辑说明</button>
      </div>
    </div>
  );
}

/* ---------- 模块编辑大弹窗（页面说明 + 接口说明 两个编辑区） ---------- */
function DescModal({ initial, onSave, onClose, bindOptions, onDelete }) {
  const [title, setTitle] = useState(initial.title);
  const [status, setStatus] = useState(initial.status ?? 'designing');
  const [bind, setBind] = useState(initial.bind ?? (initial.id.startsWith('custom-') ? '' : initial.id));
  const [confirmDel, setConfirmDel] = useState(false);
  const confirmDelRef = useRef(false);
  confirmDelRef.current = confirmDel;
  const editorRef = useRef(null);
  const apiEditorRef = useRef(null);
  const savedRangeRef = useRef(null);
  const [color, setColor] = useState('#0067b8');
  const [mtab, setMtab] = useState('overview');

  useEffect(() => {
    if (editorRef.current) editorRef.current.innerHTML = plainToEditorHtml(initial);
    if (apiEditorRef.current) apiEditorRef.current.innerHTML = initial.apiRich || '';
  }, [initial]);

  useEffect(() => {
    // 删除确认层开着时，Esc 只关确认层（由 ConfirmDelete 处理），不要连编辑弹窗一起关掉
    const onKey = (e) => { if (e.key === 'Escape' && !confirmDelRef.current) onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const saveSelection = (ref) => {
    const sel = window.getSelection();
    const editor = ref.current;
    if (sel && sel.rangeCount > 0 && editor && editor.contains(sel.anchorNode)) {
      savedRangeRef.current = { ref, range: sel.getRangeAt(0).cloneRange() };
    }
  };
  const exec = (ref, cmd, value) => {
    const editor = ref.current;
    if (!editor) return;
    editor.focus();
    const sel = window.getSelection();
    if (savedRangeRef.current && savedRangeRef.current.ref === ref && sel) {
      sel.removeAllRanges();
      sel.addRange(savedRangeRef.current.range);
    }
    document.execCommand(cmd, false, value);
    saveSelection(ref);
  };

  const handleSave = () => {
    const overviewHtml = sanitizeRichHtml((editorRef.current?.innerHTML ?? '').trim());
    const apiHtml = sanitizeRichHtml((apiEditorRef.current?.innerHTML ?? '').trim());
    onSave({
      id: initial.id,
      title: title.trim() || initial.title,
      status: status || undefined,
      bind: bind || undefined,
      text: plainTextOfHtml(overviewHtml),
      list: listItemsOfHtml(overviewHtml),
      apiRich: apiHtml || undefined,
    });
  };

  return (
    <>
    <div className="dn-modal-mask">
      <div className="dn-modal">
        <div className="dn-modal-head">
          <div className="dn-modal-title">编辑设计说明模块</div>
          <button className="dn-modal-close" onClick={onClose} title="关闭">✕</button>
        </div>
        <div className="dn-modal-body">
          <div className="dn-modal-field">
            <div className="dn-modal-label">模块标题</div>
            <input value={title} onChange={(e) => setTitle(e.target.value)} placeholder="模块标题" autoFocus />
          </div>
          <div className="dn-modal-field">
            <div className="dn-modal-label">状态标记（用于标注这个功能做到哪一步，再点一次可取消）</div>
            <div className="dn-status-picker">
              {STATUS_ORDER.map((k) => {
                const meta = STATUS_META[k];
                const on = status === k;
                return (
                  <button type="button" key={k} className={`dn-status-opt${on ? ' on' : ''}`}
                    style={on ? { color: meta.color, background: meta.bg, borderColor: meta.color } : undefined}
                    onClick={() => setStatus(on ? '' : k)}>
                    <i className="dn-status-dot" style={{ background: on ? meta.color : '#c2ccda' }} />
                    {meta.label}
                  </button>
                );
              })}
            </div>
          </div>
          <div className="dn-modal-field">
            <div className="dn-modal-label">关联页面模块（卡片上不再展示，统一在此查看与修改）</div>
            <select value={bind} onChange={(e) => setBind(e.target.value)}>
              <option value="">（不关联 · 仅作补充说明，不画连线）</option>
              {(bindOptions || []).map((o) => (
                <option key={o.id} value={o.id}>{o.label}（{o.id}）{o.bound ? ` · 已被第 ${o.bound} 条使用` : ''}</option>
              ))}
            </select>
            {(() => {
              const hit = (bindOptions || []).find((o) => o.id === bind);
              if (!bind) {
                return <div className="dn-bind-state none"><i className="dn-status-dot" />当前未关联页面模块，保存后卡片不出现连线（说明内容照常保存）。</div>;
              }
              if (bind.startsWith('page-')) {
                return <div className="dn-bind-state ok"><i className="dn-status-dot" />当前关联本页整页（{bind}），保存后连线指向页面顶部区域。</div>;
              }
              if (hit) {
                return <div className="dn-bind-state ok"><i className="dn-status-dot" />当前已关联「{hit.label}」，保存后自动生成连线。</div>;
              }
              return <div className="dn-bind-state warn"><i className="dn-status-dot" />当前关联目标「{bind}」不在此视图已渲染的区域里——它可能在弹窗 / 页签 / 步骤条中，打开对应视图后会自动连线，说明内容不受影响。</div>;
            })()}
          </div>
          <div className="dn-modal-field">
            <div className="dn-tabs modal-tabs">
              <button type="button" className={`dn-tab ${mtab === 'overview' ? 'on' : ''}`} onClick={() => setMtab('overview')}>页面说明</button>
              <button type="button" className={`dn-tab ${mtab === 'api' ? 'on' : ''}`} onClick={() => setMtab('api')}>接口说明<span className="tb-badge">API</span></button>
            </div>
            <div style={{ display: mtab === 'overview' ? 'block' : 'none' }}>
              <div className="dn-editor-wrap">
                <div className="dn-editor-toolbar" onMouseDown={(e) => { e.preventDefault(); saveSelection(editorRef); }}>
                  <button type="button" className="dn-editor-btn" title="加粗" onClick={() => exec(editorRef, 'bold')}><b>B</b></button>
                  <button type="button" className="dn-editor-btn" title="斜体" onClick={() => exec(editorRef, 'italic')}><i>I</i></button>
                  <button type="button" className="dn-editor-btn" title="下划线" onClick={() => exec(editorRef, 'underline')}><u>U</u></button>
                  <span className="dn-toolbar-sep" />
                  <label className="dn-editor-btn dn-color-btn" title={`字体颜色：${color}`} onMouseDown={() => saveSelection(editorRef)}>
                    <span className="dn-color-a" style={{ color }}>A</span>
                    <input type="color" value={color} onChange={(e) => { setColor(e.target.value); exec(editorRef, 'foreColor', e.target.value); }} />
                  </label>
                  <button type="button" className="dn-editor-btn" title="项目符号" onClick={() => exec(editorRef, 'insertUnorderedList')}>• 列表</button>
                  <button type="button" className="dn-editor-btn" title="清除所选格式" onClick={() => exec(editorRef, 'removeFormat')}>清除格式</button>
                </div>
                <div ref={editorRef} className="dn-editor" contentEditable suppressContentEditableWarning
                  data-placeholder="页面说明：写清页面结构、字段口径、操作交互、校验规则、状态边界；要点用「• 列表」转为项目符号；无内容可留空"
                  onMouseUp={() => saveSelection(editorRef)} onKeyUp={() => saveSelection(editorRef)} />
              </div>
            </div>
            <div style={{ display: mtab === 'api' ? 'block' : 'none' }}>
              <div className="dn-editor-wrap">
                <div className="dn-editor-toolbar" onMouseDown={(e) => { e.preventDefault(); saveSelection(apiEditorRef); }}>
                  <button type="button" className="dn-editor-btn" title="加粗" onClick={() => exec(apiEditorRef, 'bold')}><b>B</b></button>
                  <button type="button" className="dn-editor-btn" title="项目符号" onClick={() => exec(apiEditorRef, 'insertUnorderedList')}>• 列表</button>
                  <button type="button" className="dn-editor-btn" title="清除所选格式" onClick={() => exec(apiEditorRef, 'removeFormat')}>清除格式</button>
                </div>
                <div ref={apiEditorRef} className="dn-editor short" contentEditable suppressContentEditableWarning
                  data-placeholder="接口说明：写清请求方式 / 路径 / 鉴权、请求参数与响应字段、绑定表与批次规则、错误码、报文样例；本区块不涉及接口对接时留空"
                  onMouseUp={() => saveSelection(apiEditorRef)} onKeyUp={() => saveSelection(apiEditorRef)} />
              </div>
            </div>
          </div>
        </div>
        <div className="dn-modal-foot">
          {onDelete ? (
            <button className="dn-modal-btn danger-ghost" title="删除这张卡片（会先二次确认）"
              onClick={() => setConfirmDel(true)}>删除这张卡片</button>
          ) : <span />}
          <span className="dn-foot-right">
            <button className="dn-modal-btn ghost" onClick={onClose}>取消</button>
            <button className="dn-modal-btn primary" onClick={handleSave}>保存修改</button>
          </span>
        </div>
      </div>
    </div>
      {confirmDel && onDelete && (
        <ConfirmDelete
          title={title.trim() || initial.title}
          onCancel={() => setConfirmDel(false)}
          onConfirm={() => { setConfirmDel(false); onDelete(); }}
        />
      )}
    </>
  );
}

/* ---------- 删除二次确认 ---------- */
function ConfirmDelete({ title, onCancel, onConfirm }) {
  useEffect(() => {
    const onKey = (e) => {
      // 本层叠在编辑弹窗之上：独占键盘，避免一次按键既关确认层又关编辑弹窗
      if (e.key === 'Escape') { e.stopImmediatePropagation(); e.preventDefault(); onCancel(); }
      const onButton = e.target instanceof HTMLElement && e.target.tagName === 'BUTTON';
      if (e.key === 'Enter' && !onButton) { e.stopImmediatePropagation(); e.preventDefault(); onConfirm(); }
    };
    window.addEventListener('keydown', onKey, true);
    return () => window.removeEventListener('keydown', onKey, true);
  }, [onCancel, onConfirm]);
  return (
    <div className="dn-confirm-mask" onClick={onCancel}>
      <div className="dn-confirm" role="dialog" aria-modal="true" onClick={(e) => e.stopPropagation()}>
        <div className="dn-confirm-head">
          <span className="dn-confirm-icon">!</span>
          <span className="dn-confirm-title">删除这张设计说明卡片？</span>
        </div>
        <div className="dn-confirm-body">
          即将删除「<b>{title}</b>」。删除后无法撤销，该页面区域会重新显示「+ 说明」入口，需要时可再建卡片。
        </div>
        <div className="dn-confirm-foot">
          <button className="dn-modal-btn ghost" onClick={onCancel} autoFocus>取消</button>
          <button className="dn-modal-btn danger" onClick={onConfirm}>确认删除</button>
        </div>
      </div>
    </div>
  );
}

/* ---------- 主组件 ---------- */
function DesignNotesPanel({ modules, pageKey, pageSub, leftContentRef, onSave, title = '设计说明', contentKey, hint }) {
  const [editing, setEditing] = useState(null);
  const [localOverride, setLocalOverride] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const [allTargets, setAllTargets] = useState([]);
  const [quickAddTarget, setQuickAddTarget] = useState(null);
  const [collapsed, setCollapsed] = useState(() => {
    try { return localStorage.getItem('dn-collapsed') === '1'; } catch (e) { return false; }
  });
  useEffect(() => {
    try { localStorage.setItem('dn-collapsed', collapsed ? '1' : '0'); } catch (e) {}
  }, [collapsed]);
  useEffect(() => { if (collapsed) setQuickAddTarget(null); }, [collapsed]);

  const contentSig = (() => {
    const s = modules.map((m) => `${m.id}|${m.title}|${m.status ?? ''}|${m.text ?? ''}|${m.rich ?? ''}|${m.apiRich ?? ''}|${(m.list ?? []).join('~')}`).join('||');
    let h = 5381;
    for (let i = 0; i < s.length; i += 1) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return (h >>> 0).toString(36);
  })();
  const storageKey = `dn-notes-${pageKey}-${pageSub ?? ''}-${modules.map((m) => m.id).join(',')}-${contentSig}`;
  const displayModules = localOverride ?? modules;
  // 最近一次落盘成功的内容签名：区分「草稿待保存」与「已保存、等真源追平」
  const savedSigRef = useRef(null);

  useEffect(() => {
    savedSigRef.current = null;
    const saved = localStorage.getItem(storageKey);
    if (!saved) { setLocalOverride(null); return; }
    try { const parsed = JSON.parse(saved); if (Array.isArray(parsed)) setLocalOverride(parsed); } catch (e) {}
    // eslint-disable-next-line
  }, [storageKey]);

  // 真源追平草稿后收敛（源码热更新 / 重新取数后内容一致）
  useEffect(() => {
    if (localOverride && modulesSig(localOverride) === modulesSig(modules)) setLocalOverride(null);
  }, [modules, localOverride]);

  const persist = (next) => {
    setLocalOverride(next);
    setSaveError(null);
    try { localStorage.setItem(storageKey, JSON.stringify(next)); } catch (e) {}
    if (!onSave) return;
    Promise.resolve(onSave(next, { pageKey: pageKey, pageSub: pageSub })).then(
      () => {
        setSaveError(null);
        savedSigRef.current = modulesSig(next);
        // 保留乐观视图，等真源追平后再收敛（否则静态真源未热更新时，刚删的卡片会「消失又回来」）
        try { localStorage.removeItem(storageKey); } catch (e) {}
      },
      (err) => { console.error('[设计说明落盘失败]', err); setSaveError(err instanceof Error ? err.message : '设计说明保存失败，请重试'); }
    );
  };

  const handleSaveModule = (m) => {
    if (editing) {
      const next = [...displayModules];
      if (editing.isNew) next.push(m); else next[editing.index] = m;
      persist(next);
    }
    setEditing(null);
  };
  const addModule = () => setEditing({ m: { id: `custom-${Date.now()}`, title: '新模块', text: '', list: [] }, index: -1, isNew: true });
  const addModuleBoundTo = (bindId) => {
    const label = allTargets.find((t) => t.id === bindId)?.label;
    setEditing({ m: { id: `custom-${Date.now()}`, title: label || '待补充', text: '', list: [], bind: bindId }, index: -1, isNew: true });
    setQuickAddTarget(null);
  };
  const removeModule = (index) => persist(displayModules.filter((_, i) => i !== index));
  // 删除入口统一收在编辑弹窗里（卡片上不放删除按钮）：弹窗内二次确认通过后回调到这里
  const handleDeleteModule = () => {
    if (!editing || editing.isNew) return;
    removeModule(editing.index);
    setEditing(null);
  };
  const handleReset = () => { try { localStorage.removeItem(storageKey); } catch (e) {} setLocalOverride(null); setSaveError(null); };

  const [activeId, setActiveId] = useState(null);
  const activeIdRef = useRef(activeId); activeIdRef.current = activeId;
  const rightRef = useRef(null), svgRef = useRef(null);
  const connsRef = useRef([]); const quickAddHideTimer = useRef(null);
  const hoverElRef = useRef(null);

  const revealCard = (bindId) => {
    setQuickAddTarget(null);
    setActiveId(bindId);
    const card = rightRef.current?.querySelector(`.dn-desc[data-proto-id="${CSS.escape(bindId)}"]`);
    card?.scrollIntoView({ behavior: 'smooth', block: 'center' });
  };

  // SVG 连线（含弹窗 / 页签引起的 DOM 变化重绘）
  useEffect(() => {
    const left = leftContentRef.current, right = rightRef.current, svg = svgRef.current;
    if (!left || !right || !svg) return;
    const indexMap = new Map(displayModules.map((m, i) => [m.bind ?? m.id, i + 1]));
    const draw = () => {
      svg.innerHTML = ''; connsRef.current = [];
      const leftEls = Array.from(left.querySelectorAll('[data-proto-id]'));
      leftEls.forEach((le) => {
        const pid = le.getAttribute('data-proto-id');
        const res = right.querySelectorAll(`.dn-desc[data-proto-id="${CSS.escape(pid)}"]`);
        if (!res.length) return;
        const lr = le.getBoundingClientRect();
        if (!lr.width || !lr.height) return;
        res.forEach((re, j) => {
          const rr = re.getBoundingClientRect();
          if (!rr.width || !rr.height) return;
          const x1 = lr.right, y1 = lr.top + lr.height / 2, x2 = rr.left, y2 = rr.top + rr.height / 2 + j * 10;
          const dx = Math.max((x2 - x1) * 0.4, 40);
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); g.setAttribute('class', 'dn-connection');
          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
          path.setAttribute('class', 'dn-connection-line'); g.appendChild(path);
          const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
          const bg = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          bg.setAttribute('cx', String(midX)); bg.setAttribute('cy', String(midY)); bg.setAttribute('r', '10'); bg.setAttribute('class', 'dn-connection-bg'); g.appendChild(bg);
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', String(midX)); text.setAttribute('y', String(midY)); text.setAttribute('dy', '0.05em'); text.setAttribute('class', 'dn-connection-label');
          const num = indexMap.get(pid); text.textContent = num != null ? String(num) : '';
          g.appendChild(text);
          const act = activeIdRef.current !== null && String(pid) === String(activeIdRef.current);
          connsRef.current.push({ pid, g, le, re });
          if (act) { g.classList.add('active'); le.classList.add('active-highlight'); re.classList.add('active-highlight'); }
          svg.appendChild(g);
        });
      });
    };
    draw();
    const onScroll = () => requestAnimationFrame(draw);
    left.addEventListener('scroll', onScroll, { passive: true });
    right.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
    const domMo = new MutationObserver(() => requestAnimationFrame(draw));
    domMo.observe(left, { childList: true, subtree: true });
    return () => {
      left.removeEventListener('scroll', onScroll);
      right.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', onScroll);
      domMo.disconnect();
    };
  }, [displayModules, leftContentRef, contentKey, collapsed, editing]);

  // 扫描可关联清单（全量，含已绑定项，仅标注占用序号）
  useEffect(() => {
    const left = leftContentRef.current;
    if (!left) { setAllTargets([]); return; }
    let lastKey = '';
    const scan = () => {
      const seen = new Set(); const all = [];
      left.querySelectorAll('[data-proto-id]').forEach((le) => {
        const id = le.getAttribute('data-proto-id');
        if (seen.has(id)) return;
        seen.add(id); all.push({ id, label: deriveLabel(le, id) });
      });
      const key = all.map((t) => `${t.id}:${t.label}`).join('|');
      if (key === lastKey) return;
      lastKey = key; setAllTargets(all);
    };
    scan();
    const mo = new MutationObserver(() => scan());
    mo.observe(left, { childList: true, subtree: true });
    return () => mo.disconnect();
  }, [leftContentRef, contentKey, displayModules]);

  // 悬浮打标区域：未绑定 → 「+ 说明」；已绑定 → 「✓ 已说明」（事件委托，弹窗里新元素同样生效）
  useEffect(() => {
    const left = leftContentRef.current;
    if (!left || collapsed) return;
    const boundIds = new Set(displayModules.map((m) => m.bind ?? m.id));
    const over = (e) => {
      const el = e.target.closest && e.target.closest('[data-proto-id]');
      if (!el || el === hoverElRef.current) return;
      hoverElRef.current = el;
      if (quickAddHideTimer.current) { clearTimeout(quickAddHideTimer.current); quickAddHideTimer.current = null; }
      const id = el.getAttribute('data-proto-id');
      setQuickAddTarget({ id: id, rect: el.getBoundingClientRect(), bound: boundIds.has(id) });
    };
    const out = (e) => {
      const to = e.relatedTarget;
      if (to && to.closest && to.closest('[data-proto-id]')) return;
      hoverElRef.current = null;
      if (quickAddHideTimer.current) clearTimeout(quickAddHideTimer.current);
      quickAddHideTimer.current = setTimeout(() => setQuickAddTarget(null), 1000);
    };
    left.addEventListener('mouseover', over);
    left.addEventListener('mouseout', out);
    return () => { left.removeEventListener('mouseover', over); left.removeEventListener('mouseout', out); };
  }, [leftContentRef, contentKey, displayModules, collapsed]);

  useEffect(() => {
    const hide = () => setQuickAddTarget(null);
    window.addEventListener('scroll', hide, true); window.addEventListener('resize', hide);
    return () => { window.removeEventListener('scroll', hide, true); window.removeEventListener('resize', hide); };
  }, []);

  useEffect(() => {
    connsRef.current.forEach((c) => {
      const act = activeId !== null && String(c.pid) === String(activeId);
      c.g.classList.toggle('active', act); c.le.classList.toggle('active-highlight', act); c.re.classList.toggle('active-highlight', act);
    });
  }, [activeId]);

  const handleHover = (e) => { const el = e.target.closest('[data-proto-id]'); if (el) setActiveId(el.getAttribute('data-proto-id')); };
  const hasOverride = localOverride !== null && modulesSig(localOverride) !== savedSigRef.current;

  return (
    <>
      <style>{DescStyle}</style>
      <aside ref={rightRef} className={`dn-right${collapsed ? ' collapsed' : ''}`} onMouseOver={handleHover} onMouseLeave={() => setActiveId(null)}>
        {collapsed ? (
          <button className="dn-rail" onClick={() => setCollapsed(false)} title={`展开设计说明（本页 ${displayModules.length} 张卡片）`}>
            <span className="dn-rail-arrow">‹</span>
            <span className="dn-rail-text">设计说明</span>
            <span className="dn-rail-count">{displayModules.length}</span>
          </button>
        ) : (
          <>
            <div className="dn-rd-titlebar" style={{ justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                <span className="dn-rd-badge">DESIGN NOTES</span>
                <span className="dn-rd-title">{title}</span>
              </div>
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                {saveError ? (
                  <span style={{ fontSize: 10, color: C.danger, display: 'flex', alignItems: 'center', gap: 4 }} title={saveError}>
                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: C.danger, display: 'inline-block' }} />⚠ 落盘失败
                  </span>
                ) : hasOverride ? (
                  <span style={{ fontSize: 10, color: '#b7791f', display: 'flex', alignItems: 'center', gap: 4 }}>
                    <span style={{ width: 6, height: 6, borderRadius: '50%', background: '#b7791f', display: 'inline-block' }} />本地草稿·待保存
                  </span>
                ) : null}
                {hasOverride && onSave && (
                  <button onClick={() => persist(displayModules)} title="将设计说明写入真源（落盘）" style={{ fontSize: 11, padding: '4px 10px', background: C.primary, color: '#fff', border: 'none', borderRadius: 4, cursor: 'pointer' }}>保存到真源</button>
                )}
                <button onClick={handleReset} title="恢复为默认说明内容" style={{ fontSize: 11, padding: '4px 10px', background: '#fff', color: C.text3, border: `1px solid ${C.border}`, borderRadius: 4, cursor: 'pointer' }}>重置</button>
                <button className="dn-collapse-btn" onClick={() => setCollapsed(true)} title="收起设计说明，把宽度让给页面">» 收起</button>
              </div>
            </div>
            <p className="dn-rd-hint">{hint ?? '鼠标悬浮左侧带标注的区域：未写说明的显示「+ 说明」点击即建卡片，已写的显示「✓ 已说明」点击跳到卡片。卡片可以先放空，之后点卡片补写，或直接在对话里让 AI 按区域补上；编辑、关联与删除都在卡片底部「✎ 编辑说明」弹窗里。'}</p>
            {(() => {
              const counts = STATUS_ORDER.map((k) => ({ k: k, n: displayModules.filter((m) => m.status === k).length })).filter((x) => x.n > 0);
              if (!counts.length) return null;
              return (
                <div className="dn-rd-legend">
                  <span className="lg">共 <b>{displayModules.length}</b> 条</span>
                  {counts.map(({ k, n }) => (
                    <span className="lg" key={k}>
                      <i className="dn-status-dot" style={{ background: STATUS_META[k].color }} />
                      {STATUS_META[k].label} <b>{n}</b>
                    </span>
                  ))}
                </div>
              );
            })()}
            {displayModules.map((m, i) => (
              <DescCard key={`${m.id}-${i}`} m={m} index={i}
                onEdit={(mod, idx) => setEditing({ m: mod, index: idx })} />
            ))}
            <button className="dn-add-module" onClick={addModule}>+ 添加模块</button>
          </>
        )}
      </aside>
      <svg className="dn-connections" ref={svgRef}></svg>
      {quickAddTarget && (
        quickAddTarget.bound ? (
          <button className="dn-quick-add bound" style={{ left: quickAddTarget.rect.right - 8, top: quickAddTarget.rect.top + 4 }}
            onMouseEnter={() => { if (quickAddHideTimer.current) { clearTimeout(quickAddHideTimer.current); quickAddHideTimer.current = null; } }}
            onMouseLeave={() => setQuickAddTarget(null)}
            onClick={() => revealCard(quickAddTarget.id)}>✓ 已说明</button>
        ) : (
          <button className="dn-quick-add" style={{ left: quickAddTarget.rect.right - 8, top: quickAddTarget.rect.top + 4 }}
            onMouseEnter={() => { if (quickAddHideTimer.current) { clearTimeout(quickAddHideTimer.current); quickAddHideTimer.current = null; } }}
            onMouseLeave={() => setQuickAddTarget(null)}
            onClick={() => addModuleBoundTo(quickAddTarget.id)}>+ 说明</button>
        )
      )}
      {editing && (
        <DescModal initial={editing.m} onSave={handleSaveModule} onClose={() => setEditing(null)}
          onDelete={editing.isNew ? undefined : handleDeleteModule}
          bindOptions={allTargets.map((t) => ({
            ...t,
            bound: displayModules.findIndex((mod, i) => i !== editing.index && (mod.bind ?? mod.id) === t.id) + 1 || undefined,
          }))} />
      )}
    </>
  );
}

const toastRef = { current: null };
function showToast(msg) {
  let el = toastRef.current;
  if (!el) { el = document.createElement('div'); el.className = 'demo-toast'; document.body.appendChild(el); toastRef.current = el; }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1800);
}

// 模拟落盘适配器（无真实后端）：延迟后 resolve，并把结果打到控制台 + 页面 toast

  return new Promise((res) => {
    setTimeout(() => { console.log('[demo 模拟落盘] meta=', meta, ' next=', next); showToast('已写入模拟真源（见控制台）'); res(); }, 400);
  });
}
