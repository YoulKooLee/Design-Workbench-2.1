<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>居中高亮词 · hero-centered-highlight</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="./block.css" />
  <style>
    body { background: #ffffff; }
    html[data-theme='dark'] body { background: var(--wa-color-bg, #0d0d0d); }
    html.wa-block-embed { height: 100%; }
    body.wa-block-embed { margin: 0; min-height: 0 !important; height: auto; background: #ffffff; }
    html[data-theme='dark'] body.wa-block-embed { background: var(--wa-color-bg, #0d0d0d); }
    body.wa-block-embed #app { min-height: 0; }
  </style>
</head>
<body>
  <script>
    try {
      if (new URLSearchParams(location.search).get('embed') === '1') {
        document.documentElement.classList.add('wa-block-embed')
        document.addEventListener('DOMContentLoaded', function () {
          document.body.classList.add('wa-block-embed')
        })
      }
    } catch (e) { /* ignore */ }
  </script>
  <div id="app" v-cloak>
    <section class="wa-section wa-fade-in" data-slug="hero-centered-highlight" id="hero">
      <div class="wa-section__inner hero-centered-highlight">
        <a class="hero-centered-highlight__pill" href="javascript:void(0)" @click.prevent="onCta('查看版本')">
          <span class="hero-centered-highlight__pill-tag">新</span>
          <span>v2.2 现已发布</span>
        </a>
        <h1 class="wa-title">
          用<span class="hero-centered-highlight__mark">创新</span>工具释放你的创造力
        </h1>
        <p class="wa-lead">用一套工具释放你的潜力，把想法变成现实。轻松创造、构建与启发，并取得真正出色的成果。</p>
        <div class="wa-btn-row hero-centered-highlight__actions">
          <a-button size="large" type="primary" @click="onCta('立即开始')">立即开始</a-button>
          <a-button size="large" type="outline" class="hero-centered-highlight__video" @click="openVideo">
            <i class="fa-light fa-circle-play" aria-hidden="true"></i>
            观看视频
          </a-button>
        </div>
      </div>
    </section>

    <a-modal
      v-model:visible="videoOpen"
      title="产品演示"
      title-align="start"
      :footer="false"
      :width="720"
      unmount-on-close
      modal-class="pro-content-modal"
      @cancel="videoOpen = false"
    >
      <div class="hero-centered-highlight__player" role="img" aria-label="视频占位，落地时替换为自有嵌入地址">
        <i class="fa-light fa-circle-play" aria-hidden="true"></i>
        <p>预览占位 · 勿外链 CDN 视频床</p>
      </div>
    </a-modal>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="./block.js"></script>
  <script src="../../embed-fit.js"></script>
</body>
</html>
