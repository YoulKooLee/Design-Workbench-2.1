<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>折叠列表 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="overflow-list">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">overflow-list</p>
          <h1 class="wa-fam-title">折叠列表</h1>
          <p class="wa-fam-lead">空间不足时折叠多余项，用于标签组、头像组与筛选条。</p>
          <p class="wa-fam-lead">组件类型：default / from-start / overflow-slot</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="overflow-list-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">折叠列表</span><span class="wa-comp-meta__slug">overflow-list-default</span></div>
              <a-tooltip :content="famCopyTip('overflow-list-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('overflow-list-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('overflow-list-default')"
                :aria-label="famCopyTip('overflow-list-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('overflow-list-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-overflow-list style="width:240px">
                <a-tag v-for="t in tags" :key="t">{{ t }}</a-tag>
              </a-overflow-list>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="overflow-list-from-start">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">从首折叠</span><span class="wa-comp-meta__slug">overflow-list-from-start</span></div>
              <a-tooltip :content="famCopyTip('overflow-list-from-start')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('overflow-list-from-start') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('overflow-list-from-start')"
                :aria-label="famCopyTip('overflow-list-from-start')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('overflow-list-from-start')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-overflow-list style="width:240px" from="start">
                <a-tag v-for="t in tags" :key="t">{{ t }}</a-tag>
              </a-overflow-list>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="overflow-list-overflow-slot">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">自定义折叠项</span><span class="wa-comp-meta__slug">overflow-list-overflow-slot</span></div>
              <a-tooltip :content="famCopyTip('overflow-list-overflow-slot')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('overflow-list-overflow-slot') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('overflow-list-overflow-slot')"
                :aria-label="famCopyTip('overflow-list-overflow-slot')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('overflow-list-overflow-slot')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-overflow-list style="width:240px">
                <a-tag v-for="t in tags" :key="t">{{ t }}</a-tag>
                <template #overflow="{ number }">
                  <a-popover position="top">
                    <a-tag>+{{ number }}</a-tag>
                    <template #content>
                      <div style="display:flex;flex-wrap:wrap;gap:8px;max-width:220px">
                        <a-tag v-for="t in overflowEnd(number)" :key="t">{{ t }}</a-tag>
                      </div>
                    </template>
                  </a-popover>
                </template>
              </a-overflow-list>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'overflow-list',
      members: [
        'overflow-list-default',
        'overflow-list-from-start',
        'overflow-list-overflow-slot',
      ],
      setup: function () {
        var tags = ['产品', '设计', '研发', '运营', '市场', '销售', '客服']
        return {
          tags: tags,
          overflowEnd: function (number) {
            var n = Math.max(0, Number(number) || 0)
            return tags.slice(-n)
          },
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
