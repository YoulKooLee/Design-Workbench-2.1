<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>悬浮登录抽屉 · drawer-float-login</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css?v=20261015demo3" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="drawer-float-login">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">悬浮登录抽屉</span>
        <span class="wa-comp-meta__slug">drawer-float-login</span>
      </div>
      <div class="wa-embed__stage">
        <a-button type="secondary" @click="visible = true">重新登录</a-button>
        <a-drawer
          v-model:visible="visible"
          placement="bottom"
          :height="'auto'"
          :closable="false"
          body-class="wa-drawer-float wa-drawer-float--bottom"
          unmount-on-close
          @cancel="visible = false"
        >
          <template #title>
            <div class="wa-drawer-float__head--center">
              <div class="wa-drawer-float__handle" aria-hidden="true"></div>
              <p class="wa-drawer-float__title">登录</p>
              <p class="wa-drawer-float__desc">请重新登录以继续使用应用。</p>
            </div>
          </template>
          <a-form class="wa-drawer-float-form" :model="form" layout="vertical">
            <a-form-item label="邮箱">
              <a-input v-model="form.email" placeholder="hello@example.com" allow-clear></a-input>
            </a-form-item>
            <a-form-item label="密码">
              <a-input-password v-model="form.password" placeholder="请输入密码" allow-clear></a-input-password>
            </a-form-item>
          </a-form>
          <template #footer>
            <a-button type="primary" shape="round" @click="visible = false">登录</a-button>
            <a-button type="secondary" shape="round" @click="visible = false">取消</a-button>
          </template>
        </a-drawer>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
