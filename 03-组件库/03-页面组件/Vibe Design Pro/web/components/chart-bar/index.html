<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>柱状图 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="../../assets/common/charts/shadcn-chart.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="chart-bar">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">chart-bar</p>
          <h1 class="wa-fam-title">柱状图</h1>
          <p class="wa-fam-lead">纵向柱对比分类数值，适合周报量、渠道贡献与构成拆解。</p>
          <p class="wa-fam-lead">组件类型：default / grouped / stacked</p>
        </header>
        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="chart-bar-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">基础柱状图</span><span class="wa-comp-meta__slug">chart-bar-default</span></div>
              <a-tooltip :content="famCopyTip('chart-bar-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-bar-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-bar-default')"
                :aria-label="famCopyTip('chart-bar-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-bar-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-bar-default" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-bar-default"></div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-bar-grouped">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">分组柱状图</span><span class="wa-comp-meta__slug">chart-bar-grouped</span></div>
              <a-tooltip :content="famCopyTip('chart-bar-grouped')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-bar-grouped') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-bar-grouped')"
                :aria-label="famCopyTip('chart-bar-grouped')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-bar-grouped')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-bar-grouped" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-bar-grouped"></div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="chart-bar-stacked">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">堆积柱状图</span><span class="wa-comp-meta__slug">chart-bar-stacked</span></div>
              <a-tooltip :content="famCopyTip('chart-bar-stacked')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('chart-bar-stacked') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('chart-bar-stacked')"
                :aria-label="famCopyTip('chart-bar-stacked')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('chart-bar-stacked')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div id="host-chart-bar-stacked" class="shadcn-chart-host" style="min-height:260px"></div>
              <div class="shadcn-chart-legend" data-legend-for="chart-bar-stacked"></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../vendor/unovis/unovis.min.js"></script>
  <script src="../../assets/common/charts/chart-palette.js"></script>
  <script src="../../assets/common/charts/shadcn-charts.js"></script>
  <script src="../../assets/common/charts/wa-chart-demos.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
  window.WA_FAMILY = {
    id: 'chart-bar',
    members: ['chart-bar-default', 'chart-bar-grouped', 'chart-bar-stacked'],
    setup: function () {
      var charts = []
      Vue.onMounted(function () {
        Vue.nextTick(function () {
          if (!window.WaChartDemos) return
          charts = WaChartDemos.mountFamily('chart-bar') || []
        })
      })
      Vue.onBeforeUnmount(function () {
        if (window.ProShadcnCharts) charts.forEach(function (c) { ProShadcnCharts.destroy(c) })
      })
      return {}
    }
  }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
