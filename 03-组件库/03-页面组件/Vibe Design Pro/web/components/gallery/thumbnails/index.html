<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>缩略图画廊 · gallery-thumbnails</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
  <link rel="stylesheet" href="../component.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="gallery-thumbnails">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">缩略图画廊</span>
        <span class="wa-comp-meta__slug">gallery-thumbnails</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-gallery-wrap wa-gallery-wrap--thumbs">
          <a-carousel class="wa-gallery" v-model:current="thumbCurrent" indicator-type="never" show-arrow="hover">
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_01.jpg" alt="产品图一" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_02.jpg" alt="产品图二" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_03.jpg" alt="产品图三" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_04.jpg" alt="产品图四" />
              </div>
            </a-carousel-item>
            <a-carousel-item>
              <div class="wa-gallery-slide">
                <img src="../../../assets/images/image_05.jpg" alt="产品图五" />
              </div>
            </a-carousel-item>
          </a-carousel>
          <div class="wa-gallery-thumbs" role="tablist" aria-label="缩略图">
            <button
              type="button"
              class="wa-gallery-thumb"
              :class="{ 'is-active': thumbCurrent === 1 }"
              :aria-label="'切换到产品图一'"
              @click="thumbCurrent = 1"
            >
              <img src="../../../assets/images/image_01.jpg" alt="产品图一" />
            </button>
            <button
              type="button"
              class="wa-gallery-thumb"
              :class="{ 'is-active': thumbCurrent === 2 }"
              :aria-label="'切换到产品图二'"
              @click="thumbCurrent = 2"
            >
              <img src="../../../assets/images/image_02.jpg" alt="产品图二" />
            </button>
            <button
              type="button"
              class="wa-gallery-thumb"
              :class="{ 'is-active': thumbCurrent === 3 }"
              :aria-label="'切换到产品图三'"
              @click="thumbCurrent = 3"
            >
              <img src="../../../assets/images/image_03.jpg" alt="产品图三" />
            </button>
            <button
              type="button"
              class="wa-gallery-thumb"
              :class="{ 'is-active': thumbCurrent === 4 }"
              :aria-label="'切换到产品图四'"
              @click="thumbCurrent = 4"
            >
              <img src="../../../assets/images/image_04.jpg" alt="产品图四" />
            </button>
            <button
              type="button"
              class="wa-gallery-thumb"
              :class="{ 'is-active': thumbCurrent === 5 }"
              :aria-label="'切换到产品图五'"
              @click="thumbCurrent = 5"
            >
              <img src="../../../assets/images/image_05.jpg" alt="产品图五" />
            </button>
          </div>
        </div>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
