<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="tag-option">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">选项标签组</span>
        <span class="wa-comp-meta__slug">tag-option</span>
      </div>
      <div class="wa-embed__stage">
        <div class="wa-tag-option-group" role="radiogroup" aria-label="状态筛选">
          <a-tag
            checkable
            bordered
            class="wa-tag--pill wa-tag--option"
            :checked="option === 'draft'"
            @check="(v) => selectOption('draft', v)"
          >草稿箱</a-tag>
          <a-tag
            checkable
            bordered
            class="wa-tag--pill wa-tag--option"
            :checked="option === 'review'"
            @check="(v) => selectOption('review', v)"
          >审阅中</a-tag>
          <a-tag
            checkable
            bordered
            class="wa-tag--pill wa-tag--option"
            :checked="option === 'published'"
            @check="(v) => selectOption('published', v)"
          >已发布</a-tag>
          <a-tag
            checkable
            bordered
            class="wa-tag--pill wa-tag--option"
            :checked="option === 'archived'"
            @check="(v) => selectOption('archived', v)"
          >已归档</a-tag>
        </div>
      </div>
    </article>
  </div>

</body>
