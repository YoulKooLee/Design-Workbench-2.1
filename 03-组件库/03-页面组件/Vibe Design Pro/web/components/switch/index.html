<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>开关 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="switch">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">switch</p>
          <h1 class="wa-fam-title">开关</h1>
          <p class="wa-fam-lead">表单开关，用于启用或关闭一项设置，可带文字或加载中状态。</p>
          <p class="wa-fam-lead">组件类型：default / text / loading / disabled</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="switch-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">开关</span><span class="wa-comp-meta__slug">switch-default</span></div>
              <a-tooltip :content="famCopyTip('switch-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('switch-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('switch-default')"
                :aria-label="famCopyTip('switch-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('switch-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-switch v-model="enabled" />
            </div>
          </div>
          <div class="wa-fam-card" data-slug="switch-text">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">文字开关</span><span class="wa-comp-meta__slug">switch-text</span></div>
              <a-tooltip :content="famCopyTip('switch-text')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('switch-text') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('switch-text')"
                :aria-label="famCopyTip('switch-text')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('switch-text')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-switch v-model="enabledText" checked-text="开" unchecked-text="关" />
            </div>
          </div>
          <div class="wa-fam-card" data-slug="switch-loading">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">加载开关</span><span class="wa-comp-meta__slug">switch-loading</span></div>
              <a-tooltip :content="famCopyTip('switch-loading')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('switch-loading') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('switch-loading')"
                :aria-label="famCopyTip('switch-loading')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('switch-loading')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-switch v-model="enabledLoading" loading />
            </div>
          </div>
          <div class="wa-fam-card" data-slug="switch-disabled">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">禁用开关</span><span class="wa-comp-meta__slug">switch-disabled</span></div>
              <a-tooltip :content="famCopyTip('switch-disabled')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('switch-disabled') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('switch-disabled')"
                :aria-label="famCopyTip('switch-disabled')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('switch-disabled')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-switch v-model="enabledDisabled" disabled />
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'switch',
      members: ['switch-default', 'switch-text', 'switch-loading', 'switch-disabled'],
      setup: function (api) {
        return {
          enabled: api.ref(false),
          enabledText: api.ref(true),
          enabledLoading: api.ref(true),
          enabledDisabled: api.ref(true),
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
