<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>图片 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="image">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">image</p>
          <h1 class="wa-fam-title">图片</h1>
          <p class="wa-fam-lead">图片展示与预览，用于内容插图、相册与点击放大查看。</p>
          <p class="wa-fam-lead">组件类型：default / preview / group / error</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="image-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">图片</span><span class="wa-comp-meta__slug">image-default</span></div>
              <a-tooltip :content="famCopyTip('image-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('image-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('image-default')"
                :aria-label="famCopyTip('image-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('image-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-image-fit">
                  <a-image
                    width="100%"
                    height="100%"
                    fit="cover"
                    :preview="false"
                    src="../../assets/images/image_01.jpg"
                    alt="示例图"
                  />
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="image-preview">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">可预览图片</span><span class="wa-comp-meta__slug">image-preview</span></div>
              <a-tooltip :content="famCopyTip('image-preview')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('image-preview') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('image-preview')"
                :aria-label="famCopyTip('image-preview')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('image-preview')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-image-fit wa-image-fit--preview">
                  <a-image
                    width="100%"
                    height="100%"
                    fit="cover"
                    :preview="true"
                    src="../../assets/images/image_02.jpg"
                    alt="可预览"
                  />
                  <span class="wa-image-hint" aria-hidden="true"><icon-hand-pointer></icon-hand-pointer></span>
                </div>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="image-group">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">多图切换</span><span class="wa-comp-meta__slug">image-group</span></div>
              <a-tooltip :content="famCopyTip('image-group')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('image-group') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('image-group')"
                :aria-label="famCopyTip('image-group')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('image-group')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-image-preview-group
                  infinite
                  :src-list="groupSrcList"
                  v-model:visible="groupVisible"
                  v-model:current="groupCurrent"
                  @change="onGroupChange"
                  @visible-change="onGroupVisibleChange"
                >
                  <div class="wa-image-fit wa-image-fit--preview" role="button" tabindex="0" @click="openGroupPreview" @keydown.enter.prevent="openGroupPreview" @keydown.space.prevent="openGroupPreview">
                    <a-image
                      width="100%"
                      height="100%"
                      fit="cover"
                      :preview="false"
                      :src="groupSrcList[0]"
                      alt="图1"
                    />
                    <span class="wa-image-hint" aria-hidden="true"><icon-hand-pointer></icon-hand-pointer></span>
                  </div>
                </a-image-preview-group>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="image-error">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">加载失败图片</span><span class="wa-comp-meta__slug">image-error</span></div>
              <a-tooltip :content="famCopyTip('image-error')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('image-error') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('image-error')"
                :aria-label="famCopyTip('image-error')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('image-error')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <div class="wa-image-fit">
                  <a-image width="100%" height="100%" :preview="false" src="about:blank" alt="失败占位">
                    <template #error>
                      <div class="wa-image-error">
                        <icon-image class="wa-image-error__icon"></icon-image>
                        <span>加载失败</span>
                      </div>
                    </template>
                  </a-image>
                </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'image',
      members: ['image-default', 'image-preview', 'image-group', 'image-error'],
      setup: function (api) {
        var groupSrcList = [
          '../../assets/images/image_03.jpg',
          '../../assets/images/image_04.jpg',
          '../../assets/images/image_05.jpg',
        ]
        var groupCurrent = api.ref(0)
        var groupVisible = api.ref(false)
        function publishPager(visible) {
          if (typeof window.__WA_setImageGroupPager === 'function') {
            window.__WA_setImageGroupPager(
              groupCurrent.value + 1,
              groupSrcList.length,
              visible !== false
            )
          }
        }
        return {
          groupSrcList: groupSrcList,
          groupCurrent: groupCurrent,
          groupVisible: groupVisible,
          openGroupPreview: function () {
            /* 受控打开：避开 Arco 子图自增 id 与 src-list 下标撞车，始终从第一张起 */
            groupCurrent.value = 0
            groupVisible.value = true
            publishPager(true)
          },
          onGroupChange: function (index) {
            groupCurrent.value = index
            publishPager(true)
          },
          onGroupVisibleChange: function (visible) {
            groupVisible.value = !!visible
            if (!visible) groupCurrent.value = 0
            publishPager(!!visible)
          },
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
