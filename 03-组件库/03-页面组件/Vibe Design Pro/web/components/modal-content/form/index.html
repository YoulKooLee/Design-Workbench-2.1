<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>表单内容对话框 · modal-content-form</title>
  <link rel="stylesheet" href="../../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../../index.css" />
</head>
<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="modal-content-form">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">表单内容对话框</span>
        <span class="wa-comp-meta__slug">modal-content-form</span>
      </div>
      <div class="wa-embed__stage">
        <a-button type="secondary" @click="visible = true">打开示例</a-button>
        <a-modal
          v-model:visible="visible"
          title="内容容器"
          title-align="start"
          :width="560"
          unmount-on-close
          modal-class="pro-content-modal"
          @cancel="visible = false"
        >
          <a-form :model="form" layout="vertical" class="mc-form">
            <a-form-item label="格式">
              <a-select v-model="form.format" placeholder="请选择格式" allow-clear>
                <a-option value="zip">ZIP 包</a-option>
                <a-option value="png">PNG 序列</a-option>
                <a-option value="pdf">PDF 文档</a-option>
              </a-select>
            </a-form-item>
            <a-form-item label="范围">
              <a-select v-model="form.scope" placeholder="请选择范围" allow-clear>
                <a-option value="current">当前主题</a-option>
                <a-option value="all">全部主题</a-option>
                <a-option value="selected">已选项</a-option>
              </a-select>
            </a-form-item>
            <a-form-item label="备注">
              <a-input v-model="form.note" placeholder="选填，补充说明" allow-clear></a-input>
            </a-form-item>
            <a-checkbox v-model="form.notify">导出后发送通知</a-checkbox>
          </a-form>
          <template #footer>
            <a-button shape="round" type="primary" @click="submit">提交</a-button>
            <a-button type="secondary" shape="round" @click="reset">重置</a-button>
          </template>
        </a-modal>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../../assets/common/js/fa-icons.js"></script>
  <script src="../../../assets/common/js/boot.js"></script>
  <script src="../../../../../assets/common/js/wa-prefs.js"></script>
  <script src="../prompts.inline.js"></script>
  <script src="../../copy-prompt.js?v=20261015q"></script>
  <script src="../../member.js?v=20261103a"></script>
  <script src="./component.js"></script>
</body>
</html>
