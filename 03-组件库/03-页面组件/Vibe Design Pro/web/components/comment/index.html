<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>评论 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />

</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="comment">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">comment</p>
          <h1 class="wa-fam-title">评论</h1>
          <p class="wa-fam-lead">讨论区与动态流中的评论展示，支持操作、嵌套与对齐。</p>
          <p class="wa-fam-lead">组件类型：default / nest / align</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="comment-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">评论</span><span class="wa-comp-meta__slug">comment-default</span></div>
              <a-tooltip :content="famCopyTip('comment-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('comment-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('comment-default')"
                :aria-label="famCopyTip('comment-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('comment-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-comment class="wa-comment" author="李明" datetime="刚刚">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_01.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">这个方案看起来不错，建议补充验收标准。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>12</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
              <a-comment class="wa-comment" author="王芳" datetime="5 分钟前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_02.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">同意，里程碑节点也写清楚会更好落地。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>8</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
              <a-comment class="wa-comment" author="陈浩" datetime="20 分钟前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_03.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">风险项我这边再核对一遍后再同步。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>3</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
              <a-comment class="wa-comment" author="赵敏" datetime="1 小时前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_04.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">文案语气可以再收敛一点，偏产品口径。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>6</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="comment-nest">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">嵌套评论</span><span class="wa-comp-meta__slug">comment-nest</span></div>
              <a-tooltip :content="famCopyTip('comment-nest')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('comment-nest') }]"

                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('comment-nest')"></icon-check>

                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-comment class="wa-comment" author="李明" datetime="1 小时前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_01.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">先抛一个问题，大家一起看。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>5</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
                <a-comment class="wa-comment" author="王芳" datetime="刚刚">
                  <template #avatar>
                    <a-avatar class="wa-comment-avatar" :size="32"><img alt="" src="../../assets/images/avatar_02.jpg" /></a-avatar>
                  </template>
                  <template #content>
                    <p class="wa-comment__body">同意，我补充一下数据口径。</p>
                  </template>
                  <template #actions>
                    <span class="wa-comment-action"><icon-star></icon-star><span>2</span></span>
                    <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                  </template>
                </a-comment>
              </a-comment>
              <a-comment class="wa-comment" author="李明" datetime="2 小时前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_01.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">另外，通知文案要不要一起评审？</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>7</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
                <a-comment class="wa-comment" author="王芳" datetime="1 小时前">
                  <template #avatar>
                    <a-avatar class="wa-comment-avatar" :size="32"><img alt="" src="../../assets/images/avatar_02.jpg" /></a-avatar>
                  </template>
                  <template #content>
                    <p class="wa-comment__body">要，我下午整理一版草稿。</p>
                  </template>
                  <template #actions>
                    <span class="wa-comment-action"><icon-star></icon-star><span>3</span></span>
                    <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                  </template>
                </a-comment>
              </a-comment>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="comment-align">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">右对齐评论</span><span class="wa-comp-meta__slug">comment-align</span></div>
              <a-tooltip :content="famCopyTip('comment-align')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('comment-align') }]"

                size="small"
                @click="copyPrompt('comment-align')"
                :aria-label="famCopyTip('comment-align')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('comment-align')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-comment class="wa-comment" align="right" author="李明" datetime="刚刚">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_01.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">时间与操作靠右，适合客服回复或作者侧气泡。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>8</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
              <a-comment class="wa-comment" align="right" author="王芳" datetime="3 分钟前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_02.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">已按你的口径改完，请再看一眼。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>5</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
              <a-comment class="wa-comment" align="right" author="陈浩" datetime="15 分钟前">
                <template #avatar>
                  <a-avatar class="wa-comment-avatar" :size="36"><img alt="" src="../../assets/images/avatar_03.jpg" /></a-avatar>
                </template>
                <template #content>
                  <p class="wa-comment__body">附件已更新到最新版本。</p>
                </template>
                <template #actions>
                  <span class="wa-comment-action"><icon-star></icon-star><span>2</span></span>
                  <span class="wa-comment-action"><icon-message></icon-message><span>回复</span></span>
                </template>
              </a-comment>
            </div>
          </div>
        </div>
      </div>
    </section>
