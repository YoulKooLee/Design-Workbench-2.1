<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>表单布局 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
  <link rel="stylesheet" href="./inline/component.css" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="form">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">form</p>
          <h1 class="wa-fam-title">表单布局</h1>
          <p class="wa-fam-lead">表单字段排布，含标签在左、标签在上，以及一行内的筛选条。</p>
          <p class="wa-fam-lead">组件类型：horizontal / vertical / inline</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="form">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">水平表单</span><span class="wa-comp-meta__slug">form</span></div>
              <a-tooltip :content="famCopyTip('form')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('form') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('form')"
                :aria-label="famCopyTip('form')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('form')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-form class="wa-form" :model="layoutForm" layout="horizontal" auto-label-width>
                  <a-form-item label="计划名称" field="name">
                    <a-input v-model="layoutForm.name" placeholder="请输入计划名称" allow-clear />
                  </a-form-item>
                  <a-form-item label="投放渠道" field="channel">
                    <a-select v-model="layoutForm.channel" :options="channelOptions" placeholder="请选择" allow-clear />
                  </a-form-item>
                  <a-form-item label="备注" field="remark">
                    <a-textarea v-model="layoutForm.remark" placeholder="请输入备注" :auto-size="{ minRows: 2, maxRows: 4 }" />
                  </a-form-item>
                </a-form>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="form-vertical">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">垂直表单</span><span class="wa-comp-meta__slug">form-vertical</span></div>
              <a-tooltip :content="famCopyTip('form-vertical')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('form-vertical') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('form-vertical')"
                :aria-label="famCopyTip('form-vertical')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('form-vertical')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-form class="wa-form" :model="layoutFormVertical" layout="vertical">
                  <a-form-item label="计划名称" field="name">
                    <a-input v-model="layoutFormVertical.name" placeholder="请输入计划名称" allow-clear />
                  </a-form-item>
                  <a-form-item label="投放渠道" field="channel">
                    <a-select v-model="layoutFormVertical.channel" :options="channelOptions" placeholder="请选择" allow-clear />
                  </a-form-item>
                  <a-form-item label="备注" field="remark">
                    <a-textarea v-model="layoutFormVertical.remark" placeholder="请输入备注" :auto-size="{ minRows: 2, maxRows: 4 }" />
                  </a-form-item>
                </a-form>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="form-inline">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">行内表单</span><span class="wa-comp-meta__slug">form-inline</span></div>
              <a-tooltip :content="famCopyTip('form-inline')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('form-inline') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('form-inline')"
                :aria-label="famCopyTip('form-inline')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('form-inline')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-form class="wa-form" :model="inlineForm" layout="inline">
                  <a-form-item label="关键词" field="keyword">
                    <a-input v-model="inlineForm.keyword" placeholder="搜索计划" allow-clear />
                  </a-form-item>
                  <a-form-item label="状态" field="status">
                    <a-select v-model="inlineForm.status" :options="statusOptions" placeholder="请选择" style="width: 140px" />
                  </a-form-item>
                  <a-form-item hide-label>
                    <a-space>
                      <a-button type="primary">查询</a-button>
                      <a-button type="secondary" @click="inlineForm.keyword = ''; inlineForm.status = 'running'">重置</a-button>
                    </a-space>
                  </a-form-item>
                </a-form>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'form',
      members: ['form', 'form-vertical', 'form-inline'],
      slugDir: { form: 'horizontal', 'form-vertical': 'vertical', 'form-inline': 'inline' },
      setup: function (api) {
        return {
          layoutForm: api.ref({ name: '投放计划 A', channel: 'online', remark: '' }),
          layoutFormVertical: api.ref({ name: '投放计划 A', channel: 'online', remark: '' }),
          inlineForm: api.ref({ keyword: '', status: 'running' }),
          channelOptions: [
            { label: '线上', value: 'online' },
            { label: '线下', value: 'offline' },
            { label: '混合', value: 'hybrid' },
          ],
          statusOptions: [
            { label: '投放中', value: 'running' },
            { label: '已暂停', value: 'paused' },
            { label: '已结束', value: 'ended' },
          ],
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
