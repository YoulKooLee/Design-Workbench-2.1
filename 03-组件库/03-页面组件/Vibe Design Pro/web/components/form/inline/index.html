<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

<body class="wa-preview-embed">
  <div id="app" v-cloak>
    <article class="wa-card wa-embed wa-preview-stage" data-slug="form-inline">
      <div class="wa-comp-meta wa-preview-chrome">
        <span class="wa-comp-meta__name">行内表单</span>
        <span class="wa-comp-meta__slug">form-inline</span>
      </div>
      <div class="wa-embed__stage">
        <a-form class="wa-form" :model="form" layout="inline">
  <a-form-item label="关键词" field="keyword">
    <a-input v-model="form.keyword" placeholder="搜索计划" allow-clear />
  </a-form-item>
  <a-form-item label="状态" field="status">
    <a-select v-model="form.status" :options="statusOptions" placeholder="请选择" style="width: 140px" />
  </a-form-item>
  <a-form-item hide-label>
    <a-space>
      <a-button type="primary">查询</a-button>
      <a-button type="secondary" @click="form.keyword = ''; form.status = 'running'">重置</a-button>
    </a-space>
  </a-form-item>
</a-form>
      </div>
    </article>
  </div>
  <script src="../../../vendor/vue/vue.global.prod.js"></script>
