<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>气泡确认 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="popconfirm">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">popconfirm</p>
          <h1 class="wa-fam-title">气泡确认</h1>
          <p class="wa-fam-lead">轻量二次确认，适合删除行内操作无需整页对话框。</p>
          <p class="wa-fam-lead">组件类型：default / bottom / left / right / info</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="popconfirm-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">气泡确认</span><span class="wa-comp-meta__slug">popconfirm-default</span></div>
              <a-tooltip :content="famCopyTip('popconfirm-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('popconfirm-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('popconfirm-default')"
                :aria-label="famCopyTip('popconfirm-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('popconfirm-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-popconfirm
                :ok-button-props="{ type: 'primary', shape: 'round', size: 'mini' }"
                :cancel-button-props="{ type: 'secondary', shape: 'round', size: 'mini' }"
                @ok="onOk"
              >
                <a-button type="secondary" status="danger">删除确认</a-button>
                <template #content>
                  <div class="wa-popconfirm-title">确认删除？</div>
                  <p class="wa-popconfirm-desc">删除后不可恢复，请确认是否继续。</p>
                </template>
              </a-popconfirm>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="popconfirm-bottom">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">下方气泡确认</span><span class="wa-comp-meta__slug">popconfirm-bottom</span></div>
              <a-tooltip :content="famCopyTip('popconfirm-bottom')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('popconfirm-bottom') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('popconfirm-bottom')"
                :aria-label="famCopyTip('popconfirm-bottom')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('popconfirm-bottom')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-popconfirm
                position="bottom"
                :ok-button-props="{ type: 'primary', shape: 'round', size: 'mini' }"
                :cancel-button-props="{ type: 'secondary', shape: 'round', size: 'mini' }"
                @ok="onOk"
              >
                <a-button type="secondary">下方确认</a-button>
                <template #content>
                  <div class="wa-popconfirm-title">确认执行？</div>
                  <p class="wa-popconfirm-desc">气泡将显示在触发器下方。</p>
                </template>
              </a-popconfirm>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="popconfirm-left">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">左侧气泡确认</span><span class="wa-comp-meta__slug">popconfirm-left</span></div>
              <a-tooltip :content="famCopyTip('popconfirm-left')">

                type="secondary"
                size="small"
                @click="copyPrompt('popconfirm-left')"
                :aria-label="famCopyTip('popconfirm-left')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('popconfirm-left')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-popconfirm
                position="left"
                :ok-button-props="{ type: 'primary', shape: 'round', size: 'mini' }"
                :cancel-button-props="{ type: 'secondary', shape: 'round', size: 'mini' }"
                @ok="onOk"
              >
                <a-button type="secondary">左侧确认</a-button>
                <template #content>
                  <div class="wa-popconfirm-title">确认执行？</div>
                  <p class="wa-popconfirm-desc">气泡将显示在触发器左侧。</p>
                </template>
              </a-popconfirm>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="popconfirm-right">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">右侧气泡确认</span><span class="wa-comp-meta__slug">popconfirm-right</span></div>
              <a-tooltip :content="famCopyTip('popconfirm-right')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('popconfirm-right') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('popconfirm-right')"
                :aria-label="famCopyTip('popconfirm-right')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('popconfirm-right')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-popconfirm
                position="right"
                :ok-button-props="{ type: 'primary', shape: 'round', size: 'mini' }"
                :cancel-button-props="{ type: 'secondary', shape: 'round', size: 'mini' }"
                @ok="onOk"
              >
                <a-button type="secondary">右侧确认</a-button>
                <template #content>
                  <div class="wa-popconfirm-title">确认执行？</div>
                  <p class="wa-popconfirm-desc">气泡将显示在触发器右侧。</p>
                </template>
              </a-popconfirm>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="popconfirm-info">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">信息气泡确认</span><span class="wa-comp-meta__slug">popconfirm-info</span></div>
              <a-tooltip :content="famCopyTip('popconfirm-info')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('popconfirm-info') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('popconfirm-info')"
                :aria-label="famCopyTip('popconfirm-info')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('popconfirm-info')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-popconfirm
                type="info"
                :ok-button-props="{ type: 'primary', shape: 'round', size: 'mini' }"
                :cancel-button-props="{ type: 'secondary', shape: 'round', size: 'mini' }"
                @ok="onOk"
              >
                <a-button type="secondary">同步配置</a-button>
                <template #content>
                  <div class="wa-popconfirm-title">确认同步？</div>
                  <p class="wa-popconfirm-desc">将拉取最新配置并覆盖本地缓存。</p>
                </template>
              </a-popconfirm>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'popconfirm',
      members: [
        'popconfirm-default',
        'popconfirm-bottom',
        'popconfirm-left',
        'popconfirm-right',
        'popconfirm-info',
      ],
      setup: function (api) {
        return {
          onOk() {
            const Msg = window.ArcoVue && ArcoVue.Message
            if (Msg) Msg.success('已确认')
          },
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
