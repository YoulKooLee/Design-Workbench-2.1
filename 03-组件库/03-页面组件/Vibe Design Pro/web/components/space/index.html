<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>间距 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="space">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">space</p>
          <h1 class="wa-fam-title">间距</h1>
          <p class="wa-fam-lead">控件水平或换行间距容器，统一按钮组与标签组的间隙。</p>
          <p class="wa-fam-lead">组件类型：default / wrap</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="space-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">间距</span><span class="wa-comp-meta__slug">space-default</span></div>
              <a-tooltip :content="famCopyTip('space-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('space-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('space-default')"
                :aria-label="famCopyTip('space-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('space-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-space>
                  <a-button type="primary">主要</a-button>
                  <a-button type="secondary">中性</a-button>
                  <a-button type="outline">描边</a-button>
                </a-space>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="space-wrap">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">换行间距</span><span class="wa-comp-meta__slug">space-wrap</span></div>
              <a-tooltip :content="famCopyTip('space-wrap')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('space-wrap') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('space-wrap')"
                :aria-label="famCopyTip('space-wrap')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('space-wrap')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-space wrap style="max-width:220px">
                  <a-tag>标签一</a-tag>
                  <a-tag>标签二</a-tag>
                  <a-tag>标签三</a-tag>
                  <a-tag>标签四</a-tag>
                  <a-tag>标签五</a-tag>
                </a-space>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'space',
      members: ['space-default', 'space-wrap'],

    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
