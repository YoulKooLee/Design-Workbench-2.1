<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>步骤条 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="steps">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">steps</p>
          <h1 class="wa-fam-title">步骤条</h1>
          <p class="wa-fam-lead">多步流程导航，展示当前进度并引导完成待办步骤。</p>
          <p class="wa-fam-lead">组件类型：default / dot / vertical / arrow</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="steps-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">步骤条</span><span class="wa-comp-meta__slug">steps-default</span></div>
              <a-tooltip :content="famCopyTip('steps-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('steps-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('steps-default')"
                :aria-label="famCopyTip('steps-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('steps-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-steps-stack">
              <a-steps
                v-for="c in stepDemos"
                :key="'default-' + c"
                :current="c"
                small
                label-placement="vertical"
              >
                <a-step
                  v-for="i in stepCount"
                  :key="i"
                  :title="stepTitle(c, i)"
                ></a-step>
              </a-steps>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="steps-dot">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">点状步骤条</span><span class="wa-comp-meta__slug">steps-dot</span></div>
              <a-tooltip :content="famCopyTip('steps-dot')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('steps-dot') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('steps-dot')"
                :aria-label="famCopyTip('steps-dot')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('steps-dot')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-steps-stack">
              <a-steps
                v-for="c in stepDemos"
                :key="'dot-' + c"
                type="dot"
                :current="c"
                label-placement="vertical"
              >
                <a-step
                  v-for="(title, idx) in dotStepTitles"
                  :key="title"
                  :title="title"
                  :description="dotStepDesc(c, idx + 1)"
                ></a-step>
              </a-steps>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="steps-vertical">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">纵向步骤条</span><span class="wa-comp-meta__slug">steps-vertical</span></div>
              <a-tooltip :content="famCopyTip('steps-vertical')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('steps-vertical') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('steps-vertical')"
                :aria-label="famCopyTip('steps-vertical')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('steps-vertical')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-steps-vertical-row">
              <a-steps
                v-for="c in stepDemos"
                :key="'vertical-' + c"
                direction="vertical"
                small
                :current="c"
              >
                <a-step
                  v-for="i in stepCount"
                  :key="i"
                  :title="stepTitle(c, i)"
                  description="步骤的描述信息"
                ></a-step>
              </a-steps>
            </div>
          </div>

          <div class="wa-fam-card" data-slug="steps-arrow">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">箭头步骤条</span><span class="wa-comp-meta__slug">steps-arrow</span></div>
              <a-tooltip :content="famCopyTip('steps-arrow')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('steps-arrow') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('steps-arrow')"
                :aria-label="famCopyTip('steps-arrow')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('steps-arrow')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage wa-steps-stack">
              <a-steps
                v-for="c in stepDemos"
                :key="'arrow-' + c"
                type="arrow"
                small
                :current="c"
              >
                <a-step v-for="i in stepCount" :key="i">
                  <span class="wa-steps-arrow__mark">
                    <icon-check v-if="i < c"></icon-check>
                    <span v-else>{{ i }}</span>
                  </span>
                  <span>{{ stepTitle(c, i) }}</span>
                </a-step>
              </a-steps>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'steps',
      members: ['steps-default', 'steps-dot', 'steps-vertical', 'steps-arrow'],
      setup: function (api) {
        var stepCount = 4
        var stepDemos = [1, 2, 3, 4]
        var dotStepTitles = ['提交申请', '部门审批', '行政审批', '申请成功']
        function stepTitle(current, index) {
          if (index < current) return '已完成'
          if (index === current) return '进行中'
          return '待进行'
        }
        function dotStepDesc(current, index) {
          return index <= current ? '2020-10-14 12:00' : '等待审批'
        }
        return {
          stepCount: stepCount,
          stepDemos: stepDemos,
          dotStepTitles: dotStepTitles,
          stepTitle: stepTitle,
          dotStepDesc: dotStepDesc,
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
