<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
<script src="../../assets/common/js/theme.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>页头 · 家族对照</title>
  <link rel="stylesheet" href="../../vendor/arco/css/arco.css" />
  <link rel="stylesheet" href="../../assets/common/css/chrome.css" />
  <link rel="stylesheet" href="../../assets/common/css/global.css" />
  <link rel="stylesheet" href="../../vendor/fontawesome/css/all.min.css" />
  <link rel="stylesheet" href="../../assets/common/css/fa-icons.css" />
  <link rel="stylesheet" href="../../assets/common/css/components.css" />
  <link rel="stylesheet" href="../index.css?v=20261014pro" />
</head>
<body>
  <div id="app" v-cloak>
    <section class="wa-fam-section wa-fam-fade-in" data-family="page-header">
      <div class="wa-fam-section__inner">
        <header class="wa-fam-head">
          <p class="wa-fam-kicker">page-header</p>
          <h1 class="wa-fam-title">页头</h1>
          <p class="wa-fam-lead">详情页顶部标题区，可带回退、副标题与右侧操作。</p>
          <p class="wa-fam-lead">组件类型：default / extra / breadcrumb / content</p>
        </header>

        <div class="wa-fam-grid">
          <div class="wa-fam-card" data-slug="page-header-default">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">页头</span><span class="wa-comp-meta__slug">page-header-default</span></div>
              <a-tooltip :content="famCopyTip('page-header-default')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('page-header-default') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('page-header-default')"
                :aria-label="famCopyTip('page-header-default')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('page-header-default')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-page-header
                class="wa-page-header-demo"
                title="账户设置"
                :show-back="false"
              ></a-page-header>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="page-header-extra">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">带操作页头</span><span class="wa-comp-meta__slug">page-header-extra</span></div>
              <a-tooltip :content="famCopyTip('page-header-extra')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('page-header-extra') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('page-header-extra')"
                :aria-label="famCopyTip('page-header-extra')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('page-header-extra')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-page-header
                class="wa-page-header-demo"
                title="项目详情"
                subtitle="演示项目 A"
                :show-back="true"
                @back="onBack"
              >
                <template #extra>
                  <a-space>
                    <a-button type="secondary" size="small">编辑</a-button>
                    <a-button type="primary" size="small">发布</a-button>
                  </a-space>
                </template>
              </a-page-header>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="page-header-breadcrumb">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">带面包屑页头</span><span class="wa-comp-meta__slug">page-header-breadcrumb</span></div>
              <a-tooltip :content="famCopyTip('page-header-breadcrumb')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('page-header-breadcrumb') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('page-header-breadcrumb')"
                :aria-label="famCopyTip('page-header-breadcrumb')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('page-header-breadcrumb')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-page-header
                class="wa-page-header-demo"
                title="订单详情"
                subtitle="ORD-20260328"
                :show-back="true"
                @back="onBack"
              >
                <template #breadcrumb>
                  <a-breadcrumb>
                    <a-breadcrumb-item><icon-home></icon-home>首页</a-breadcrumb-item>
                    <a-breadcrumb-item>订单</a-breadcrumb-item>
                    <a-breadcrumb-item>详情</a-breadcrumb-item>
                  </a-breadcrumb>
                </template>
                <template #extra>
                  <a-button type="primary" size="small">导出</a-button>
                </template>
              </a-page-header>
            </div>
          </div>
          <div class="wa-fam-card" data-slug="page-header-content">
            <div class="wa-fam-card__top">
              <div class="wa-comp-meta"><span class="wa-comp-meta__name">带内容页头</span><span class="wa-comp-meta__slug">page-header-content</span></div>
              <a-tooltip :content="famCopyTip('page-header-content')">
              <a-button
                :class="['wa-fam-copy', { 'wa-fam-copy--locked': copyLocked, 'is-copied': famCopied('page-header-content') }]"
                type="secondary"
                size="small"
                @click="copyPrompt('page-header-content')"
                :aria-label="famCopyTip('page-header-content')"
              >
                <span class="wa-fam-copy__inner" v-if="copyLocked">
                  <icon-lock></icon-lock>
                  <span class="wa-fam-copy__label">需要权限</span>
                </span>
                <span class="wa-fam-copy__inner" v-else>
                  <icon-check v-if="famCopied('page-header-content')"></icon-check>
                  <icon-copy v-else></icon-copy>
                  <span class="wa-fam-copy__label">提示词</span>
                </span>
              </a-button>
              </a-tooltip>
            </div>
            <div class="wa-fam-card__stage">
              <a-page-header
                class="wa-page-header-demo"
                title="帮助中心"
                subtitle="使用指南"
                :show-back="true"
                @back="onBack"
              >
                <template #extra>
                  <a-button type="primary" size="small">反馈</a-button>
                </template>
                <div class="wa-page-header-demo__body">
                  本页汇总常见问题与操作步骤，点击返回可回到上一级列表。
                </div>
              </a-page-header>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../../vendor/vue/vue.global.prod.js"></script>
  <script src="../../vendor/arco/arco-vue.min.js"></script>
  <script src="../../assets/common/js/fa-icons.js"></script>
  <script src="../../assets/common/js/boot.js"></script>
  <script src="../../../../assets/common/js/wa-prefs.js"></script>
  <script src="./prompts.inline.js"></script>
  <script>
    window.WA_FAMILY = {
      id: 'page-header',
      members: ['page-header-default', 'page-header-extra', 'page-header-breadcrumb', 'page-header-content'],
      setup: function () {
        return {
          onBack: function () {
            if (window.ArcoVue && ArcoVue.Message) ArcoVue.Message.info('返回上一级')
          },
        }
      },
    }
  </script>
  <script src="../copy-prompt.js?v=20261015q"></script>
  <script src="../family.js?v=20261103a"></script>
</body>
</html>
