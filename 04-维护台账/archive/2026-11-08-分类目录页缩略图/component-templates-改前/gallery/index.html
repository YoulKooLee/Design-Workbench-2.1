<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>组件画廊 Gallery</title>
<link rel="stylesheet" href="../_kit/theme.css">
<style>
  :root {
    --g-bg: #0d0d12;
    --g-panel: #14141b;
    --g-card: #17171f;
    --g-border: #26262f;
    --g-text: #e8e8ef;
    --g-dim: #8b8b99;
    --g-accent: #7c5cff;
    --g-accent-2: #9d85ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--g-bg); color: var(--g-text);
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }

  .g-top { display: flex; align-items: baseline; gap: 12px; padding: 18px 22px 0; }
  .g-top h1 { margin: 0; font-size: 17px; font-weight: 700; }
  .g-top h1 em { font-style: normal; color: var(--g-accent-2); }
  .g-top .stat { font-size: 12px; color: var(--g-dim); }
  .g-top .hint { margin-left: auto; font-size: 11px; color: var(--g-dim); }

  .g-layout { display: flex; gap: 16px; padding: 14px 22px 26px; align-items: flex-start; }

  /* 左侧栏 */
  .g-side { width: 190px; flex: none; position: sticky; top: 12px; }
  .g-search { width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--g-border);
    background: var(--g-panel); color: var(--g-text); font-size: 12px; outline: none; }
  .g-search:focus { border-color: var(--g-accent); }
  .g-cats { margin-top: 10px; overflow-y: auto; max-height: calc(100vh - 150px); padding-right: 4px; }
  .g-cat { display: flex; justify-content: space-between; align-items: center; width: 100%;
    padding: 6px 10px; margin-bottom: 2px; border: 0; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--g-dim); font-size: 12px; text-align: left; }
  .g-cat:hover { background: #1c1c26; color: var(--g-text); }
  .g-cat.on { background: var(--g-accent); color: #fff; font-weight: 600; }
  .g-cat .n { font-size: 10px; opacity: .75; font-variant-numeric: tabular-nums; }

  /* 卡片网格 */
  .g-main { flex: 1; min-width: 0; }
  .g-group-title { font-size: 13px; font-weight: 700; margin: 14px 0 8px; }
  .g-group-title:first-child { margin-top: 0; }
  .g-grid { display: grid; grid-template-columns: repeat(auto-fill, 240px); gap: 14px; }
  .g-card { width: 240px; background: var(--g-card); border: 1px solid var(--g-border);
    border-radius: 10px; overflow: hidden; transition: border-color .15s, transform .15s; }
  .g-card:hover { border-color: var(--g-accent); transform: translateY(-2px); }

  .g-thumb { position: relative; width: 240px; height: 150px; overflow: hidden;
    background: repeating-linear-gradient(45deg, #17171f 0 12px, #1a1a23 12px 24px); cursor: pointer; }
  .g-thumb iframe { position: absolute; top: 0; left: 0; width: 1200px; height: 750px;
    border: 0; transform: scale(0.2); transform-origin: 0 0; pointer-events: none;
    opacity: 0; transition: opacity .3s; background: #fff; }
  .g-thumb.loaded iframe { opacity: 1; }
  .g-thumb .badge { position: absolute; top: 6px; right: 6px; z-index: 2; padding: 1px 7px;
    border-radius: 99px; background: rgba(124,92,255,.92); color: #fff; font-size: 10px; }
  .g-actions { position: absolute; inset: 0; z-index: 3; display: flex; gap: 8px;
    align-items: center; justify-content: center; background: rgba(10,10,15,.55);
    opacity: 0; transition: opacity .15s; }
  .g-thumb:hover .g-actions { opacity: 1; }
  .g-btn { padding: 4px 12px; border-radius: 7px; border: 0; cursor: pointer; font-size: 11px; }
  .g-btn.pri { background: var(--g-accent); color: #fff; }
  .g-btn.gho { background: #2a2a35; color: var(--g-text); }

  .g-meta { padding: 8px 10px 10px; }
  .g-meta .t { font-size: 12px; font-weight: 600; }
  .g-meta .d { font-size: 10px; color: var(--g-dim); margin-top: 2px;
    font-family: Consolas, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .g-empty { padding: 60px 0; text-align: center; color: var(--g-dim); font-size: 13px; }

  /* toast */
  .g-toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1d2a1d; border: 1px solid #2f5c2f; color: #b8ecb8; padding: 7px 16px;
    border-radius: 8px; font-size: 12px; z-index: 99; max-width: 80vw;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
</style>
</head>
<body>
<div id="root"></div>
<script type="module" src="./index.tsx"></script>
</body>
</html>
