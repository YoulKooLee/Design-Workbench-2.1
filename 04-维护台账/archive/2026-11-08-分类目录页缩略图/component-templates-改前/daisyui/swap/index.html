<h1>swap · 图标互换</h1>
<div class="meta">主类 <code>swap</code>　修饰 <code>swap-rotate</code> <code>swap-flip</code> <code>swap-active</code><br>场景：展开/收起、开/关按钮的图标切换</div>
<div class="demo"><label class="swap swap-rotate"><input type="checkbox" class="swap-toggle" checked=""/><div class="swap-on text-warning text-2xl">☀</div><div class="swap-off text-primary text-2xl">☾</div></label><label class="swap swap-active"><div class="swap-on badge badge-success">展开</div><div class="swap-off badge badge-ghost">收起</div></label></div>
<div class="usage">写类名即用，不 import：&lt;div class="swap …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：无（daisyUI 独有）</div>
</body>
