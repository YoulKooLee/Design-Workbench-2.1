<h1>indicator · 角标定位</h1>
<div class="meta">主类 <code>indicator</code>　修饰 <code>indicator-top</code> <code>indicator-end</code><br>场景：按钮右上角未读数、图标红点</div>
<div class="demo"><div class="indicator"><span class="indicator-item badge badge-error">3</span><div class="bg-base-200 rounded-box p-6 w-44 text-xs grid place-content-center">机房 A · 空调外机</div></div><div class="indicator"><span class="indicator-item indicator-bottom badge badge-success badge-soft">在线</span><div class="bg-base-200 rounded-box p-6 w-44 text-xs grid place-content-center">机房 B · 新风机组</div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="indicator …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：基础/Badge(角标)</div>
