<h1>table · 表格</h1>
<div class="meta">主类 <code>table</code>　修饰 <code>table-zebra</code> <code>table-pin-rows</code> <code>table-pin-cols</code> <code>table-xs~xl</code><br>场景：列表数据；斑马纹、表头固定</div>
<div class="demo"><table class="table table-zebra table-sm bg-base-100 rounded-box"><thead><tr><th>设备</th><th>状态</th><th>负载</th></tr></thead><tbody><tr><td>空调外机 01</td><td><span class="badge badge-success badge-soft badge-sm">运行</span></td><td>62%</td></tr><tr><td>空调外机 02</td><td><span class="badge badge-error badge-sm">故障</span></td><td>—</td></tr><tr><td>新风机组</td><td><span class="badge badge-warning badge-soft badge-sm">亚健康</span></td><td>81%</td></tr></tbody></table></div>
<div class="usage">写类名即用，不 import：&lt;div class="table …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：数据展示/DataTable</div>
