<h1>label · 标签/浮动标签</h1>
<div class="meta">主类 <code>label</code> <code>floating-label</code>　修饰 —<br>场景：字段标题、说明文字、浮动标签容器</div>
<div class="demo"><label class="label cursor-pointer gap-2 w-fit"><input type="checkbox" class="checkbox checkbox-primary" checked=""/><span class="label-text text-xs">巡检完成后通知我</span></label><label class="label text-xs opacity-60">提示文字也可以单独用 label</label></div>
<div class="usage">写类名即用，不 import：&lt;div class="label floating-label …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：表单/FormField</div>
