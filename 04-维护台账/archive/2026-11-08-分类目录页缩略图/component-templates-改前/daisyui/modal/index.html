<h1>modal · 弹窗</h1>
<div class="meta">主类 <code>modal</code>　修饰 <code>modal-open</code> <code>modal-top</code> <code>modal-bottom</code><br>场景：确认、表单弹窗；用原生 dialog，关闭不改状态</div>
<div class="demo"><div class="modal modal-open"><div class="modal-box w-80"><h3 class="text-base font-semibold">确认派单？</h3><p class="py-2 text-xs opacity-70">将创建检修工单并通知运维班。</p><div class="modal-action"><button class="btn btn-sm">取消</button><button class="btn btn-sm btn-primary">确认</button></div></div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="modal …"&gt;…&lt;/div&gt;
对应 Codebuddy Design：反馈/Modal</div>
