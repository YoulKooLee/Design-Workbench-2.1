<h1>chat · 对话气泡</h1>
<div class="meta">主类 <code>chat</code>　修饰 <code>chat-start</code> <code>chat-end</code> <code>chat-bubble-primary</code><br>场景：IM、客服、AI 对话记录</div>
<div class="demo"><div class="chat chat-start"><div class="chat-bubble text-xs">B 栋空调告警确认了吗？</div></div><div class="chat chat-end"><div class="chat-bubble chat-bubble-primary text-xs">已确认，检修工单已派发。</div></div><div class="chat chat-start"><div class="chat-bubble chat-bubble-warning text-xs">今晚 22:00 计划检修，请留意。</div></div></div>
<div class="usage">写类名即用，不 import：&lt;div class="chat …"&gt;…&lt;/div&gt;
